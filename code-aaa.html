*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:#020204;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}button{font:inherit}button:focus-visible{outline:2px solid #fff;outline-offset:4px}.app{min-height:100svh;background:radial-gradient(circle at 50% -10%,rgba(111,67,255,.22),transparent 34%),radial-gradient(circle at 100% 50%,rgba(78,140,255,.07),transparent 32%),#020204}.shell{position:relative;z-index:1;width:min(1180px,100%);min-height:100svh;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;flex-direction:column}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:4px 2px 14px}.brand{font-size:clamp(19px,2vw,26px);font-weight:950;letter-spacing:.15em}.brand span{color:#b996ff}.progress{justify-self:center;width:min(430px,100%);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);backdrop-filter:blur(18px)}.ptext{font-size:10px;font-weight:900;white-space:nowrap}.track{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#6634d8,#8d5aff,#c2a5ff);transition:width .5s var(--ease);box-shadow:0 0 18px rgba(138,92,255,.55)}.pct{font-size:10px;color:#c5c0ce;min-width:35px;text-align:right}.board{position:relative;flex:1;border:1px solid rgba(145,101,255,.48);border-radius:30px;overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(128,75,255,.08),transparent 38%),linear-gradient(180deg,#07070a,#040406);box-shadow:0 35px 90px rgba(0,0,0,.72),0 0 75px rgba(80,38,190,.09),inset 0 1px 0 rgba(255,255,255,.1)}.board:before{content:"";position:absolute;inset:0;pointer-events:none;background:li m:uppercase;margin-bottom:16px}.hero{font-size:clamp(36px,6vw,72px);line-height:.98;letter-spacing:-.045em;font-weight:950;margin:0}.lead{font-size:clamp(16px,2vw,21px);line-height:1.5;color:#ded9e5;max-width:760px;margin:22px auto 0}.lesson{max-width:860px;margin:8vh auto 0;text-align:center}.lesson h2{font-size:clamp(30px,5vw,60px);line-height:1.02;letter-spacing:-.035em;margin:0}.lesson p{font-size:clamp(16px,2vw,20px);line-height:1.55;color:#d0cbd6;max-width:720px;margin:20px auto}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}.question{max-width:900px;margin:auto;width:100%}.qmeta{font-size:10px;font-weight:950;letter-spacing:.16em;color:#bca9e8;margin-bottom:14px}.qtitle{font-size:clamp(29px,4.5vw,56px);line-height:1.04;letter-spacing:-.035em;margin:0 0 28px}.answers{display:grid;gap:12px}.answer{position:relative;display:grid;grid-template-columns:54px 1fr;align-items:center;text-align:left;min-height:82px;padding:14px 18px;border-radius:22px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(135deg,rgba(255,255,255,.045),rgba(255,255,255,.018));color:#fff;cursor:pointer;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}.answer:hover{transform:translateY(-2px);border-color:rgba(194,165,255,.5);background:linear-gradient(135deg,rgba(138,92,255,.12),rgba(255,255,255,.025))}.answer.selected{border-color:#b996ff;box-shadow:0 0 28px rgba(138,92,255,.2),inset 0 1px 0 rgba(255,255,255,.1)}.gem{width:38px;height:38px;transform:rotate(45deg);border-radius:9px;background:linear-gradient(145deg,#fff,#b996ff 45%,#5424b5);box-shadow:0 0 18px rgba(138,92,255,.35);display:grid;place-items:center}.gem span{transform:rotate(-45deg);color:#120a24;font-weight:950}.answer strong{font-size:16px;line-height:1.3}.answer small{display:block;color:#bdb8c5;margin-top:4px}.insight{max-width:780px;margin:auto;text-align:center;padding:34px 28px;border-radius:42% 58% 55% 45%/48% 42% 58% 52%;background:radial-gradient(circle at 35% 25%,rgba(194,165,255,.18),rgba(138,92,255,.07) 42%,rgba(255,255,255,.025) 70%);border:1px solid rgba(194,165,255,.2);box-shadow:0 0 65px rgba(138,92,255,.12),inset 0 1px 0 rgba(255,255,255,.08)}.insight h3{margin:0 0 12px;font-size:11px;letter-spacing:.18em;color:#d0bbff}.insight p{font-size:clamp(19px,3vw,30px);line-height:1.22;margin:0;font-weight:800}.bottom{display:flex;justify-content:flex-end;margin-top:24px}.discovery{max-width:1040px;margin:auto;width:100%}.discover-head{text-align:center;margin-bottom:25px}.discover-head h1{font-size:clamp(34px,5vw,60px);line-height:1;margin:0}.discover-head p{color:#d1ccd7;line-height:1.5;max-width:700px;margin:15px auto}.boardnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:15px 0 22px}.arrow{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#0b0b0f;color:#fff;cursor:pointer;font-size:22px}.arrow:disabled{opacity:.25}.dots{display:flex;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:#484351}.dot.active{background:#b996ff;box-shadow:0 0 12px #8a5cff}.interest-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.interest{min-height:130px;text-align:left;padding:18px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));color:#fff;cursor:pointer;transition:.2s}.interest:hover{transform:translateY(-2px);border-color:rgba(194,165,255,.45)}.interest.selected{border-color:#b996ff;background:linear-gradient(145deg,rgba(138,92,255,.16),rgba(255,255,255,.025));box-shadow:0 0 28px rgba(138,92,255,.12)}.interest .icon{font-size:26px;margin-bottom:10px}.interest strong{display:block;font-size:16px}.interest span{display:block;color:#bcb7c4;font-size:12px;margin-top:5px;line-height:1.35}.discover-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:25px}.results{max-width:1000px;margin:auto;width:100%}.scorehero{text-align:center;padding:15px 0 35px}.score-ring{width:min(250px,65vw);aspect-ratio:1;margin:0 auto 20px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#b996ff calc(var(--score)*1%),rgba(255,255,255,.08) 0);position:relative;box-shadow:0 0 65px rgba(138,92,255,.16)}.score-ring:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#050507;box-shadow:inset 0 0 35px rgba(138,92,255,.08)}.score-number{position:relative;font-size:clamp(62px,11vw,100px);font-weight:950;letter-spacing:-.06em}.score-label{font-size:12px;letter-spacing:.2em;font-weight:950;color:#c8b6ec}.result-copy{font-size:clamp(18px,2.5vw,24px);line-height:1.4;color:#e4dfea;max-width:760px;margin:15px auto}.spectrum{margin:20px auto 40px;max-width:820px}.spectrumbar{height:18px;border-radius:99px;background:linear-gradient(90deg,#8a5cff 0 49%,#4e8cff 49% 74%,#35e39b 74% 89%,#ffd45a 89%);position:relative}.marker{position:absolute;top:50%;width:28px;height:28px;border-radius:50%;border:3px solid #fff;background:#08080b;transform:translate(-50%,-50%);box-shadow:0 0 25px rgba(255,255,255,.35)}.labels{display:flex;justify-content:space-between;margin-top:9px;font-size:11px;color:#c5bfca;font-weight:800}.section{margin:38px 0}.section h2{font-size:clamp(24px,3vw,36px);margin:0 0 16px}.meaning{color:#d3ced8;line-height:1.55;max-width:800px}.dims{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.dim{padding:16px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.025)}.dim strong{display:block;font-size:26px}.dim span{font-size:11px;color:#c2bdc9;line-height:1.3}.dimbar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;margin:10px 0}.dimfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#6634d8,#b996ff)}.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}.feature{padding:25px;border-radius:30px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018))}.feature .tag{font-size:10px;letter-spacing:.16em;font-weight:950;color:#b996ff}.feature h3{font-size:24px;margin:9px 0}.feature p{color:#d0cbd6;line-height:1.5;margin:0}.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:20px;border-left:2px solid #8a5cff;background:rgba(255,255,255,.025);border-radius:0 20px 20px 0}.mini strong{display:block;margin-bottom:7px}.mini p{margin:0;color:#d0cbd6;line-height:1.45}.naya-result{padding:28px;border-radius:30px;border:1px solid rgba(194,165,255,.28);background:radial-gradient(circle at 20% 0%,rgba(138,92,255,.13),transparent 45%),rgba(255,255,255,.025);display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}.naya-result .orb{width:58px;height:58px}.naya-text{font-size:18px;line-height:1.5;color:#e7e2eb}.path{display:grid;gap:12px}.step{display:grid;grid-template-columns:40px 1fr;gap:14px;padding:18px;border-bottom:1px solid rgba(255,255,255,.08)}.stepnum{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(138,92,255,.16);border:1px solid rgba(194,165,255,.35);font-weight:950}.step h3{margin:0 0 5px}.step p{margin:0;color:#cbc6d1;line-height:1.45}.offer{text-align:center;padding:35px 20px;border:1px solid rgba(194,165,255,.28);border-radius:32px;background:radial-gradient(circle at 50% 0,rgba(138,92,255,.14),transparent 48%),rgba(255,255,255,.025)}.offer h2{font-size:clamp(28px,4vw,44px);margin:0}.offer p{max-width:650px;margin:14px auto 22px;color:#d0cbd6;line-height:1.5}.reportbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:22px 0 8px}.secondary{background:transparent;border-color:rgba(255,255,255,.18)}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px;border:1px solid var(--line);border-radius:999px;background:#101016;color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.5);transition:.25s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}.live-region{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){.top{grid-template-columns:1fr auto}.progress{grid-column:1/-1;grid-row:2;width:100%}.command{margin-bottom:18px}.ncopy small{display:none}.naya{padding-right:9px}.ncopy strong{font-size:12px}.interest-grid{grid-template-columns:repeat(2,1fr)}.dims{grid-template-columns:repeat(2,1fr)}.duo,.insights{grid-template-columns:1fr}.naya-result{grid-template-columns:1fr;text-align:center}.naya-result .orb{margin:auto}.answer{grid-template-columns:46px 1fr;min-height:76px}.hero{font-size:clamp(34px,11vw,55px)}.board{border-radius:24px}.content{padding:20px 15px}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{body{background:#fff;color:#111}.app{background:#fff}.shell{width:100%;padding:0}.top,.command,.footer-actions,.reportbar,.offer .btn,.discover-actions{display:none!important}.board{border:0;box-shadow:none;background:#fff;overflow:visible}.content{padding:0}.results{max-width:none}.section,.feature,.mini,.dim,.naya-result{break-inside:avoid;color:#111;background:#fff;border-color:#ccc}.result-copy,.meaning,.feature p,.mini p,.step p,.naya-text{color:#333}.score-ring:before{background:#fff}.spectrumbar{print-color-adjust:exact;-webkit-print-color-adjust:exact}}

<script>
'use strict';
const A={id:'ai-mastery',version:'AAA-1.0.0',title:'AI Mastery Assessment',dimensions:[
{id:'direction',name:'Direction',weight:1,icon:'⌁'},
{id:'communication',name:'Communication',weight:1,icon:'◈'},
{id:'evaluation',name:'Evaluation',weight:1,icon:'◉'},
{id:'iteration',name:'Iteration',weight:1,icon:'↻'},
{id:'systems',name:'Systems Thinking',weight:1,icon:'✦'}],
interests:[
['writing','✎','Writing & Communication','Write, edit, clarify, and communicate'],['research','⌕','Research & Information','Find, compare, synthesize, and verify'],['ideas','✦','Brainstorming & Ideas','Generate and develop stronger ideas'],['content','◫','Content Creation','Create posts, scripts, newsletters, and more'],['business','◈','Business & Strategy','Think strategically and make better decisions'],['marketing','◆','Marketing & Sales','Position, promote, sell, and connect'],['learning','◎','Learning & Education','Learn faster and teach more clearly'],['coding','⌘','Coding & Software','Build, debug, automate, and ship'],['images','◌','Images & Visual Creation','Create visuals, concepts, and design'],['video','▶','Video & Media','Plan, create, edit, and publish media'],['data','▦','Data & Analysis','Analyze information and find patterns'],['productivity','⚡','Productivity & Automation','Reduce friction and automate work'],['business_ops','◇','Operations & Workflows','Build repeatable systems'],['personal','♡','Personal Growth','Reflect, plan, and develop yourself'],['career','↗','Career & Professional Growth','Build skills, opportunities, and confidence'],['education','△','Knowledge & Teaching','Turn knowledge into useful experiences'],['creative','✧','Creative Exploration','Explore possibilities and make new things'],['life','∞','Life & Everyday AI','Use AI for everyday decisions and life']
],
questions:[
{id:'destination',d:'direction',label:'AI DIRECTION',teaching:'AI becomes dramatically more useful when you define the destination before asking for the route.',question:'How clearly do you define the outcome you want AI to help you achieve?',answers:[['I usually know exactly what success should look like.','I can describe the result before we begin.',4],['I have a general idea, then refine it with AI.','The destination becomes clearer as I work.',3],['I usually start asking and see what happens.','The goal often emerges during the conversation.',2],['I rarely define the outcome.','I mostly react to whatever AI gives me.',1]],insight:'Great AI work starts with a clear destination. The clearer the outcome, the more useful every step becomes.'},
{id:'communication',d:'communication',label:'AI COMMUNICATION',teaching:'AI cannot reliably read your mind. Context, audience, constraints, examples, and desired outcomes dramatically reduce misunderstanding.',question:'How clearly do you communicate what you want AI to understand, create, or change?',answers:[['I give rich context, constraints, examples, and intent.','AI usually understands what I mean.',4],['I explain the important parts and refine when needed.','Most conversations get there quickly.',3],['I give short instructions and correct the result.','I rely on iteration to fill in missing context.',2],['I often expect AI to infer what I mean.','Misunderstandings are common.',1]],insight:'AI is powerful, but clarity is still a human advantage. Better direction creates better collaboration.'},
{id:'context',d:'direction',label:'CONTEXT',teaching:'Context changes the quality of an AI response. The same request can produce completely different work depending on who, why, where, and under what constraints.',question:'How deliberately do you give AI the context it needs to make a useful decision?',answers:[['I intentionally provide the relevant context.','I think about what AI needs to know.',4],['I provide context when I notice a response is off.','I add information as needed.',3],['I provide only the basic request.','AI often has to ask or guess.',2],['I rarely consider context.','I expect the tool to figure it out.',1]],insight:'Context is leverage. Giving AI the right information can be more powerful than writing a longer prompt.'},
{id:'evaluation',d:'evaluation',label:'AI EVALUATION',teaching:'A fluent answer is not automatically a good answer. Strong AI users evaluate accuracy, usefulness, reasoning, fit, and risk.',question:'How consistently do you evaluate an AI response before trusting or using it?',answers:[['I actively test, verify, and critique important outputs.','Quality matters more than fluency.',4],['I review important work and check obvious issues.','I verify when the stakes are higher.',3],['I mostly judge by whether it sounds right.','I sometimes catch problems later.',2],['I generally accept useful-looking answers.','I rarely evaluate deeply.',1]],insight:'AI can sound confident while being wrong. Evaluation is the skill that turns output into trustworthy work.'},
{id:'verification',d:'evaluation',label:'VERIFICATION',teaching:'The higher the consequence, the higher the verification standard should be. AI should accelerate thinking, not replace judgment.',question:'How do you handle important claims, facts, or recommendations produced by AI?',answers:[['I verify important claims with reliable sources or evidence.','I match verification to risk.',4],['I verify when something seems uncertain.','I use judgment about when to check.',3],['I verify occasionally.','Usually I trust the response unless it feels wrong.',2],['I rarely verify.','I generally assume the answer is accurate.',1]],insight:'Trust should be earned, not assumed. Verification lets you move quickly without becoming careless.'},
{id:'iteration',d:'iteration',label:'ITERATION',teaching:'The first AI output is a starting point, not a verdict. High-quality work emerges through direction, feedback, refinement, and evaluation.',question:'How often do you deliberately iterate with AI to improve an initial result?',answers:[['I routinely critique and refine outputs through multiple passes.','Iteration is part of my normal workflow.',4],['I iterate when the first result needs improvement.','I refine important work.',3],['I usually accept the first useful result.','I make only small corrections.',2],['I rarely iterate.','The first response is usually the finish line.',1]],insight:'Exceptional AI work is rarely one-shot. Iteration turns a decent first draft into something genuinely useful.'},
{id:'feedback',d:'iteration',label:'FEEDBACK',teaching:'AI improves when you can explain what is wrong and what better looks like. Specific feedback is a steering wheel.',question:'How specifically can you tell AI what to change when a result is not good enough?',answers:[['I can diagnose the weakness and give precise direction.','I know what better needs to accomplish.',4],['I can usually describe what feels off.','I refine the request from there.',3],['I mostly say I do not like it and try again.','The improvement process is less deliberate.',2],['I often start over without explaining the problem.','I struggle to steer the next attempt.',1]],insight:'“Make it better” is weak feedback. Naming the actual weakness gives AI something useful to work with.'},
{id:'preservation',d:'iteration',label:'PRESERVATION',teaching:'Improvement should not destroy what already works. Expert iteration preserves strengths while deliberately fixing weaknesses.',question:'When improving AI-generated work, how deliberately do you preserve what is already working?',answers:[['I identify strengths first and protect them during revisions.','I improve without losing the good parts.',4],['I usually notice what I want to keep.','Preservation is part of my revisions.',3],['I focus mostly on what is wrong.','Good elements can sometimes get lost.',2],['I tend to replace the whole thing.','I rarely distinguish strengths from weaknesses.',1]],insight:'The best revision is not a replacement. It is a controlled upgrade that preserves the value already earned.'},
{id:'systems',d:'systems',label:'AI SYSTEMS',teaching:'The biggest AI gains often come from repeatable workflows rather than isolated prompts. Systems make good work easier to reproduce.',question:'How often do you turn successful AI work into a repeatable process or system?',answers:[['I deliberately build reusable workflows, templates, or systems.','Success becomes repeatable.',4],['I save useful approaches and reuse them.','I have some repeatable patterns.',3],['I reuse things informally.','I mostly remember what worked.',2],['I treat each AI task as a one-off.','There is little systemization.',1]],insight:'A useful result once is helpful. A useful process you can repeat is leverage.'},
{id:'workflow',d:'systems',label:'WORKFLOW DESIGN',teaching:'AI works best when it is placed inside a clear human workflow: input, thinking, creation, evaluation, refinement, and output.',question:'How deliberately do you design the steps around AI rather than simply asking for an answer?',answers:[['I design the whole workflow around the desired outcome.','AI has a clear role in the process.',4],['I think about the next step when needed.','The workflow is partly deliberate.',3],['I mainly interact with AI one request at a time.','The surrounding process is informal.',2],['I have little process beyond asking and receiving.','AI is mostly a standalone tool.',1]],insight:'AI becomes more powerful when it is part of a system. The workflow around the model matters.'},
{id:'leverage',d:'systems',label:'LEVERAGE',teaching:'The goal is not to do more work with AI. It is to create more value with less friction, better thinking, and reusable intelligence.',question:'How deliberately do you look for ways AI can multiply your effort rather than simply speed up a task?',answers:[['I actively look for leverage, automation, reuse, and scale.','I think beyond the immediate task.',4],['I look for efficiency when a task repeats.','I capture some leverage opportunities.',3],['I mainly use AI to finish individual tasks faster.','The benefit is mostly immediate.',2],['I rarely think about leverage.','I use AI only when it seems convenient.',1]],insight:'Speed is useful. Leverage is bigger. The real opportunity is creating value that keeps paying you back.'},
{id:'direction2',d:'direction',label:'DIRECTION & JUDGMENT',teaching:'AI can generate possibilities quickly. Your advantage is deciding which possibility actually deserves your attention.',question:'How confidently do you decide what AI should work on, what it should not work on, and what you should decide yourself?',answers:[['I clearly separate AI assistance from human judgment.','I direct the collaboration intentionally.',4],['I usually know when I should take over.','I make the distinction case by case.',3],['I sometimes let AI drive the direction.','The boundary is not always clear.',2],['I mostly follow wherever AI leads.','I rarely establish the boundary.',1]],insight:'Mastery is not giving AI control. It is knowing where AI adds leverage and where human judgment must remain in charge.'},
{id:'quality',d:'evaluation',label:'QUALITY STANDARD',teaching:'Your quality bar changes the quality of your collaboration with AI. If you cannot describe excellence, it is difficult to direct AI toward it.',question:'How clearly can you describe what a high-quality AI result should accomplish?',answers:[['I can define quality, success criteria, and failure conditions.','I know what excellent looks like.',4],['I can identify most quality problems when I see them.','My standard is reasonably clear.',3],['I know when something feels wrong but struggle to explain why.','The quality bar is partly intuitive.',2],['I mostly judge whether the output is usable.','I rarely define a quality standard.',1]],insight:'If you know what “great” means, AI becomes easier to direct. A clear quality bar is a powerful form of intelligence.'},
{id:'learning',d:'communication',label:'AI LEARNING LOOP',teaching:'Every interaction can teach you how to work better with AI. Mastery grows when you learn from the process instead of merely collecting outputs.',question:'How deliberately do you learn from your AI interactions and improve your own way of working?',answers:[['I study what worked, what failed, and why.','Every project improves my method.',4],['I remember useful techniques and apply them later.','I learn through experience.',3],['I learn when something goes wrong.','The learning is mostly reactive.',2],['I rarely reflect on the process.','I mainly care about the immediate result.',1]],insight:'The most valuable AI skill may be learning how to work with AI better every time you use it.'},
{id:'orchestration',d:'systems',label:'ORCHESTRATION',teaching:'As AI becomes more capable, the high-leverage skill shifts from doing every task yourself to directing people, tools, models, and information toward a result.',question:'How comfortable are you coordinating multiple AI tools, steps, or sources to accomplish one larger outcome?',answers:[['I can orchestrate multiple tools or stages deliberately.','I think in systems and outcomes.',4],['I can combine a few tools when useful.','I am becoming more systematic.',3],['I mostly use one tool at a time.','I combine tools occasionally.',2],['I rarely coordinate multiple AI capabilities.','I prefer isolated interactions.',1]],insight:'The next level of AI mastery is orchestration: directing capabilities together instead of treating each tool as an isolated box.']}
]};
const state={view:'welcome',q:0,answers:{},board:0,interests:new Set(),scores:null,level:null,nayaSpeaking:false};
const $=id=>document.getElementById(id), app=$('app');
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function levelFor(n){n=Math.max(0,Math.min(100,n));if(n<50)return{key:'foundation',name:'FOUNDATION',color:'#8a5cff'};if(n<75)return{key:'developing',name:'DEVELOPING',color:'#4e8cff'};if(n<90)return{key:'advancing',name:'ADVANCING',color:'#35e39b'};return{key:'mastering',name:'MASTERING',color:'#ffd45a'}}
function answerValue(q){return state.answers[q.id]||0}
function score(){const dims=A.dimensions.map(d=>{const qs=A.questions.filter(q=>q.d===d.id);const raw=qs.reduce((s,q)=>s+answerValue(q),0);return{id:d.id,name:d.name,score:Math.round((raw/(qs.length*4))*100)}});const total=Math.round(dims.reduce((s,d)=>s+d.score,0)/dims.length);return{total,dims}}
function strongest(scores){return scores.dims.slice().sort((a,b)=>b.score-a.score)[0]}
function weakest(scores){return scores.dims.slice().sort((a,b)=>a.score-b.score)[0]}
function insightSet(scores){const strong=strongest(scores),weak=weakest(scores);return[
`Your ${strong.name} score of ${strong.score} suggests you already have a meaningful strength to build on.`,
`Your biggest leverage point is ${weak.name} at ${weak.score}. Improving this could raise the value you get from the abilities you already have.`,
state.interests.size?`You want AI helping with ${[...state.interests].slice(0,3).map(id=>A.interests.find(x=>x[0]===id)[2]).join(', ')}. That gives your next learning path a practical target.`:`You did not select a specific AI-use area. That is completely fine — your results still show where your core mastery can grow.`
]}
function interpretation(scores){const l=levelFor(scores.total),s=strongest(scores),w=weakest(scores);return `You are currently ${l.name.toLowerCase()} in AI mastery, with an overall score of ${scores.total}. Your strongest area is ${s.name}, while ${w.name} is the clearest opportunity. The good news is that your next step is not about becoming more technical — it is about becoming more deliberate with the way you direct, evaluate, iterate, and systemize AI.`}
function nayaScript(){const s=state.scores||score(),l=levelFor(s.total),st=strongest(s),w=weakest(s);const interests=state.interests.size?[...state.interests].slice(0,4).map(id=>A.interests.find(x=>x[0]===id)[2]).join(', '):'a broad range of possibilities';return `Hi, I'm Naya. I looked at your MAXESS results. You scored ${s.total} out of 100, which places you in the ${l.name.toLowerCase()} level. Your strongest capability is ${st.name}, at ${st.score}. That's important because it gives you a foundation to build from. Your biggest opportunity is ${w.name}, at ${w.score}. That is where a relatively small improvement could unlock more value from everything you already know. You told us you are interested in ${interests}. My recommendation is simple: keep your strength, deliberately improve your opportunity, and turn the best techniques into repeatable habits. You do not need to become an AI expert overnight. You need a better way to direct, evaluate, iterate, and apply AI to the things that actually matter to you.`}
function progress(){const pct=state.view==='question'?Math.round((state.q/A.questions.length)*100):state.view==='discovery'?100:state.view==='results'?100:0;$('progressFill').style.width=pct+'%';$('progressPct').textContent=pct+'%';$('progressLabel').textContent=state.view==='question'?`QUESTION ${state.q+1} OF ${A.questions.length}`:state.view==='discovery'?'AI USE DISCOVERY':state.view==='results'?'YOUR RESULTS':'MAXESS'}
function speak(text){if(!('speechSynthesis'in window)){toast('Audio is not available in this browser.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.96;u.pitch=1.02;u.onstart=()=>{state.nayaSpeaking=true;renderNayaButtons()};u.onend=()=>{state.nayaSpeaking=false;renderNayaButtons()};u.onerror=()=>{state.nayaSpeaking=false;renderNayaButtons();toast('Naya audio could not start.');};window.speechSynthesis.speak(u)}
function stopSpeak(){if('speechSynthesis'in window)window.speechSynthesis.cancel();state.nayaSpeaking=false;renderNayaButtons()}
function renderNayaButtons(){document.querySelectorAll('[data-naya]').forEach(b=>{b.classList.toggle('playing',state.nayaSpeaking);b.setAttribute('aria-label',state.nayaSpeaking?'Stop Naya':'Listen to Naya')})}
function nayaButton(result=false){return `<button class="naya ${state.nayaSpeaking?'playing':''}" data-naya="1" aria-label="${state.nayaSpeaking?'Stop Naya':'Listen to Naya'}"><span class="orb"></span><span class="ncopy"><strong>${result?'Listen to Naya':'Naya'}</strong><small>${result?'Hear your results interpreted':'Your AI guide'}</small></span></button>`}
function bindNaya(result=false){document.querySelectorAll('[data-naya]').forEach(b=>b.onclick=()=>state.nayaSpeaking?stopSpeak():speak(result?nayaScript():(A.questions[state.q]?.teaching||'Welcome to MAXESS.')))}
function render(){progress();if(state.view==='welcome')renderWelcome();else if(state.view==='lesson')renderLesson();else if(state.view==='question')renderQuestion();else if(state.view==='insight')renderInsight();else if(state.view==='discovery')renderDiscovery();else renderResults();bindNaya(state.view==='results')}
function renderWelcome(){app.innerHTML=`<div class="screen center"><div class="eyebrow">AI MASTERY ASSESSMENT</div><h1 class="hero">Discover how much value you can really get from AI.</h1><p class="lead">MAXESS is more than a score. It is a short guided experience designed to show you how you think with AI, where you are already strong, and where your next leap is hiding.</p><div class="actions"><button class="btn" id="start">Discover My AI Mastery →</button></div><p style="color:#aaa4b1;font-size:12px;margin-top:18px">15 questions · about 5 minutes · no right or wrong answers</p></div>`;$('start').onclick=()=>{state.view='lesson';render()}}
function renderLesson(){const q=A.questions[state.q];app.innerHTML=`<div class="lesson"><div class="eyebrow">BEFORE YOU ANSWER</div><h2>${esc(q.teaching.split('. ')[0])}</h2><p>${esc(q.teaching)}</p><div class="actions"><button class="btn" id="got">Got it — let's go →</button></div></div>`;$('got').onclick=()=>{state.view='question';render()}}
function renderQuestion(){const q=A.questions[state.q],sel=answerValue(q);app.innerHTML=`<div class="screen question"><div class="command">${nayaButton(false)}<div class="qmeta">${esc(q.label)} · ${A.questions.filter(x=>x.d===q.d).length} SKILL SIGNALS</div></div><h1 class="qtitle">${esc(q.question)}</h1><div class="answers">${q.answers.map((a,i)=>`<button class="answer ${sel===a[2]?'selected':''}" data-answer="${i}" aria-pressed="${sel===a[2]}"><span class="gem"><span>${String.fromCharCode(65+i)}</span></span><span><strong>${esc(a[0])}</strong><small>${esc(a[1])}</small></span></button>`).join('')}</div><div class="bottom"><button class="btn" id="continue" ${sel?'':'disabled'}>${state.q===A.questions.length-1?'Finish & Discover My Results':'Continue →'}</button></div></div>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const a=q.answers[+b.dataset.answer];state.answers[q.id]=a[2];renderQuestion();});$('continue').onclick=()=>{if(!answerValue(q))return;state.view='insight';render()}}
function renderInsight(){const q=A.questions[state.q];app.innerHTML=`<div class="screen"><div class="insight"><h3>MAX INSIGHT</h3><p>${esc(q.insight)}</p><div class="actions"><button class="btn" id="next">${state.q===A.questions.length-1?'Continue to AI Use Discovery →':'Ready for the next one →'}</button></div></div></div>`;$('next').onclick=()=>{if(state.q===A.questions.length-1){state.view='discovery'}else{state.q++;state.view='lesson'}render()}}
function renderDiscovery(){const pages=[A.interests.slice(0,6),A.interests.slice(6,12),A.interests.slice(12,18)],items=pages[state.board];app.innerHTML=`<div class="discovery"><div class="discover-head"><div class="eyebrow">ASSESSMENT COMPLETE</div><h1>What do you actually want AI to help you do?</h1><p>Explore the areas that matter to you. Choose one, several, all, or none. Your results do not depend on making a selection.</p></div><div class="boardnav"><button class="arrow" id="prev" aria-label="Previous board" ${state.board===0?'disabled':''}>‹</button><div class="dots">${pages.map((_,i)=>`<span class="dot ${i===state.board?'active':''}"></span>`).join('')}</div><button class="arrow" id="nextboard" aria-label="Next board" ${state.board===2?'disabled':''}>›</button></div><div class="interest-grid">${items.map(x=>`<button class="interest ${state.interests.has(x[0])?'selected':''}" data-interest="${x[0]}" aria-pressed="${state.interests.has(x[0])}"><div class="icon">${x[1]}</div><strong>${esc(x[2])}</strong><span>${esc(x[3])}</span></button>`).join('')}</div><div class="discover-actions"><button class="btn secondary" id="skip">${state.interests.size?'Continue to My Results →':'Skip for now — Show My Results →'}</button></div></div>`;$('prev').onclick=()=>{state.board=Math.max(0,state.board-1);render()};$('nextboard').onclick=()=>{state.board=Math.min(2,state.board+1);render()};document.querySelectorAll('[data-interest]').forEach(b=>b.onclick=()=>{const id=b.dataset.interest;state.interests.has(id)?state.interests.delete(id):state.interests.add(id);renderDiscovery()});$('skip').onclick=()=>{state.scores=score();state.level=levelFor(state.scores.total);state.view='results';render()}}
function renderResults(){const s=state.scores||score(),l=levelFor(s.total),st=strongest(s),w=weakest(s),ins=insightSet(s);app.innerHTML=`<div class="results"><div class="scorehero"><div class="eyebrow">YOUR RESULTS REVEAL</div><div class="score-ring" style="--score:${s.total}"><div class="score-number">${s.total}</div></div><div class="score-label">${l.name}</div><p class="result-copy">${esc(interpretation(s))}</p></div><div class="spectrum"><div class="spectrumbar"><div class="marker" style="left:${s.total}%" aria-label="Your score ${s.total}"></div></div><div class="labels"><span>FOUNDATION</span><span>DEVELOPING</span><span>ADVANCING</span><span>MASTERING</span></div></div><section class="section"><h2>Your five dimensions</h2><div class="dims">${s.dims.map(d=>`<div class="dim"><strong>${d.score}</strong><span>${esc(d.name)}</span><div class="dimbar"><div class="dimfill" style="width:${d.score}%"></div></div><span>${esc(levelFor(d.score).name)}</span></div>`).join('')}</div></section><section class="section duo"><div class="feature"><div class="tag">STRONGEST CAPABILITY</div><h3>${esc(st.name)} · ${st.score}</h3><p>You are showing a relative strength in ${esc(st.name.toLowerCase())}. Protect this capability and use it as the foundation for your next level of AI work.</p></div><div class="feature"><div class="tag">BIGGEST OPPORTUNITY</div><h3>${esc(w.name)} · ${w.score}</h3><p>This is your clearest opportunity. Improving ${esc(w.name.toLowerCase())} can unlock more value from the capabilities you already have.</p></div></section><section class="section"><h2>Three things your results suggest</h2><div class="insights">${ins.map((x,i)=>`<div class="mini"><strong>0${i+1}</strong><p>${esc(x)}</p></div>`).join('')}</div></section><section class="section"><div class="naya-result">${nayaButton(true)}<div class="naya-text">Naya has interpreted your actual score, strengths, opportunity, and interests. Listen for the part that matters most to you.</div></div></section><section class="section"><h2>Your next-level path</h2><div class="path"><div class="step"><div class="stepnum">1</div><div><h3>Protect your strongest capability</h3><p>Keep using what you already do well. Mastery compounds when strengths become dependable habits.</p></div></div><div class="step"><div class="stepnum">2</div><div><h3>Improve ${esc(w.name)}</h3><p>Focus your next learning on evaluation, direction, iteration, or systems thinking where your score shows the greatest opportunity.</p></div></div><div class="step"><div class="stepnum">3</div><div><h3>Turn good AI work into repeatable leverage</h3><p>Capture the methods that work. Build reusable instructions, workflows, checklists, and quality standards.</p></div></div></div></section><section class="section offer"><h2>Turn your result into your next skill.</h2><p>The AI Mastery Keys are the natural next step: a practical framework for improving the exact thinking and workflows that make AI more useful.</p><div class="reportbar"><button class="btn secondary" id="print">Download / Save My MAXESS Report</button></div><div class="footer-actions"><button class="btn" id="trial">START YOUR FREE TRIAL →</button><button class="btn secondary" id="nextmax">CONTINUE TO YOUR NEXT MAX ASSESSMENT →</button></div><p style="font-size:11px;color:#aaa4b1">No pressure. Your result is yours. Continue only if the next step genuinely fits what you want.</p></section></div>`;$('print').onclick=()=>{window.print()};$('trial').onclick=()=>{window.location.href='https://nayanet.com'};$('nextmax').onclick=()=>{toast('Your next MAX assessment can be connected here.');};bindNaya(true)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
window.addEventListener('beforeunload',()=>stopSpeak());
render();
</script>
</body>
</html>
