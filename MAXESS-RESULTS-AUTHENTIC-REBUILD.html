.naya{padding:clamp(42px,7vw,88px);border:1px solid rgba(215,184,255,.2);border-radius:40px;text-align:center;background:radial-gradient(ellipse 65% 100% at 50% 0,rgba(169,92,255,.22),transparent 65%),linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.01));box-shadow:0 50px 125px rgba(0,0,0,.45)}.nayaOrb{width:76px;height:76px;border-radius:50%;margin:0 auto 25px;background:radial-gradient(circle at 30% 18%,#fff,#dfcfff 15%,#986cff 40%,#3c1680 72%,#09050e);border:1px solid #e6d8ff;box-shadow:0 0 40px rgba(151,98,255,.35),inset 0 2px 5px rgba(255,255,255,.7);display:grid;place-items:center}.nayaOrb:after{content:"";width:0;height:0;border-top:9px solid transparent;border-bottom:9px solid transparent;border-left:14px solid #fff;margin-left:4px}.naya h2{font-size:clamp(42px,5.3vw,78px);line-height:.9;letter-spacing:-.07em;font-weight:950}.naya p{max-width:750px;margin:18px auto 0;color:var(--muted);font-size:16px;line-height:1.65}.nayaActions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:27px}
.final{padding-bottom:clamp(90px,11vw,170px)}.finalCard{padding:clamp(32px,5vw,68px);border:1px solid var(--line);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.01));text-align:center}.finalCard h2{font-size:clamp(38px,5vw,72px);line-height:.92;letter-spacing:-.065em;font-weight:950}.finalCard p{margin:16px auto 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:650px}.footer{padding:30px 0 45px;color:var(--soft);font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.gate{min-height:70vh;display:grid;place-items:center}.gateCard{width:min(760px,100%);padding:55px;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:rgba(255,255,255,.035);text-align:center}.gateCard h1{font-size:clamp(42px,7vw,76px);line-height:.9;letter-spacing:-.07em}.gateCard p{margin-top:18px;color:var(--muted);line-height:1.65}.gateCode{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:12px;background:#020205;color:var(--purple2);font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:left;overflow:auto}
@media(max-width:1100px){.dimGrid{grid-template-columns:repeat(3,1fr)}.heroGrid{grid-template-columns:1fr 420px}.fingerprint{grid-template-columns:1fr}.pathGrid{grid-template-columns:1fr}.character{min-height:0}}

<body>
<div class="app" id="app"></div>
<script>
/*
  MAXESS AUTHENTIC RESULTS RENDERER
  --------------------------------------------------
  This is intentionally a fresh renderer, not a patch over a prior Results page.
  Contract: window.MAXESS_RESULT or #maxess-result-data JSON.
  The assessment engine remains authoritative; this page only renders the result.
*/
const PATHWAYS=[
 ['Writing & Communication','Turn ideas into clear, persuasive language.'],
 ['Research & Information','Find, verify, synthesize, and explain information.'],
 ['Brainstorming & Ideas','Generate stronger possibilities and explore directions.'],
 ['Content Creation','Turn thinking into useful, engaging content.'],
 ['Business & Strategy','Use AI to clarify decisions, models, and opportunities.'],
 ['Marketing & Sales','Create messaging, offers, campaigns, and sales systems.'],
 ['Learning & Education','Use AI as a tutor, coach, curriculum builder, and study partner.'],
 ['Coding & Software','Design, build, debug, and improve software with AI.'],
 ['Images & Visual Creation','Direct visual concepts, prompts, and creative production.'],
 ['Video & Media','Plan, script, edit, package, and improve media.'],
 ['Data & Analysis','Turn information into patterns, decisions, and insight.'],
 ['Automation & Workflows','Turn repeated work into reliable systems.'],
 ['Agents & AI Systems','Design AI agents, tools, context, and orchestration.'],
 ['Product & UX','Turn human needs into useful digital experiences.'],
 ['Personal Productivity','Use AI to think, plan, organize, and execute.'],
 ['Career & Professional Growth','Apply AI to become more capable and valuable.'],
 ['Personal Development','Use AI for reflection, habits, perspective, and growth.'],
 ['Advanced AI Craftsmanship','Direct, evaluate, iterate, and build sophisticated AI workflows.']
];
const COLORS=['#a875ff','#6bb7ff','#55e5a8','#ffd86b','#ff7d9c'];
const fallback={score:0,band:'',summary:'',dimensions:[],strongest:null,opportunity:null,relationship:null,pathways:[],naya:null};
function readResult(){
  if(window.MAXESS_RESULT&&typeof window.MAXESS_RESULT==='object')return window.MAXESS_RESULT;
  const el=document.getElementById('maxess-result-data');
  if(el){try{return JSON.parse(el.textContent)}catch(e){}}
  return null;
}
function clamp(n){return Math.max(0,Math.min(100,Number(n)||0))}
function bandFor(s){if(s>=90)return 'Mastering';if(s>=75)return 'Advancing';if(s>=55)return 'Developing';return 'Beginning'}
function normalize(raw){
  const r=Object.assign({},fallback,raw||{});
  r.score=clamp(r.score);
  r.band=r.band||bandFor(r.score);
  r.dimensions=(Array.isArray(r.dimensions)?r.dimensions:[]).map((d,i)=>({
    name:d.name||`Dimension ${i+1}`,score:clamp(d.score),color:d.color||COLORS[i%COLORS.length],
    archetype:d.archetype||'',description:d.description||'Your current capability in this area.',action:d.action||'Strengthen this capability through deliberate practice and real use.'
  })).slice(0,5);
  while(r.dimensions.length<5)r.dimensions.push({name:`Dimension ${r.dimensions.length+1}`,score:0,color:COLORS[r.dimensions.length],archetype:'',description:'No result data supplied for this dimension.',action:'Complete the assessment to generate the personalized interpretation.'});
  const sorted=[...r.dimensions].sort((a,b)=>b.score-a.score);
  r.strongest=r.strongest||sorted[0];r.opportunity=r.opportunity||sorted[sorted.length-1];
  r.relationship=r.relationship||{from:r.strongest.name,to:r.opportunity.name,title:'Your leverage lives between these two capabilities.',copy:'The goal is not to improve everything at once. Strengthen the capability that unlocks the most value from the strength you already have.'};
  r.pathways=Array.isArray(r.pathways)&&r.pathways.length?r.pathways:PATHWAYS.slice(0,3).map((p,i)=>({name:p[0],description:p[1],active:i===0}));
  return r;
}
function pct(v){return Math.round(clamp(v))}
function escapeHTML(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function icon(type){const m={down:'↓',right:'→',play:'▶',spark:'✦'};return `<span class="ico" aria-hidden="true">${m[type]||'→'}</span>`}
function radarSVG(ds){
 const cx=250,cy=250,R=178,n=5;const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
 const poly=r=>Array.from({length:n},(_,i)=>pt(i,r).map(x=>x.toFixed(1)).join(',')).join(' ');
 const data=ds.map((d,i)=>pt(i,R*d.score/100));
 return `<svg class="radar" viewBox="0 0 500 500" role="img" aria-label="Five dimension capability fingerprint"><g fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1">${[.25,.5,.75,1].map(x=>`<polygon points="${poly(R*x)}"/>`).join('')}${ds.map((_,i)=>{const p=pt(i,R);return `<line x1="250" y1="250" x2="${p[0]}" y2="${p[1]}"/>`}).join('')}</g><polygon points="${data.map(p=>p.join(',')).join(' ')}" fill="rgba(168,117,255,.18)" stroke="#d7b8ff" stroke-width="3" stroke-linejoin="round"/>${data.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="${ds[i].color}" stroke="#fff" stroke-width="2"/>`).join('')}</svg>`;
}
function render(r){
 document.title=`MAXESS — ${r.score} AI Mastery`;
 const scoreColor=r.score>=75?'#55e5a8':r.score>=55?'#ffd86b':'#ff7d9c';
 const strongest=r.strongest, opp=r.opportunity;

  <main>
   <section class="section hero"><div class="wrap heroGrid">
    <div><span class="eyebrow">YOUR AI MASTERY RESULT</span><h1>Your AI capability <em>has a shape.</em></h1><p class="lead">${escapeHTML(summary)}</p><div class="heroActions"><a class="cta primary" href="#fingerprint">Explore my fingerprint ${icon('down')}</a><a class="cta secondary" href="#naya">Meet Naya ${icon('right')}</a></div><p class="heroNote">Your score is a snapshot of how effectively you currently turn AI into useful outcomes. It is not a measure of your worth, intelligence, or potential.</p><div class="proof"><div class="proofItem"><b>5 dimensions</b><span>Your capability fingerprint</span></div><div class="proofItem"><b>18 pathways</b><span>Ways to turn capability into skill</span></div><div class="proofItem"><b>1 leverage point</b><span>The next improvement worth making</span></div></div></div>
    <div class="scoreStage"><div class="scoreOrb" style="--score:${r.score};--scoreColor:${scoreColor}"><div class="scoreCore"><div class="score">${pct(r.score)}<small>/100</small></div><div class="scoreLabel">MAXESS SCORE</div><div class="band"><i></i>${escapeHTML(r.band)}</div></div></div></div>
   </div></section>
   <div class="divider"></div>
   <section class="section"><div class="read"><span class="eyebrow">THE SHORT VERSION</span><div class="insightCard reveal"><p class="quote">You do not need to become better at <strong>everything.</strong> You need to know what creates the most leverage for you.</p><p class="insightCopy">${escapeHTML(summary)}</p></div></div></section>
   <section class="section" id="fingerprint"><div class="wrap"><div class="sectionHead"><span class="eyebrow">01 · YOUR FINGERPRINT</span><h2>See the pattern, not just the score.</h2><p>These five dimensions work together. The shape is more useful than any single number because it shows how your capabilities relate.</p></div><div class="fingerprint"><div class="radarBox reveal">${radarSVG(r.dimensions)}</div><div class="legend">${r.dimensions.map((d,i)=>`<div class="legendRow" style="--c:${d.color}"><i class="legendDot"></i><strong>${escapeHTML(d.name)}</strong><span>${pct(d.score)}</span></div>`).join('')}</div></div></div></section>

   <section class="section"><div class="wrap"><div class="sectionHead"><span class="eyebrow">03 · YOUR LEVERAGE</span><h2>Use what is already strong to improve what matters most.</h2></div><div class="contrast"><article class="power reveal" style="--accent:${strongest.color||'#55e5a8'};--glow:${strongest.color||'#55e5a8'}"><span class="powerLabel">YOUR ADVANTAGE</span><h3 class="powerTitle">${escapeHTML(strongest.name)}</h3><div class="powerScore">${pct(strongest.score)}</div><p class="powerText">${escapeHTML(strongest.description||'This is currently one of your strongest capability areas.')}</p><p class="powerAction">Protect this strength. Then use it as the engine for the next skill you build.</p></article><article class="power reveal" style="--accent:${opp.color||'#ffd86b'};--glow:${opp.color||'#ffd86b'}"><span class="powerLabel">YOUR LEVERAGE POINT</span><h3 class="powerTitle">${escapeHTML(opp.name)}</h3><div class="powerScore">${pct(opp.score)}</div><p class="powerText">${escapeHTML(opp.description||'This is the capability with the most room to develop.')}</p><p class="powerAction">Do not attack the whole gap. Build one repeatable behavior here and watch what it unlocks.</p></article></div></div></section>
   <section class="section"><div class="wrap"><div class="relation reveal"><span class="eyebrow">04 · THE CONNECTION</span><h2 style="font-size:clamp(32px,4.2vw,62px);line-height:.95;letter-spacing:-.06em;margin-top:13px">The interesting part is what happens <em style="color:var(--purple2);font-style:normal">between</em> your scores.</h2><div class="relationGrid" style="margin-top:30px"><div class="node"><small>Already working</small><strong>${escapeHTML(r.relationship.from||strongest.name)}</strong><p>Your existing strength gives you a platform to build from.</p></div><div class="arrow">→</div><div class="node"><small>Highest leverage</small><strong>${escapeHTML(r.relationship.to||opp.name)}</strong><p>${escapeHTML(r.relationship.copy||'Improving this capability can amplify the value of your existing strengths.')}</p></div></div></div></div></section>
   <section class="section"><div class="wrap"><div class="sectionHead"><span class="eyebrow">05 · YOUR PATHWAY</span><h2>Your result should change what you do next.</h2><p>MAXESS is not finished when you see your score. The useful part is turning the diagnosis into a focused learning path.</p></div><div class="pathGrid"><article class="pathCard"><span class="eyebrow">START HERE</span><h3 style="margin-top:12px">Build the capability that gives you the biggest return.</h3><p>One focused capability. Real use. Feedback. Iteration. Then the next layer.</p><div class="steps"><div class="step"><div class="stepNum">01</div><div><b>Learn the pattern</b><p>Understand what excellent use of ${escapeHTML(opp.name)} actually looks like.</p></div></div><div class="step"><div class="stepNum">02</div><div><b>Apply it to something real</b><p>Use the skill on work that matters to you instead of practicing in isolation.</p></div></div><div class="step"><div class="stepNum">03</div><div><b>Evaluate and iterate</b><p>Judge the output, identify what failed, and improve the system rather than accepting the first answer.</p></div></div></div></article><article class="pathCard"><span class="eyebrow">YOUR 18-PATHWAY MAP</span><p>These are the areas MAXESS can turn into deeper mastery. Your highlighted pathways are the places to explore first.</p><div class="pathways">${PATHWAYS.map(p=>{const active=pathways.some(x=>(x.name||x)===p[0]);return `<div class="pathway ${active?'active':''}"><b>${escapeHTML(p[0])}</b><span>${escapeHTML(p[1])}</span></div>`}).join('')}</div></article></div></div></section>
   <section class="section" id="naya"><div class="wrap"><div class="naya reveal"><div class="nayaOrb"></div><span class="eyebrow">06 · YOUR GUIDE</span><h2>You've seen the pattern.<br>Now let's do something with it.</h2><p>${escapeHTML((r.naya&&r.naya.message)||'Naya can help you turn this result into a practical next step — without drowning you in more information.')}</p><div class="nayaActions"><a class="cta primary" href="${escapeHTML((r.naya&&r.naya.href)||'#')}">Continue with Naya ${icon('right')}</a><a class="cta secondary" href="#top">Review my result ${icon('down')}</a></div></div></div></section>
   <section class="section final"><div class="wrap"><div class="finalCard"><span class="eyebrow">THE POINT OF MAXESS</span><h2>Know where you are.<br>Know what matters.<br><em style="font-style:normal;color:var(--purple2)">Move.</em></h2><p>A score is useful only when it gives you a clearer next move. Your capability can grow. This is simply the point from which you begin.</p><div class="heroActions" style="justify-content:center"><a class="cta primary" href="#fingerprint">Start with my fingerprint ${icon('down')}</a></div></div></div></section>
  </main><footer class="footer">MAXESS · AI MASTERY ASSESSMENT · RESULTS RENDERER</footer>
 </div>`;
 document.getElementById('app').innerHTML=html;
 document.getElementById('printBtn').onclick=()=>window.print();
 document.getElementById('restartBtn').onclick=()=>{if(typeof window.MAXESS_RESTART==='function')window.MAXESS_RESTART();else window.location.reload()};
 const obs=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('on')),{threshold:.12});document.querySelectorAll('.reveal').forEach(x=>obs.observe(x));
}
const result=readResult();
if(result)render(normalize(result));
else document.getElementById('app').innerHTML='<main class="shell"><section class="section gate"><div class="gateCard"><span class="eyebrow">MAXESS RESULTS</span><h1>Waiting for your result.</h1><p>This renderer intentionally refuses to invent a score. Connect the authoritative assessment result through <b>window.MAXESS_RESULT</b> or the MAXESS result-data element.</p><div class="gateCode">window.MAXESS_RESULT = { score, band, dimensions, pathways, ... }</div></div></section></main>';
</script>
</body>
</html>
