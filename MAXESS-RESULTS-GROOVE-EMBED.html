<!-- MAXESS RESULTS 10.10 — GROOVE EMBED -->
<!-- Paste this entire block into the Groove Results page custom HTML/embed area. -->
<div id="maxess-results-10" aria-label="MAXESS Personal AI Mastery Results"></div>
<script>
(function(){
  'use strict';
  function setResult(){
    if(window.MAXESS_RESULT && window.MAXESS_RESULT.dimensions) return;
    try{
      var encoded=new URLSearchParams(window.location.search).get('result');
      if(encoded){
        var normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');
        while(normalized.length%4) normalized+='=';
        var binary=atob(normalized), bytes=new Uint8Array(binary.length);
        for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
        window.MAXESS_RESULT=JSON.parse(new TextDecoder().decode(bytes));
      }
    }catch(e){console.warn('MAXESS result payload could not be decoded.',e)}
    if(!window.MAXESS_RESULT || !window.MAXESS_RESULT.dimensions){
      window.MAXESS_RESULT={
        overallScore:82,
        dimensions:[
          {name:'Direction',score:86},
          {name:'Communication',score:91},
          {name:'Evaluation',score:79},
          {name:'Iteration',score:74},
          {name:'Systems Thinking',score:68}
        ]
      };
    }
  }
  function load(){
    setResult();
    if(document.querySelector('script[data-maxess-results-10]')) return;
    var s=document.createElement('script');
    s.src='https://raw.githubusercontent.com/SoulSchoolAcademy/maxess/main/MAXESS-RESULTS-EXPERIENCE.js';
    s.async=false;
    s.setAttribute('data-maxess-results-10','true');
    document.head.appendChild(s);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',load); else load();
})();
</script>
