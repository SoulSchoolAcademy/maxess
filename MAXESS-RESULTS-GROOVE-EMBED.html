<!-- MAXESS RESULTS — FLAGSHIP GROOVE EMBED
     Paste this entire block into the Groove page after the MAXESS assessment.
     It loads the versioned flagship Results experience and bridges the existing
     MAXESS result data without changing questions, answers, navigation, or scoring.
-->
<div id="maxessFlagshipResultsMount"></div>
<script>
(async function(){
  const mount=document.getElementById('maxessFlagshipResultsMount');
  if(!mount)return;
  const source='https://raw.githubusercontent.com/SoulSchoolAcademy/maxess/results-flagship-aaa/maxess-results-flagship-aaa.html';
  const readLegacyResult=()=>{
    const scoreEl=document.getElementById('overallScore');
    const levelEl=document.getElementById('resultLevelText');
    const dimsEl=document.getElementById('dimensionConstellation');
    if(!scoreEl||!dimsEl)return null;
    const overall=Number(scoreEl.textContent);
    if(!Number.isFinite(overall))return null;
    const dimensions=[...dimsEl.querySelectorAll('.dimension-orb')].map((el,i)=>{
      const ring=el.querySelector('.dimension-ring');
      const name=el.querySelector('.dimension-name')?.textContent?.trim()||['Direction','Communication','Evaluation','Iteration','Systems Thinking'][i];
      const score=Number(el.querySelector('.dimension-score')?.textContent||0);
      return {id:['direction','communication','evaluation','iteration','systems'][i],name,score,color:ring?.style.getPropertyValue('--dimensionColor')||'#b895ff'};
    });
    if(dimensions.length!==5)return null;
    const label=(levelEl?.textContent||'').split('·')[0].trim();
    return {overall,dimensions,band:{label:label||undefined,color:overall>=90?'#ffd45a':overall>=75?'#35e39b':overall>=60?'#3ca8ff':'#765cff',description:'Your result is a map of your current AI capability.'}};
  };
  const getResult=()=>window.MAXESS_RESULT||(window.state&&window.state.results)||readLegacyResult();
  const bridge=()=>{const result=readLegacyResult();if(result)window.MAXESS_RESULT=result;return getResult()};
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok)throw new Error('MAXESS Results source unavailable');
    const html=await response.text();
    const doc=new DOMParser().parseFromString(html,'text/html');
    [...doc.querySelectorAll('style')].forEach(s=>{const style=document.createElement('style');style.textContent=s.textContent;document.head.appendChild(style)});
    const sourceSection=doc.querySelector('#maxessResults');
    if(!sourceSection)throw new Error('MAXESS Results mount missing');
    mount.replaceWith(sourceSection);
    const rendererScript=[...doc.querySelectorAll('script')].find(s=>s.textContent.includes('MAXESS_RESULTS_RENDERER'));
    if(rendererScript){const script=document.createElement('script');script.textContent=rendererScript.textContent;document.body.appendChild(script)}
    const rerender=()=>{const result=bridge();if(result&&window.MAXESS_RESULTS_RENDERER)window.MAXESS_RESULTS_RENDERER.render(result)};
    rerender();
    if(window.MutationObserver)new MutationObserver(rerender).observe(document.body,{subtree:true,childList:true});
    setTimeout(rerender,150);setTimeout(rerender,600);setTimeout(rerender,1500);
  }catch(error){
    console.error('MAXESS Results embed error:',error);
    mount.innerHTML='<div style="padding:40px;text-align:center;color:#aaa;font-family:system-ui">MAXESS Results could not load. Please refresh and try again.</div>';
  }
})();
</script>
