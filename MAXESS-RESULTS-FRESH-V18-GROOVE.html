<html lang="en">
<head>

<style>

.m-orb:before,.m-orb:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.m-orb:before{inset:9%;border:1px solid rgba(217,183,255,.32);box-shadow:0 0 48px rgba(168,108,255,.18)}.m-orb:after{inset:17%;border:1px solid rgba(255,255,255,.08)}

.m-proof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:42px}.m-proof-card{padding:15px 17px;border-left:1px solid rgba(217,183,255,.3)}.m-proof-card b{display:block;font-size:13px}.m-proof-card span{display:block;margin-top:3px;color:var(--muted);font-size:11px}

.m-pattern{display:grid;grid-template-columns:minmax(320px,.85fr) minmax(0,1.15fr);gap:clamp(36px,7vw,100px);align-items:center}.m-radar{position:relative;width:min(560px,90vw);aspect-ratio:1;margin:auto;display:grid;place-items:center}.m-radar svg{width:100%;height:100%;overflow:visible}.m-radar-center{position:absolute;text-align:center}.m-radar-center b{display:block;font-size:54px;line-height:1;letter-spacing:-.06em}.m-radar-center span{display:block;margin-top:8px;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.m-pattern-list{display:grid;gap:10px}.m-pattern-row{display:grid;grid-template-columns:34px 1fr auto;gap:13px;align-items:center;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03)}.m-pattern-row b{font-size:13px}.m-pattern-row span{color:var(--muted);font-size:11px}.m-pattern-row strong{font-size:16px}.m-mini-bar{grid-column:2/-1;height:4px;margin-top:-4px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}.m-mini-bar i{display:block;width:var(--w);height:100%;background:linear-gradient(90deg,#7540ca,#d1a5ff)}
.m-dual{display:grid;grid-template-columns:1fr 1fr;gap:14px}.m-signal,.m-lever{position:relative;min-height:320px;padding:32px;border-radius:28px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.06),rgba(255,255,255,.018))}.m-signal{border-color:rgba(91,224,173,.2)}.m-lever{border-color:rgba(244,213,141,.22)}.m-big-number{margin:20px 0 0;font-size:clamp(54px,6vw,82px);font-weight:900;line-height:.9;letter-spacing:-.07em}.m-card-title{margin:14px 0 0;font-size:27px;letter-spacing:-.035em}.m-card-copy{margin:12px 0 0;color:var(--soft);font-size:15px;line-height:1.6}.m-callout{margin-top:22px;padding:15px 16px;border-radius:15px;background:rgba(255,255,255,.045);color:var(--muted);font-size:12px}.m-callout strong{color:#fff}
.m-next{display:grid;grid-template-columns:.75fr 1.25fr;gap:50px;align-items:start}.m-steps{display:grid;gap:10px}.m-step{display:grid;grid-template-columns:62px 1fr;gap:15px;padding:17px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.025)}.m-step-num{color:var(--violet);font-size:10px;font-weight:900;letter-spacing:.12em}.m-step h3{margin:0;font-size:15px}.m-step p{margin:3px 0 0;color:var(--muted);font-size:12px}
.m-naya{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:center;padding:34px;border-radius:30px;border:1px solid rgba(217,183,255,.2);background:radial-gradient(circle at 15% 20%,rgba(168,108,255,.16),transparent 38%),rgba(255,255,255,.03)}.m-naya-orb{position:relative;width:190px;height:190px;margin:auto;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.15) 7%,#a86cff 18%,#321250 45%,#09050d 72%);box-shadow:0 0 55px rgba(168,108,255,.28),inset 0 0 45px rgba(255,255,255,.08)}.m-naya-orb:after{content:"";position:absolute;inset:16%;border:1px solid rgba(255,255,255,.25);border-radius:50%;animation:m-pulse 3.6s ease-in-out infinite}.m-naya-orb b{z-index:2;font-size:13px;letter-spacing:.18em}.m-naya-copy h2{margin:0;font-size:36px;letter-spacing:-.045em}.m-naya-copy p{margin:14px 0 0;color:var(--soft);font-size:16px;line-height:1.65}.m-naya-state{margin-top:16px;color:var(--violet);font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.m-masters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.m-master{position:relative;padding:22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.028);min-height:190px}.m-master.is-recommended{border-color:rgba(168,108,255,.4);background:linear-gradient(145deg,rgba(168,108,255,.11),rgba(255,255,255,.025))}.m-master-index{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.12em}.m-master h3{margin:13px 0 0;font-size:18px;line-height:1.15}.m-master p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.m-master-badge{display:inline-flex;margin-top:15px;padding:5px 8px;border-radius:999px;background:rgba(168,108,255,.12);color:var(--violet);font-size:9px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.m-system{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.m-system-card{padding:22px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.03)}.m-system-card b{font-size:10px;color:var(--violet);letter-spacing:.15em}.m-system-card h3{margin:10px 0 0;font-size:20px}.m-system-card p{margin:7px 0 0;color:var(--muted);font-size:12px}
.m-video{overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#000;aspect-ratio:16/9}.m-video iframe{width:100%;height:100%;border:0}.m-final{padding-top:70px;padding-bottom:110px;text-align:center}.m-final h2{max-width:900px;margin:0 auto;font-size:clamp(38px,5.5vw,76px);line-height:.96;letter-spacing:-.055em}.m-final p{max-width:700px;margin:20px auto 0;color:var(--soft);font-size:17px}.m-final .m-actions{justify-content:center}.m-footer{padding:25px 20px 45px;text-align:center;color:var(--muted);font-size:11px}
.m-status{position:fixed;right:16px;bottom:16px;z-index:20;display:none;padding:10px 13px;border:1px solid rgba(91,224,173,.25);border-radius:999px;background:rgba(5,3,10,.86);backdrop-filter:blur(12px);color:var(--green);font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
@keyframes m-pulse{0%,100%{transform:scale(.96);opacity:.35}50%{transform:scale(1.04);opacity:.9}}
@media(max-width:1100px){.m-dim-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.m-masters{grid-template-columns:repeat(2,minmax(0,1fr))}.m-system{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){.m-hero-grid,.m-pattern,.m-next{grid-template-columns:1fr}.m-hero{min-height:auto}.m-hero-copy{order:2}.m-orb-wrap{order:1}.m-proof{margin-top:28px}.m-dual{grid-template-columns:1fr}.m-naya{grid-template-columns:1fr;text-align:center}.m-naya-copy{text-align:left}.m-section-head{display:block}.m-section-head p{margin-top:15px}}
@media(max-width:620px){.m-section{padding:60px 17px}.m-dim-grid{grid-template-columns:1fr}.m-masters{grid-template-columns:1fr}.m-system{grid-template-columns:1fr}.m-profile{grid-template-columns:auto 1fr}.m-profile-badge{grid-column:1/-1;justify-self:start}.m-proof{grid-template-columns:1fr}.m-actions{display:grid}.m-button{width:100%}.m-title{font-size:clamp(38px,12vw,62px)}.m-orb{width:min(360px,88vw)}.m-dual{gap:10px}.m-signal,.m-lever{min-height:auto}.m-naya{padding:24px}.m-naya-orb{width:150px;height:150px}.m-naya-copy h2{font-size:30px}.m-final{padding-bottom:80px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.m-button,.m-dim{transition:none}.m-naya-orb:after{animation:none}}
@media print{body{background:#fff;color:#111}#maxess-results{background:#fff;color:#111}#maxess-results:before,#maxess-results:after,.m-status{display:none!important}.m-button,.m-actions{display:none!important}.m-section{padding:35px 20px;break-inside:avoid}.m-profile,.m-insight-card,.m-dim,.m-signal,.m-lever,.m-naya,.m-master,.m-system-card{background:#fff;color:#111;border-color:#ccc;box-shadow:none}.m-copy,.m-note,.m-dim p,.m-card-copy,.m-master p,.m-system-card p,.m-profile p,.m-section-head p,.m-final p{color:#333}.m-title em{color:#5d2ca2;-webkit-text-fill-color:#5d2ca2}.m-orb{box-shadow:none}.m-video{display:none}}
</style>

<body>
<main id="maxess-results" aria-label="MAXESS AI Mastery Results">
<div id="app"></div>
<div class="m-status" id="m-status" role="status" aria-live="polite">MAXESS READY</div>
</main>
<script>
(function(){
'use strict';

/* ================================================================
   MAXESS RESULTS FRESH V18
   Complete self-contained Groove artifact.
   Boundary: consumes window.MAXESS_RESULT; never calculates assessment answers.
   ================================================================ */

var MASTERS=[
['Writing & Communication','Turn ideas into clear, persuasive language.'],
['Research & Information','Find, compare and understand useful information.'],
['Brainstorming & Ideas','Generate possibilities and discover better angles.'],
['Content Creation','Create useful, memorable content at scale.'],
['Business & Strategy','Turn information into decisions and direction.'],
['Marketing & Sales','Position, communicate and convert value.'],
['Learning & Education','Learn faster and teach what you know.'],
['Coding & Software','Build, debug and improve software with AI.'],
['Images & Visual Creation','Turn concepts into compelling visual work.'],
['Video & Media','Plan, produce and improve video experiences.'],
['Audio & Music','Create, edit and work with sound and music.'],
['Data & Analysis','Turn data into useful patterns and decisions.'],
['Productivity & Organization','Reduce friction and organize complex work.'],
['Career & Professional Growth','Build capability, confidence and opportunity.'],
['Decision Making','Evaluate options and choose intelligently.'],
['Creative Development','Develop original ideas into finished work.'],
['Systems & Automation','Connect tools and build repeatable systems.'],
['AI Orchestration','Direct multiple AI capabilities toward one outcome.']
];

var MASTER_MAP={
'Direction':['Business & Strategy','Decision Making','AI Orchestration'],
'Communication':['Writing & Communication','Content Creation','Marketing & Sales'],
'Evaluation':['Research & Information','Data & Analysis','Decision Making'],
'Iteration':['Creative Development','Coding & Software','Content Creation'],
'Systems Thinking':['Systems & Automation','AI Orchestration','Productivity & Organization']
};

var state={result:null,profile:{name:'MAXESS Explorer',title:'AI Mastery Journey',company:'',avatar:''},dimensions:[],overall:0,band:'',strongest:null,lever:null};

function esc(value){
return String(value==null?'':value).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});
}
function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
function num(value,fallback){var n=Number(value);return Number.isFinite(n)?n:fallback;}
function score(value){return Math.round(clamp(num(value,0),0,100));}
function average(list){if(!list.length)return 0;return Math.round(list.reduce(function(a,b){return a+b;},0)/list.length);}
function bandFor(value){if(value>=90)return 'Exceptional';if(value>=80)return 'Advanced';if(value>=70)return 'Advancing';if(value>=55)return 'Developing';return 'Emerging';}
function dimensionCopy(name,value){
var level=value>=90?'exceptional':value>=80?'strong':value>=70?'advancing':value>=55?'developing':'emerging';
var copy={
'Direction':{exceptional:'You define outcomes with unusual clarity and give AI a destination worth reaching.',strong:'You generally know where you want to go and can make AI useful against a clear outcome.',advancing:'You can set direction, but stronger outcome definition would make your AI work more precise.',developing:'Your biggest opportunity is making the desired outcome explicit before asking AI to create.',emerging:'Start by defining what success looks like before you ask AI to do the work.'},
'Communication':{exceptional:'You give AI unusually rich, precise context and can shape outputs with clarity.',strong:'You communicate useful context well and already have a strong foundation for collaboration with AI.',advancing:'Your intent is usually clear, but more context and standards would increase consistency.',developing:'More context, constraints and examples would make your AI outputs noticeably stronger.',emerging:'The fastest improvement is learning to tell AI what matters, not merely what to do.'},
'Evaluation':{exceptional:'You judge AI work rigorously and can separate impressive-looking output from genuinely useful work.',strong:'You have a strong instinct for quality and can identify where an answer needs improvement.',advancing:'You evaluate reasonably well, with an opportunity to make your quality standards more explicit.',developing:'A repeatable scorecard would dramatically improve the quality of your AI decisions.',emerging:'Learning to judge AI output is the first major step toward becoming its director.'},
'Iteration':{exceptional:'You treat first drafts as raw material and know how to improve toward an excellent result.',strong:'You already understand that quality comes through refinement rather than one perfect prompt.',advancing:'You iterate, but a deliberate improvement loop would make your results more consistent.',developing:'Your opportunity is to stop accepting the first usable answer and build a repeatable improve cycle.',emerging:'Make iteration a habit: create, score, improve, repeat.'},
'Systems Thinking':{exceptional:'You naturally connect tools, processes and outcomes into larger systems.',strong:'You see beyond individual tasks and can connect AI capabilities into useful workflows.',advancing:'You are beginning to think in systems, with room to connect more pieces into repeatable workflows.',developing:'The next level is moving from isolated AI tasks to reusable processes and connected systems.',emerging:'Start noticing repeated work. Repetition is where systems and automation create leverage.'}
};
return (copy[name]&&copy[name][level])||'This dimension is part of your current MAXESS pattern and can become a deliberate capability through practice.';
}
function normalize(raw){
var r=raw||{};
var profile=r.profile||r.user||r.personalProfile||{};
var dims=Array.isArray(r.dimensions)?r.dimensions:[];
if(!dims.length&&r.scores&&typeof r.scores==='object'){
Object.keys(r.scores).slice(0,5).forEach(function(key){dims.push({name:key,score:r.scores[key]});});
}
var names=['Direction','Communication','Evaluation','Iteration','Systems Thinking'];
if(!dims.length)names.forEach(function(name){dims.push({name:name,score:0});});
var normalized=dims.slice(0,5).map(function(d,i){return {id:d.id||String(i+1),name:d.name||names[i],score:score(d.score),interpretation:d.interpretation||d.description||''};});
while(normalized.length<5){var i=normalized.length;normalized.push({id:String(i+1),name:names[i],score:0,interpretation:''});}
var values=normalized.map(function(d){return d.score;});
var overall=score(r.overallScore!=null?r.overallScore:average(values));
var sorted=normalized.slice().sort(function(a,b){return b.score-a.score;});
var strongest=sorted[0];
var lever=normalized.map(function(d){var headroom=100-d.score;var strategic={Direction:1.02,Communication:1.05,Evaluation:1.2,Iteration:1.25,'Systems Thinking':1.3}[d.name]||1;return {dimension:d,opportunity:headroom*strategic};}).sort(function(a,b){return b.opportunity-a.opportunity;})[0].dimension;
return {raw:r,profile:{name:profile.name||profile.fullName||r.name||'MAXESS Explorer',title:profile.title||profile.role||'AI Mastery Journey',company:profile.company||'',avatar:profile.avatar||profile.image||''},dimensions:normalized,overall:overall,band:r.band||bandFor(overall),strongest:strongest,lever:lever};
}
function readResult(){
var raw=window.MAXESS_RESULT||null;
if(!raw){try{var encoded=new URLSearchParams(location.search).get('result');if(encoded){var normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');while(normalized.length%4)normalized+='=';var binary=atob(normalized);var bytes=new Uint8Array(binary.length);for(var i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);raw=JSON.parse(new TextDecoder().decode(bytes));window.MAXESS_RESULT=raw;}}catch(e){console.warn('MAXESS result payload could not be decoded.',e);}}
if(!raw&&new URLSearchParams(location.search).get('fixture')==='demo'){raw={overallScore:82,band:'Advanced',profile:{name:'Demo Explorer',title:'Founder / Creator',company:'MAXESS'},dimensions:[{name:'Direction',score:86},{name:'Communication',score:91},{name:'Evaluation',score:79},{name:'Iteration',score:74},{name:'Systems Thinking',score:68}]};window.MAXESS_RESULT=raw;}
state=normalize(raw||{});
}
function initials(name){return name.split(/\s+/).filter(Boolean).slice(0,2).map(function(x){return x[0];}).join('').toUpperCase()||'M';}
function renderProfile(){var p=state.profile;var avatar=p.avatar?'<img src="'+esc(p.avatar)+'" alt="'+esc(p.name)+' profile">':esc(initials(p.name));return '<section class="m-section" id="profile"><div class="m-reading"><div class="m-profile"><div class="m-avatar">'+avatar+'</div><div><h2>'+esc(p.name)+'</h2><p>'+esc(p.title)+(p.company?' · '+esc(p.company):'')+'</p></div><div class="m-profile-badge">Personal Results</div></div></div></section>';}
function renderHero(){return '<section class="m-section m-hero"><div class="m-shell m-hero-grid"><div class="m-hero-copy"><div class="m-eyebrow">MAXESS AI MASTERY ASSESSMENT</div><h1 class="m-title">Your AI mastery is <em>'+esc(state.band.toLowerCase())+'.</em></h1><p class="m-copy">Your MAXESS score is '+state.overall+'. That number is not a label. It is a map of how you currently direct AI — and where the next level of capability is waiting.</p><div class="m-actions"><a class="m-button m-button-primary" href="#pattern">Explore My Pattern <span aria-hidden="true">↓</span></a><button class="m-button m-button-ghost" type="button" data-action="print">Save / Print Report</button></div><div class="m-proof"><div class="m-proof-card"><b>'+state.dimensions.length+' dimensions</b><span>One connected capability profile</span></div><div class="m-proof-card"><b>18 Naya Masters</b><span>Your personalized learning pathways</span></div><div class="m-proof-card"><b>1 next move</b><span>A practical place to improve</span></div></div></div><div class="m-orb-wrap"><div class="m-orb" aria-label="MAXESS score orb showing a score of '+state.overall+' out of 100"><div class="m-orb-core"><strong class="m-score">'+state.overall+'</strong><span class="m-score-label">MAXESS SCORE</span><span class="m-band">'+esc(state.band)+'</span></div><span class="m-orb-state">Naya · Reading your pattern</span></div></div></div></section>';}
function renderInsight(){var s=state.strongest,l=state.lever;return '<section class="m-section m-insight"><div class="m-reading"><div class="m-eyebrow">YOUR REPORT</div><div class="m-insight-card"><p class="m-quote">Your strongest signal is <strong>'+esc(s.name)+'</strong>. Your biggest opportunity is not a weakness — it is <strong>'+esc(l.name)+'</strong> because improving it can unlock more of the capability you already have.</p><p class="m-note">MAXESS is designed to help you see the pattern behind the score. The goal is not to chase a number. The goal is to become a better director of intelligent tools.</p></div></div></section>';}
function renderDimensions(){var cards=state.dimensions.map(function(d){var lever=d.name===state.lever.name?'Strategic lever':d.name===state.strongest.name?'Strongest signal':'Capability';return '<article class="m-dim"><div class="m-dim-head"><div><div class="m-eyebrow">'+esc(lever)+'</div><h3>'+esc(d.name)+'</h3></div><strong class="m-dim-score">'+d.score+'<small>/100</small></strong></div><div class="m-track" aria-label="'+esc(d.name)+' score '+d.score+' out of 100"><span style="--w:'+d.score+'%"></span></div><p>'+esc(d.interpretation||dimensionCopy(d.name,d.score))+'</p><div class="m-dim-lever"><span>Next improvement</span><b>'+esc(d.score>=85?'Protect and extend this strength.':d.score>=70?'Make this capability more deliberate.':'Build a repeatable practice here.')+'</b></div></article>';}).join('');return '<section class="m-section" id="dimensions"><div class="m-shell"><div class="m-section-head"><div><div class="m-eyebrow">FIVE DIMENSIONS</div><h2>See the capability, not just the number.</h2></div><p>Each dimension is a different part of the way you work with AI. Together they create your current mastery pattern.</p></div><div class="m-dim-grid">'+cards+'</div></div></section>';}
function polar(index,value,radius,center){var angle=(-Math.PI/2)+(index*Math.PI*2/5);return {x:center+Math.cos(angle)*radius*(value/100),y:center+Math.sin(angle)*radius*(value/100)};}
function points(value,radius,center){return state.dimensions.map(function(d,i){var p=polar(i,value instanceof Array?value[i]:value,radius,center);return p.x.toFixed(1)+','+p.y.toFixed(1);}).join(' ');}
function renderPattern(){var c=280,r=210;var rings=[20,40,60,80,100].map(function(v){return '<polygon points="'+points(v,r,c)+'" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1"/>';}).join('');var spokes=state.dimensions.map(function(d,i){var p=polar(i,100,r,c);return '<line x1="'+c+'" y1="'+c+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="rgba(255,255,255,.10)"/>';}).join('');var vals=state.dimensions.map(function(d){return d.score;});var data='<polygon points="'+points(vals,r,c)+'" fill="rgba(168,108,255,.18)" stroke="#d1a5ff" stroke-width="3" stroke-linejoin="round"/>';var dots=state.dimensions.map(function(d,i){var p=polar(i,d.score,r,c);return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="6" fill="#fff" stroke="#a86cff" stroke-width="3"/>';}).join('');var labels=state.dimensions.map(function(d,i){var p=polar(i,116,r,c);return '<text x="'+p.x.toFixed(1)+'" y="'+p.y.toFixed(1)+'" fill="#cfc6d9" font-size="11" text-anchor="middle" dominant-baseline="middle">'+esc(d.name)+'</text>';}).join('');var rows=state.dimensions.map(function(d,i){return '<div class="m-pattern-row"><b>0'+(i+1)+'</b><div><span>'+esc(d.name)+'</span><div class="m-mini-bar"><i style="--w:'+d.score+'%"></i></div></div><strong>'+d.score+'</strong></div>';}).join('');return '<section class="m-section" id="pattern"><div class="m-shell"><div class="m-section-head"><div><div class="m-eyebrow">YOUR PATTERN</div><h2>Five signals. One person.</h2></div><p>Your profile becomes useful when the dimensions are seen together. This is the shape of your current AI capability.</p></div><div class="m-pattern"><div class="m-radar"><svg viewBox="0 0 560 560" role="img" aria-label="Radar chart showing your five MAXESS dimension scores">'+rings+spokes+data+dots+labels+'</svg><div class="m-radar-center"><b>'+average(state.dimensions.map(function(d){return d.score;}))+'</b><span>Pattern average</span></div></div><div class="m-pattern-list">'+rows+'</div></div></div></section>';}
function renderSignals(){var s=state.strongest,l=state.lever;return '<section class="m-section"><div class="m-shell"><div class="m-dual"><article class="m-signal"><div class="m-eyebrow">STRONGEST SIGNAL</div><div class="m-big-number">'+s.score+'</div><h2 class="m-card-title">'+esc(s.name)+'</h2><p class="m-card-copy">'+esc(dimensionCopy(s.name,s.score))+'</p><div class="m-callout"><strong>Why it matters:</strong> this is a capability you can use as a foundation for the next layer of mastery.</div></article><article class="m-lever"><div class="m-eyebrow">BIGGEST LEVER</div><div class="m-big-number">'+l.score+'</div><h2 class="m-card-title">'+esc(l.name)+'</h2><p class="m-card-copy">This is the area where additional capability can create meaningful leverage across your broader AI practice.</p><div class="m-callout"><strong>Opportunity:</strong> move from '+l.score+' toward deliberate, repeatable performance rather than chasing perfection.</div></article></div></div></section>';}
function renderNext(){var steps=[['01','KNOW','Define the outcome before AI begins.'],['02','TELL','Give AI the context, constraints and standards that matter.'],['03','CREATE','Build a real first version that can be judged.'],['04','SCORE','Evaluate the result, improve it and repeat.']];return '<section class="m-section"><div class="m-shell m-next"><div><div class="m-eyebrow">YOUR NEXT MOVE</div><h2 class="m-title">Turn insight into <em>capability.</em></h2><p class="m-copy">Your next level does not require more random experimentation. It requires a deliberate loop that turns what you learned here into better work.</p></div><div class="m-steps">'+steps.map(function(s){return '<article class="m-step"><div class="m-step-num">'+s[0]+'</div><div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div></article>';}).join('')+'</div></div></section>';}
function recommended(){var names=[];[state.strongest.name,state.lever.name].forEach(function(name){(MASTER_MAP[name]||[]).forEach(function(m){if(names.indexOf(m)<0)names.push(m);});});return names;}
function renderNaya(){var s=state.strongest,l=state.lever;var text='I read a clear pattern here, '+state.profile.name.split(' ')[0]+'. '+s.name+' is giving you a strong foundation, while '+l.name+' is the place where focused practice can create more leverage. Do not try to improve everything at once. Use the strongest signal as your foundation and the biggest lever as your next experiment.';return '<section class="m-section"><div class="m-shell"><div class="m-naya"><div><div class="m-naya-orb" aria-label="Naya is interpreting your results"><b>NAYA</b></div><div class="m-naya-state">Interpreting your pattern</div></div><div class="m-naya-copy"><div class="m-eyebrow">NAYA · YOUR AI GUIDE</div><h2>This is what I see.</h2><p>'+esc(text)+'</p></div></div></div></section>';}
function renderMasters(){var rec=recommended();var cards=MASTERS.map(function(m,i){var yes=rec.indexOf(m[0])>=0;return '<article class="m-master'+(yes?' is-recommended':'')+'"><div class="m-master-index">MASTER '+String(i+1).padStart(2,'0')+'</div><h3>'+esc(m[0])+'</h3><p>'+esc(m[1])+'</p>'+(yes?'<span class="m-master-badge">Recommended for you</span>':'')+'</article>';}).join('');return '<section class="m-section"><div class="m-shell"><div class="m-section-head"><div><div class="m-eyebrow">18 NAYA MASTERS</div><h2>Your capability library.</h2></div><p>These are not random tools. They are 18 ways Naya can help you build, learn, create and orchestrate. The highlighted Masters connect directly to your current pattern.</p></div><div class="m-masters">'+cards+'</div></div></section>';}
function renderSystem(){return '<section class="m-section"><div class="m-shell"><div class="m-section-head"><div><div class="m-eyebrow">THE MAXESS LOOP</div><h2>Mastery is built through iteration.</h2></div><p>The assessment is the beginning. The real value comes from repeatedly applying better thinking to real work.</p></div><div class="m-system"><div class="m-system-card"><b>01</b><h3>Know</h3><p>Understand the outcome and the person you are trying to help.</p></div><div class="m-system-card"><b>02</b><h3>Tell</h3><p>Give AI the context, constraints and quality bar.</p></div><div class="m-system-card"><b>03</b><h3>Create</h3><p>Make something real enough to inspect and improve.</p></div><div class="m-system-card"><b>04</b><h3>Score</h3><p>Judge the result, identify the gap and improve again.</p></div></div></div></section>';}
function renderVideo(){return '<section class="m-section"><div class="m-shell"><div class="m-section-head"><div><div class="m-eyebrow">KEEP GOING</div><h2>Now take the next step with Naya.</h2></div><p>Your Results report gives you the map. The larger NayaNET experience gives you places to use it.</p></div><div class="m-video"><iframe loading="lazy" src="https://www.youtube.com/embed/8tApdV0UpRs" title="NayaNET introduction" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div></section>';}
function renderFinal(){return '<section class="m-section m-final"><div class="m-reading"><div class="m-eyebrow" style="justify-content:center">YOUR NEXT CHAPTER</div><h2>You are not finished. <em>You are calibrated.</em></h2><p>Take your strongest signal with you. Work deliberately on your biggest lever. Then come back, score the work and see what changed.</p><div class="m-actions"><a class="m-button m-button-primary" href="#profile">Review My Results ↑</a><button class="m-button m-button-ghost" type="button" data-action="print">Print My Report</button></div></div></section><footer class="m-footer">MAXESS · AI Mastery Assessment · Powered by NayaNET</footer>';}
function assemble(){var app=document.getElementById('app');app.innerHTML=renderHero()+renderProfile()+renderInsight()+renderDimensions()+renderPattern()+renderSignals()+renderNext()+renderNaya()+renderMasters()+renderSystem()+renderVideo()+renderFinal();bind();}
function bind(){document.querySelectorAll('[data-action="print"]').forEach(function(button){button.addEventListener('click',function(){window.print();});});var status=document.getElementById('m-status');status.style.display='block';setTimeout(function(){status.style.display='none';},1800);}
function init(){readResult();assemble();}
window.MAXESS_RESULTS_V18={version:'18.0',state:state,init:init};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
