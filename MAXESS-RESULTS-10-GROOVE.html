<!doctype html>

<title>MAXESS — Your AI Mastery Results</title>
<script>
(function(){
  window.MAXESS_RESULT = window.MAXESS_RESULT || null;
  try {
    var q=new URLSearchParams(location.search).get('result');
    if(q){var n=q.replace(/-/g,'+').replace(/_/g,'/');while(n.length%4)n+='=';var b=atob(n),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);window.MAXESS_RESULT=JSON.parse(new TextDecoder().decode(u));}
  } catch(e){console.warn('MAXESS result payload unavailable',e);}
})();
</script>
<style>
:root{--bg:#050307;--ink:#fff;--muted:#aaa1b2;--line:#ffffff18;--purple:#a66cff;--violet:#d8b1ff;--cyan:#50ddff;--green:#51e2ad;--gold:#f7d58c;--pink:#ff6bbd;--max:1280px}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}button{cursor:pointer}.page{min-height:100vh;background:radial-gradient(ellipse 75% 30% at 50% 0,#a66cff3b,transparent 70%),linear-gradient(180deg,#12071b,#050307 34%,#030204)}.wrap{width:min(var(--max),calc(100% - 32px));margin:auto}.hero{text-align:center;padding:22px 0 72px}.naya{display:flex;align-items:center;gap:14px;width:min(860px,100%);margin:0 auto 18px;padding:12px 14px;text-align:left;border:1px solid #c89cff3d;border-radius:24px;background:#ffffff09;backdrop-filter:blur(12px)}.naya img{width:62px;height:62px;flex:0 0 62px;object-fit:cover;border-radius:50%;border:1px solid #fff5}.naya-copy{flex:1}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}.naya strong{display:block;margin-top:4px;font-size:16px}.naya p{margin:3px 0 0;color:#c4bdc9;font-size:13px;line-height:1.45}.listen{border:1px solid #d8b6ff55;border-radius:999px;padding:11px 16px;background:#a66cff18;color:#fff;font-size:11px;font-weight:900;white-space:nowrap}.hero h1{max-width:900px;margin:30px auto 12px;font-size:clamp(44px,7vw,88px);line-height:.92;letter-spacing:-.065em}.hero h1 em{font-style:normal;color:var(--violet)}.intro{max-width:700px;margin:auto;color:#b4acba;line-height:1.6}.orb{width:min(500px,82vw);aspect-ratio:1;margin:38px auto 24px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#ff4545,#ffe56b 24%,#58e18b 38%,#50ddff 50%,#6472ff 64%,#a75bff 78%,#ff4fb7 92%,#ff4545);box-shadow:0 0 90px #a66cff55;animation:spin 28s linear infinite}.orb:before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff,transparent 5%,#fff2 12%,transparent 29%),radial-gradient(circle,#28153f,#0b0712 57%,#020207);box-shadow:inset 0 -70px 90px #000b}.orb:after{content:"";position:absolute;inset:9%;border:1px solid #fff5;border-radius:50%}.score{position:relative;z-index:2}.score strong{display:block;font-size:clamp(105px,16vw,190px);line-height:.78;letter-spacing:-.08em}.score span{display:block;margin-top:22px;color:var(--violet);font-size:12px;font-weight:900;letter-spacing:.25em}.band{margin-top:10px;font-weight:900}.mini{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 auto 28px}.mini-orb{width:108px;height:108px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#241431,#09050e 70%);border:1px solid #fff2;box-shadow:inset 0 1px #fff2,0 14px 35px #0008;transition:transform .2s,border-color .2s}.mini-orb:before{content:"";position:absolute;inset:6px;border-radius:50%;background:conic-gradient(var(--c) var(--p),#fff1 0);opacity:.95}.mini-orb:after{content:"";position:absolute;inset:12px;border-radius:50%;background:#09050e}.mini-orb b,.mini-orb small{position:relative;z-index:2}.mini-orb b{font-size:23px}.mini-orb small{position:absolute;bottom:14px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7px;letter-spacing:.05em;text-transform:uppercase;color:#aaa}.mini-orb:hover,.mini-orb:focus-visible{transform:translateY(-5px) scale(1.03);border-color:#d8b6ff77;outline:none}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 20px;border-radius:14px;border:1px solid var(--line);color:#fff;text-decoration:none;font-size:12px;font-weight:900}.primary{background:linear-gradient(135deg,#a55cff,#6d2bd1)}section{padding:76px 0;border-top:1px solid #fff1}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:30px}.head h2{max-width:720px;margin:8px 0 0;font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.055em}.head p{max-width:500px;margin:0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.path,.step,.row{padding:22px;border:1px solid var(--line);border-radius:22px;background:#ffffff08}.card h3,.path h3,.step h3{margin:8px 0;font-size:20px}.card p,.path p,.step p{color:var(--muted);line-height:1.55;font-size:13px}.lever{margin-top:15px;padding:12px;border-radius:13px;background:#a66cff10;border:1px solid #a66cff25}.lever small{color:#c99dff;font-weight:900;letter-spacing:.12em}.lever b{display:block;margin-top:5px;font-size:12px}.fp{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.radar{position:relative}.radar svg{width:100%;display:block}.radar-center{position:absolute;inset:0;display:grid;place-items:center}.radar-center div{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:#050307e8;border:1px solid #fff2}.radar-center b{font-size:34px}.radar-center small{font-size:8px;color:#999;text-transform:uppercase}.rows{display:grid;gap:10px}.rowtop{display:flex;justify-content:space-between;gap:10px}.bar{height:7px;margin-top:11px;border-radius:99px;background:#fff1;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#7b3ce0,#d7b0ff,#50ddff)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quote{max-width:900px;margin:auto;text-align:center;font-size:clamp(30px,4vw,52px);line-height:1.04}.quote strong{color:var(--violet)}.end{text-align:center;padding:90px 0}.endbox{padding:48px 25px;border:1px solid #c99dff33;border-radius:30px;background:#ffffff08}.end img{width:88px;height:88px;border-radius:50%;object-fit:cover}.end h2{font-size:clamp(36px,5vw,62px);letter-spacing:-.05em;margin:18px 0 10px}.empty{min-height:80vh;display:grid;place-items:center;text-align:center}.empty h1{font-size:clamp(42px,7vw,76px);line-height:.95}.empty p{max-width:600px;color:var(--muted);line-height:1.6;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid,.paths{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.fp{grid-template-columns:1fr}.head{display:block}.head p{margin-top:14px}}@media(max-width:600px){.wrap{width:calc(100% - 22px)}.naya{flex-wrap:wrap}.listen{margin-left:76px}.orb{width:92vw}.mini-orb{width:82px;height:82px}.mini-orb b{font-size:18px}.mini-orb small{bottom:10px;font-size:6px}.grid,.paths,.steps{grid-template-columns:1fr}.hero h1{font-size:clamp(42px,14vw,70px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style>
</head>
<body>
<main id="maxess-results" class="page"></main>
<script>
(()=>{
const NAYA='https://i.postimg.cc/dVXw7sRN/grok-image-f75a6f12-4e3a-4c99-a334-5684ba0f7401.jpg';
const PATHWAYS=[['Writing & Communication','Turn ideas into clear instructions, messages, stories, and decisions.'],['Research & Information','Find, compare, synthesize, and explain useful information.'],['Brainstorming & Ideas','Expand possibilities without losing the goal.'],['Content Creation','Create useful, human content faster and better.'],['Business & Strategy','Turn insight into positioning, offers, decisions, and plans.'],['Marketing & Sales','Make value understandable and action easier.'],['Learning & Education','Use AI as a tutor, curriculum designer, and thinking partner.'],['Coding & Software','Build, debug, explain, and improve software with AI.'],['Images & Visual Creation','Turn concepts into visual communication and creative assets.'],['Video & Media','Plan, script, edit, package, and distribute media.'],['Documents & Presentations','Transform raw thinking into polished deliverables.'],['Data & Analysis','Use evidence, structure, and models to make better decisions.'],['Productivity & Planning','Turn intention into organized execution.'],['Career & Professional Development','Build skills, positioning, confidence, and opportunity.'],['Personal Decision-Making','Think through choices with more clarity and less noise.'],['Creative Work','Explore, shape, and finish original creative work.'],['Automation & Systems','Connect repeatable work into reliable systems.'],['Advanced AI Work','Orchestrate models, agents, tools, context, and evaluation.']];
const DEMO={overallScore:82,band:'Advancing',dimensions:[{id:'1',name:'Direction',score:86},{id:'2',name:'Communication',score:91},{id:'3',name:'Evaluation',score:79},{id:'4',name:'Iteration',score:74},{id:'5',name:'Systems Thinking',score:68}]};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clamp=n=>Math.max(0,Math.min(100,Number(n)||0));
const band=n=>n<=50?'Foundation':n<=75?'Developing':n<=90?'Advancing':'Mastering';
function data(){if(window.MAXESS_RESULT)return window.MAXESS_RESULT;return new URLSearchParams(location.search).get('fixture')==='demo'?DEMO:null}
function render(){const r=data();const root=document.getElementById('maxess-results');if(!r){root.innerHTML='<div class="empty wrap"><div><div class="eyebrow">MAXESS RESULTS</div><h1>Your result is being prepared.</h1><p>No score has been invented or substituted. The personalized MAXESS result is not available in this page request yet.</p></div></div>';return}const score=Math.round(clamp(r.overallScore));let dims=(Array.isArray(r.dimensions)?r.dimensions:[]).slice(0,5).map((d,i)=>({id:d.id||String(i+1),name:d.name||('Dimension '+(i+1)),score:Math.round(clamp(d.score))}));while(dims.length<5)dims.push({id:String(dims.length+1),name:'Dimension '+(dims.length+1),score:0});const sorted=[...dims].sort((a,b)=>b.score-a.score),strong=sorted[0],lever=sorted[4],colors=['#a66cff','#50ddff','#51e2ad','#f7d58c','#ff6bbd'];const mini=dims.map((d,i)=>`<div class="mini-orb" style="--p:${d.score}%;--c:${colors[i]}" tabindex="0" aria-label="${esc(d.name)} ${d.score} out of 100"><b>${d.score}</b><small>${esc(d.name)}</small></div>`).join('');const cards=dims.map((d,i)=>`<article class="card"><div class="eyebrow">${String(i+1).padStart(2,'0')} · ${d.score}/100</div><h3>${esc(d.name)}</h3><p>${d.id===strong.id?'This is a current strength you can turn into leverage and reusable capability.':d.id===lever.id?'This is the clearest current opportunity for deliberate improvement.':'This capability is part of your current profile and grows through deliberate practice.'}</p><div class="lever"><small>${d.id===strong.id?'STRENGTH':d.id===lever.id?'HIGHEST-LEVERAGE OPPORTUNITY':'LEVER'}</small><b>${d.id===strong.id?'Turn this strength into reusable instructions, frameworks, and systems.':d.id===lever.id?'Practice this on one real workflow repeatedly until improvement is visible.':'Create, score, improve, repeat.'}</b></div></article>`).join('');const rows=dims.map((d,i)=>`<div class="row"><div class="rowtop"><b>${String(i+1).padStart(2,'0')} · ${esc(d.name)}</b><strong>${d.score}</strong></div><div class="bar"><i style="--w:${d.score}%"></i></div></div>`).join('');const angle=i=>-90+i*72;const point=(i,v,R=180)=>{const q=angle(i)*Math.PI/180,rad=R*v/100;return `${250+Math.cos(q)*rad},${250+Math.sin(q)*rad}`};const rings=[20,40,60,80,100].map(v=>`<polygon points="${dims.map((_,i)=>point(i,v)).join(' ')}" fill="none" stroke="#fff1"/>`).join('');const axes=dims.map((_,i)=>{const q=angle(i)*Math.PI/180;return `<line x1="250" y1="250" x2="${250+Math.cos(q)*180}" y2="${250+Math.sin(q)*180}" stroke="#fff1"/>`}).join('');const dots=dims.map((d,i)=>{const q=angle(i)*Math.PI/180,rad=180*d.score/100;return `<circle cx="${250+Math.cos(q)*rad}" cy="${250+Math.sin(q)*rad}" r="7" fill="#fff" stroke="${colors[i]}" stroke-width="3"/>`}).join('');const paths=PATHWAYS.map((p,i)=>`<article class="path"><div class="eyebrow">${String(i+1).padStart(2,'0')}</div><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p></article>`).join('');root.innerHTML=`
<section class="hero"><div class="wrap">
<div class="naya"><img src="${NAYA}" alt="Naya"><div class="naya-copy"><div class="eyebrow">Naya · Your Guide</div><strong>Hi. I've looked at your results.</strong><p>This isn't your judgment. It's your map.</p></div><button class="listen" id="listenNaya" type="button">▶ Listen to Naya</button></div>
<div class="eyebrow">YOUR AI MASTERY RESULT</div><h1>Your AI capability has a <em>shape.</em></h1><p class="intro">You didn't just receive a number. You created a picture of how you currently think, direct, evaluate, iterate, and build with AI.</p>
<div class="orb" aria-label="MAXESS Score ${score}"><div class="score"><strong>${score}</strong><span>MAXESS SCORE</span><div class="band">${esc(r.band||band(score))}</div></div></div>
<div class="mini" aria-label="Five capability dimensions">${mini}</div>
<div class="actions"><a class="btn primary" href="#pattern">Explore Your Results ↓</a><a class="btn" href="#pathways">See Your 18 Pathways →</a></div>
</div></section>
<section id="pattern"><div class="wrap"><div class="head"><div><div class="eyebrow">01 · YOUR FINGERPRINT</div><h2>See the pattern, not just the score.</h2></div><p>Five dimensions show where your current capability is strong, where it is developing, and where a small improvement can create disproportionate upside.</p></div><div class="fp"><div class="radar"><svg viewBox="0 0 500 500" role="img" aria-label="Five-dimension capability fingerprint">${rings}${axes}<polygon points="${dims.map((d,i)=>point(i,d.score)).join(' ')}" fill="#a66cff24" stroke="#d8b1ff" stroke-width="3"/>${dots}</svg><div class="radar-center"><div><b>${score}</b><small>overall</small></div></div></div><div class="rows">${rows}</div></div></div></section>
<section><div class="wrap"><div class="head"><div><div class="eyebrow">02 · WHAT IT MEANS</div><h2>Every score has a job.</h2></div><p>A result becomes useful when you know what it means and what to do with it. These are your current strengths and levers.</p></div><div class="grid">${cards}</div></div></section>
<section><div class="wrap"><div class="quote">Your strongest capability is <strong>${esc(strong.name)}</strong>.<br>Your highest-leverage opportunity is <strong>${esc(lever.name)}</strong>.</div></div></section>
<section><div class="wrap"><div class="head"><div><div class="eyebrow">03 · YOUR NEXT CHAPTER</div><h2>From capability to compounding.</h2></div><p>Mastery is not a finish line. It is the ability to make your strengths repeatable, measurable, and increasingly valuable.</p></div><div class="steps"><article class="step"><b>01 · DIRECT</b><h3>Know the outcome</h3><p>Define what success looks like before AI begins.</p></article><article class="step"><b>02 · CREATE</b><h3>Build the first version</h3><p>Give AI enough context and direction to do useful work.</p></article><article class="step"><b>03 · SCORE</b><h3>Judge the work</h3><p>Use criteria instead of accepting the first answer.</p></article><article class="step"><b>04 · COMPOUND</b><h3>Make it reusable</h3><p>Turn successful work into a system you can repeat.</p></article></div></div></section>
<section id="pathways"><div class="wrap"><div class="head"><div><div class="eyebrow">04 · YOUR 18 AI PATHWAYS</div><h2>Don't learn AI. Learn what AI can do for you.</h2></div><p>These are 18 capability doors. Explore the ones that matter most to your goals, then build depth instead of collecting tools.</p></div><div class="paths">${paths}</div></div></section>
<section><div class="wrap"><div class="head"><div><div class="eyebrow">05 · TURN INSIGHT INTO GROWTH</div><h2>Know where you are. Know what moves you.</h2></div><p>Protect the strength. Build the lever. Make progress repeatable.</p></div><div class="grid"><article class="card"><div class="eyebrow">NEXT 01</div><h3>Protect your strength</h3><p>Use ${esc(strong.name)} as a directing advantage.</p></article><article class="card"><div class="eyebrow">NEXT 02</div><h3>Build your lever</h3><p>Practice ${esc(lever.name)} on one repeated workflow.</p></article><article class="card"><div class="eyebrow">NEXT 03</div><h3>Make quality visible</h3><p>Score every meaningful AI output before accepting it.</p></article></div></div></section>
<section class="end"><div class="wrap"><div class="endbox"><img src="${NAYA}" alt="Naya"><div class="eyebrow" style="margin-top:16px">Naya · Your Guide</div><h2>The Results chapter is complete.<br>The next chapter is NayaNET.</h2><p class="intro">Your profile is not a judgment. It is a starting position. Now turn what you learned into capability.</p><div class="actions" style="margin-top:24px"><a class="btn primary" href="https://takeyourpowerback.xyz/">Start Your Free Trial →</a></div></div></div></section>`;document.getElementById('listenNaya').addEventListener('click',()=>{const evt=new CustomEvent('MAXESS_LISTEN_NAYA',{detail:{result:r}});window.dispatchEvent(evt);document.getElementById('listenNaya').textContent='✓ Naya is ready';});}
render();
})();
</script>
</body>
</html>
