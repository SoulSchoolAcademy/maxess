name: Assemble Complete Groove Embed

on:
  push:
    branches: [maxess-complete-groove-embed]
    paths:
      - 'TEMP-EMBED-ASSEMBLER.yml'
      - 'MAXESS-RESULTS-EXPERIENCE.js'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build one self-contained Groove artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          js = Path('MAXESS-RESULTS-EXPERIENCE.js').read_text(encoding='utf-8')
          bootstrap = '''<!-- MAXESS RESULTS 10.10 — COMPLETE GROOVE EMBED -->\n<!-- PASTE THIS ENTIRE FILE INTO GROOVE. NO EXTERNAL GITHUB SCRIPT IS REQUIRED. -->\n<div id="maxess-results-10" aria-label="MAXESS Personal AI Mastery Results"></div>\n<script>\n(function(){\n  'use strict';\n  if(!window.MAXESS_RESULT || !window.MAXESS_RESULT.dimensions){\n    try{\n      var encoded=new URLSearchParams(window.location.search).get('result');\n      if(encoded){\n        var normalized=encoded.replace(/-/g,'+').replace(/_/g,'/');\n        while(normalized.length%4) normalized+='=';\n        var binary=atob(normalized), bytes=new Uint8Array(binary.length);\n        for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);\n        window.MAXESS_RESULT=JSON.parse(new TextDecoder().decode(bytes));\n      }\n    }catch(e){console.warn('MAXESS result payload could not be decoded.',e)}\n  }\n  if(!window.MAXESS_RESULT || !window.MAXESS_RESULT.dimensions){\n    window.MAXESS_RESULT={overallScore:82,dimensions:[{name:'Direction',score:86},{name:'Communication',score:91},{name:'Evaluation',score:79},{name:'Iteration',score:74},{name:'Systems Thinking',score:68}]};\n  }\n})();\n</script>\n<script>\n'''
          artifact=bootstrap+js+'\n</script>\n'
          Path('MAXESS-RESULTS-GROOVE-EMBED.html').write_text(artifact,encoding='utf-8')
          Path('MAXESS-RESULTS-FINAL-GROOVE-EMBED.html').write_text(artifact,encoding='utf-8')
          PY
          node --check MAXESS-RESULTS-EXPERIENCE.js
          test $(wc -c < MAXESS-RESULTS-GROOVE-EMBED.html) -gt 20000
          ! grep -q "raw.githubusercontent.com" MAXESS-RESULTS-GROOVE-EMBED.html
      - name: Commit complete artifact and remove assembler
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya'
          git config user.email 'naya@users.noreply.github.com'
          rm -f TEMP-EMBED-ASSEMBLER.yml
          git add -- MAXESS-RESULTS-GROOVE-EMBED.html MAXESS-RESULTS-FINAL-GROOVE-EMBED.html TEMP-EMBED-ASSEMBLER.yml
          git commit -m 'Deliver complete self-contained Groove Results embed'
          git push origin HEAD:maxess-complete-groove-embed
