<title>MAXESS — Flagship Results Experience</title>
<style>
:root{--bg:#050507;--ink:#f8f7fb;--muted:#9b96a4;--line:rgba(255,255,255,.11);--soft:rgba(255,255,255,.045);--purple:#b895ff;--gold:#ffd45a;--green:#35e39b;--blue:#3ca8ff;--pink:#ed42c4;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}button{font:inherit}.maxess-results{position:relative;isolation:isolate;min-height:100vh;overflow:hidden;background:radial-gradient(circle at 50% -8%,rgba(138,92,255,.16),transparent 32%),radial-gradient(circle at 90% 45%,rgba(118,92,255,.06),transparent 28%),var(--bg)}.maxess-results:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 18%)}.maxess-results:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.07;background-image:radial-gradient(rgba(255,255,255,.5) .45px,transparent .45px);background-size:6px 6px}.mx-shell{width:min(1180px,100%);margin:auto;padding:18px 22px 90px}.mx-nav{display:flex;align-items:center;justify-content:space-between;padding:4px 0 22px;border-bottom:1px solid var(--line)}.mx-logo{font-size:22px;font-weight:950;letter-spacing:.15em}.mx-logo span{color:var(--purple)}.mx-nav-note{font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#77727f}.mx-hero{display:grid;grid-template-columns:minmax(330px,.9fr) minmax(0,1.1fr);gap:clamp(40px,8vw,110px);align-items:center;min-height:650px;padding:72px 0 82px}.mx-kicker{font-size:10px;font-weight:950;letter-spacing:.2em;text-transform:uppercase;color:var(--purple)}.mx-hero h1{margin:13px 0 0;font-size:clamp(44px,6vw,78px);line-height:.94;letter-spacing:-.06em;font-weight:950}.mx-hero-copy{max-width:620px}.mx-hero-copy>p{max-width:590px;margin:22px 0 0;color:#bbb6c2;font-size:17px;line-height:1.65}.mx-ring{position:relative;width:min(380px,82vw);aspect-ratio:1;margin:auto;display:grid;place-items:center}.mx-ring-svg{position:absolute;inset:0;transform:rotate(-90deg)}.mx-ring-track,.mx-ring-progress{fill:none;stroke-width:10}.mx-ring-track{stroke:rgba(255,255,255,.08)}.mx-ring-progress{stroke:var(--ring,#b895ff);stroke-linecap:round;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ring,#b895ff) 45%,transparent));transition:stroke-dashoffset 1.1s var(--ease)}.mx-ring-core{position:absolute;inset:54px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.08),transparent 28%),#08080c;border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 0 50px rgba(138,92,255,.08),0 25px 70px rgba(0,0,0,.5)}.mx-score{font-size:clamp(78px,9vw,112px);line-height:.82;font-weight:950;letter-spacing:-.075em}.mx-score-label{margin-top:17px;font-size:9px;font-weight:950;letter-spacing:.2em;color:#817b89}.mx-band{display:inline-flex;align-items:center;gap:8px;margin-top:27px;padding:9px 14px;border:1px solid rgba(184,149,255,.3);border-radius:999px;background:rgba(184,149,255,.06);font-size:10px;font-weight:950;letter-spacing:.12em;text-transform:uppercase}.mx-band-dot{width:7px;height:7px;border-radius:50%;background:var(--ring,#b895ff);box-shadow:0 0 12px var(--ring,#b895ff)}.mx-section{padding:92px 0;border-top:1px solid var(--line)}.mx-section-head{max-width:760px;margin-bottom:38px}.mx-section-head.center{text-align:center;margin-left:auto;margin-right:auto}.mx-section-head h2{margin:10px 0 0;font-size:clamp(31px,4.5vw,55px);line-height:1;letter-spacing:-.05em;font-weight:950}.mx-section-head p{max-width:700px;margin:15px 0 0;color:var(--muted);font-size:15px;line-height:1.65}.mx-profile{display:grid;grid-template-columns:.75fr 1.25fr;gap:70px;align-items:center}.mx-profile-visual{min-height:350px;position:relative;display:grid;place-items:center;overflow:hidden}.mx-orbit{position:absolute;border:1px solid rgba(184,149,255,.2);border-radius:50%}.mx-orbit.a{width:230px;height:145px;transform:rotate(-22deg)}.mx-orbit.b{width:330px;height:235px;transform:rotate(31deg)}.mx-orbit.c{width:270px;height:270px;border-style:dashed;opacity:.35}.mx-profile-core{width:138px;height:138px;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 30% 20%,#fff,#d8caff 11%,#8152f1 42%,#170c2e 100%);border:1px solid #eee8ff;box-shadow:inset 0 2px 5px rgba(255,255,255,.65),0 0 55px rgba(138,92,255,.35),0 25px 55px rgba(0,0,0,.5);font-size:26px;font-weight:950}.mx-profile-core small{display:block;font-size:7px;letter-spacing:.17em}.mx-profile-copy p{margin:0 0 18px;color:#c9c4cf;font-size:17px;line-height:1.7}.mx-profile-copy strong{color:#fff}.mx-fingerprint-wrap{padding:12px 0}.mx-fingerprint{width:100%;height:auto;display:block;overflow:visible}.mx-fingerprint .grid{fill:none;stroke:rgba(255,255,255,.09);stroke-width:1}.mx-fingerprint .axis{stroke:rgba(255,255,255,.07);stroke-width:1}.mx-fingerprint .shape{fill:rgba(184,149,255,.1);stroke:#b895ff;stroke-width:3;filter:drop-shadow(0 0 12px rgba(138,92,255,.3));transition:all .7s var(--ease)}.mx-fingerprint .node{fill:#fff;stroke:#b895ff;stroke-width:3}.mx-fingerprint text{fill:#aaa4b1;font-size:12px;font-weight:850}.mx-dimension-line{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:25px}.mx-dimension-line div{padding:14px 5px;border-top:1px solid var(--line);text-align:center}.mx-dimension-line strong{display:block;font-size:11px}.mx-dimension-line span{display:block;margin-top:6px;font-size:22px;font-weight:950;color:#d9d2e4}.mx-leverage{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mx-leverage article{position:relative;min-height:320px;padding:34px;border:1px solid var(--line);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));overflow:hidden}.mx-leverage article:after{content:"";position:absolute;width:190px;height:190px;right:-80px;bottom:-80px;border-radius:50%;background:var(--accent);filter:blur(40px);opacity:.1}.mx-leverage small{position:relative;z-index:1;color:#8e8896;font-size:9px;font-weight:950;letter-spacing:.19em}.mx-leverage h3{position:relative;z-index:1;margin:13px 0 0;max-width:70%;font-size:clamp(28px,3.6vw,43px);line-height:1;letter-spacing:-.04em}.mx-leverage b{position:absolute;z-index:1;right:28px;top:27px;font-size:56px;line-height:1;color:var(--accent)}.mx-leverage p{position:relative;z-index:1;max-width:600px;margin:22px 0 0;color:#aaa5b1;font-size:14px;line-height:1.65}.mx-insight{padding:58px 0;border-top:1px solid rgba(184,149,255,.14);border-bottom:1px solid rgba(184,149,255,.14)}.mx-insight h2{max-width:900px;margin:12px 0 0;font-size:clamp(42px,6vw,76px);line-height:.92;letter-spacing:-.06em}.mx-insight p{max-width:900px;margin:26px 0 0;color:#d2ccd8;font-size:19px;line-height:1.65}.mx-insight .source{display:block;margin-top:22px;color:#77717f;font-size:10px;letter-spacing:.08em}.mx-flow{padding:25px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(90deg,rgba(184,149,255,.07),rgba(60,168,255,.04));text-align:center;color:#ddd7e5;font-size:clamp(12px,2vw,19px);font-weight:950;letter-spacing:.1em}.mx-naya{display:grid;grid-template-columns:110px 1fr;gap:28px;align-items:center;padding:35px;border:1px solid rgba(184,149,255,.25);border-radius:34px;background:radial-gradient(circle at 8% 20%,rgba(138,92,255,.13),transparent 40%),linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012))}.mx-naya-orb{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#fff,#d8caff 12%,#8a5cff 40%,#241044 72%,#09050f);border:1px solid #eee7ff;font-size:30px;font-weight:950;box-shadow:inset 0 2px 4px rgba(255,255,255,.65),0 0 40px rgba(138,92,255,.35)}.mx-naya h2{margin:9px 0 0;font-size:clamp(30px,4vw,50px);line-height:1;letter-spacing:-.045em}.mx-naya p{margin:16px 0 0;color:#aaa5b1;font-size:15px;line-height:1.65}.mx-masters{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mx-master{padding:26px;border:1px solid var(--line);border-radius:27px;background:rgba(255,255,255,.025)}.mx-master small{color:var(--purple);font-size:9px;font-weight:950;letter-spacing:.15em}.mx-master h3{margin:12px 0 0;font-size:20px}.mx-master .score{margin-top:17px;font-size:36px;font-weight:950}.mx-master p{margin:10px 0 0;color:#8f8996;font-size:12px;line-height:1.55}.mx-keys{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px}.mx-key{padding:25px;border:1px solid var(--line);border-radius:27px;background:rgba(255,255,255,.025)}.mx-key:first-child{background:linear-gradient(145deg,rgba(184,149,255,.09),rgba(255,255,255,.02))}.mx-key b{color:var(--purple);font-size:12px;letter-spacing:.1em}.mx-key h3{margin:16px 0 0;font-size:17px}.mx-key p{margin:9px 0 0;color:#8f8996;font-size:12px;line-height:1.55}.mx-master-ai{padding:55px 40px;border:1px solid rgba(184,149,255,.18);border-radius:38px;background:linear-gradient(145deg,rgba(138,92,255,.1),rgba(255,255,255,.012))}.mx-master-ai h2{max-width:850px;margin:12px 0 0;font-size:clamp(34px,5vw,62px);line-height:.98;letter-spacing:-.05em}.mx-master-ai .flowline{margin-top:28px;color:#88828f;font-size:10px;font-weight:950;letter-spacing:.15em;text-align:center}.mx-threshold{text-align:center;padding:105px 10px 80px;border-top:1px solid rgba(184,149,255,.15);background:radial-gradient(circle at 50% 0,rgba(138,92,255,.12),transparent 42%)}.mx-threshold h2{margin:12px 0 0;font-size:clamp(43px,6.5vw,82px);line-height:.92;letter-spacing:-.065em}.mx-threshold h2 span{color:var(--purple)}.mx-threshold p{color:#85808f;margin:20px 0 0}.mx-button{margin-top:27px;min-height:56px;padding:0 25px;border-radius:18px;border:1px solid rgba(184,149,255,.7);background:#09080d;color:#fff;font-weight:950;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s ease}.mx-button:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(138,92,255,.2)}.mx-button.primary{color:#08060c;background:linear-gradient(135deg,#fff,#d9c6ff,#b895ff);border-color:#eee7ff}.mx-button.secondary{margin-left:8px;border-color:rgba(255,255,255,.16);color:#aaa5b1}.mx-error{padding:80px 20px;text-align:center;color:#aaa5b1}.mx-error strong{display:block;color:#fff;font-size:22px;margin-bottom:8px}@media(max-width:850px){.mx-hero,.mx-profile{grid-template-columns:1fr}.mx-hero{text-align:center;padding:55px 0}.mx-hero-copy>p{margin-left:auto;margin-right:auto}.mx-score{font-size:86px}.mx-leverage{grid-template-columns:1fr}.mx-masters{grid-template-columns:1fr 1fr}.mx-keys{grid-template-columns:1fr 1fr}}@media(max-width:600px){.mx-shell{padding-left:15px;padding-right:15px}.mx-nav-note{display:none}.mx-hero{min-height:0;gap:45px}.mx-ring{width:285px}.mx-ring-core{inset:42px}.mx-section{padding:65px 0}.mx-dimension-line{grid-template-columns:repeat(2,1fr)}.mx-dimension-line div:last-child{grid-column:1/-1}.mx-masters,.mx-keys{grid-template-columns:1fr}.mx-naya{grid-template-columns:1fr;text-align:center}.mx-naya-orb{margin:auto}.mx-master-ai{padding:38px 23px}.mx-threshold{padding-top:75px}.mx-button.secondary{margin-left:0}.mx-fingerprint text{font-size:10px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>

<body>
<section class="maxess-results" id="maxessResults" aria-label="MAXESS Results">
<div class="mx-shell">
<nav class="mx-nav"><div class="mx-logo">MAX<span>ESS</span></div><div class="mx-nav-note">Personal intelligence · Assessment complete</div></nav>
<div id="mxMount"></div>
</div>
</section>
<script>
(function(){
'use strict';
const mount=document.getElementById('mxMount');
const clamp=(n,min=0,max=100)=>Math.min(max,Math.max(min,Number.isFinite(Number(n))?Number(n):0));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const dimMeta={direction:{name:'Direction',color:'#ffd45a',role:'Director',opp:'Clarify the destination before you begin.'},communication:{name:'Communication',color:'#35e39b',role:'Communicator',opp:'Give AI richer context, audience, constraints, and outcome.'},evaluation:{name:'Evaluation',color:'#3ca8ff',role:'Evaluator',opp:'Make “Why is this not a 10?” part of important work.'},iteration:{name:'Iteration',color:'#765cff',role:'Improver',opp:'Diagnose the weakness, preserve what works, improve what does not, and repeat.'},systems:{name:'Systems Thinking',color:'#ed42c4',role:'Systems Builder',opp:'Capture what works so successful workflows become reusable assets.'}};
const strengthText={direction:'You are good at giving AI a destination. That gives your conversations a clear direction instead of leaving the system to guess.',communication:'You are good at translating intent into language AI can use. That makes you a stronger director of the work.',evaluation:'You have a strong quality-control instinct. You are more likely to question an answer instead of accepting it because it sounds convincing.',iteration:'You understand that useful work gets better through deliberate refinement. That turns AI from a one-shot tool into a collaborator.',systems:'You are thinking beyond individual outputs and toward reusable capability. That is where AI starts becoming an asset instead of a collection of tricks.'};
function getResult(){
 const r=window.MAXESS_RESULT||window.maxessResult||(window.state&&window.state.results)||null;
 if(!r)return null;
 const dimensions=(r.dimensions||[]).map(d=>({id:d.id,name:d.name||dimMeta[d.id]?.name||d.id,color:d.color||dimMeta[d.id]?.color||'#b895ff',score:clamp(d.score)}));
 if(!dimensions.length||!Number.isFinite(Number(r.overall)))return null;
 return {...r,overall:clamp(r.overall),dimensions};
}
function band(score,r){return r.band||({label:score>=90?'Master':score>=75?'Advancing':score>=60?'Developing':'Foundation',color:score>=90?'#ffd45a':score>=75?'#35e39b':score>=60?'#3ca8ff':'#765cff',description:'Your result is a map of your current AI capability.'})}
function point(i,score,cx,cy,rad){const a=-Math.PI/2+i*2*Math.PI/5;const rr=rad*clamp(score)/100;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]}
function fingerprint(ds){const cx=350,cy=280,rad=185;let s='';for(const f of [.25,.5,.75,1])s+=`<polygon class="grid" points="${ds.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return `${cx+Math.cos(a)*rad*f},${cy+Math.sin(a)*rad*f}`}).join(' ')}"/>`;ds.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;s+=`<line class="axis" x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*rad}" y2="${cy+Math.sin(a)*rad}"/>`});const pts=ds.map((d,i)=>point(i,d.score,cx,cy,rad));s+=`<polygon class="shape" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;pts.forEach((p,i)=>s+=`<circle class="node" cx="${p[0]}" cy="${p[1]}" r="7"/>`);ds.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;const x=cx+Math.cos(a)*(rad+43),y=cy+Math.sin(a)*(rad+43);s+=`<text x="${x}" y="${y}" text-anchor="middle">${esc(d.name)}</text>`});return s}
function insight(strong,opp,score){const gap=Math.round(strong.score-opp.score);if(strong.id===opp.id)return `Your ${esc(strong.name)} is both your strongest and your clearest opportunity. That usually means you have an established instinct here, but there is still meaningful room to turn it into a repeatable strength. The next move is depth, not reinvention.`;return `Your pattern is telling us something useful: ${esc(strong.name)} is currently carrying more of your AI capability than ${esc(opp.name)}. You already have something to build from. Strengthening ${esc(opp.name)} by even a modest amount could make the rest of your capability more consistent. The gap between them is about ${gap} points.`}
function render(r){
 const b=band(r.overall,r),ds=r.dimensions.slice(0,5),strong=[...ds].sort((a,c)=>c.score-a.score)[0],opp=[...ds].sort((a,c)=>a.score-c.score)[0];
 const ringColor=b.color||'#b895ff';
 const circumference=2*Math.PI*178; const offset=circumference*(1-r.overall/100);
 const masters=[...ds].sort((a,c)=>a.score-c.score).slice(0,3);
 mount.innerHTML=`
 <header class="mx-hero">
  <div class="mx-hero-copy"><div class="mx-kicker">YOUR MAXESS RESULT</div><h1>Your AI capability, revealed.</h1><p>${esc(b.description)}</p><div class="mx-band" style="--ring:${ringColor}"><span class="mx-band-dot"></span>${esc(b.label)} · ${Math.round(r.overall)}/100</div></div>
  <div class="mx-ring" style="--ring:${ringColor}" aria-label="MAXESS Score ${Math.round(r.overall)} out of 100"><svg class="mx-ring-svg" viewBox="0 0 380 380" aria-hidden="true"><circle class="mx-ring-track" cx="190" cy="190" r="178"/><circle class="mx-ring-progress" cx="190" cy="190" r="178" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"/></svg><div class="mx-ring-core"><div><div class="mx-score">${Math.round(r.overall)}</div><div class="mx-score-label">MAXESS SCORE</div></div></div></div>
 </header>
 <section class="mx-section"><div class="mx-section-head"><div class="mx-kicker">01 · YOUR PROFILE</div><h2>What your result actually says about you.</h2></div><div class="mx-profile"><div class="mx-profile-visual"><div class="mx-orbit a"></div><div class="mx-orbit b"></div><div class="mx-orbit c"></div><div class="mx-profile-core">AI<small>CAPABILITY</small></div></div><div class="mx-profile-copy"><p>Your current MAXESS Score is <strong>${Math.round(r.overall)}/100</strong>. It reflects how you currently direct, communicate with, evaluate, improve, and systematize AI.</p><p>Your strongest capability is <strong>${esc(strong.name)}</strong> at <strong>${Math.round(strong.score)}</strong>. ${esc(strengthText[strong.id]||'This is an established part of your current capability.')}</p><p>This is not a judgment of your intelligence or potential. It is a snapshot of how you currently work with AI — and a map of where to go next.</p></div></div></section>
 <section class="mx-section"><div class="mx-section-head center"><div class="mx-kicker">02 · YOUR AI FINGERPRINT</div><h2>Your five dimensions create your pattern.</h2><p>Every point comes directly from your assessment. Higher scores extend farther. Lower scores pull inward. Change the data and the shape changes.</p></div><div class="mx-fingerprint-wrap"><svg class="mx-fingerprint" viewBox="0 0 700 560" role="img" aria-label="Five-dimension AI capability fingerprint">${fingerprint(ds)}</svg></div><div class="mx-dimension-line">${ds.map(d=>`<div><strong>${esc(d.name)}</strong><span>${Math.round(d.score)}</span></div>`).join('')}</div></section>
 <section class="mx-section"><div class="mx-section-head"><div class="mx-kicker">03 · YOUR LEVERAGE</div><h2>Use what is strong. Strengthen what creates lift.</h2></div><div class="mx-leverage"><article style="--accent:${esc(strong.color)}"><small>YOUR ADVANTAGE</small><h3>${esc(strong.name)}</h3><b>${Math.round(strong.score)}</b><p>${esc(strengthText[strong.id]||'You already have a useful capability here. Build from it.')}</p></article><article style="--accent:${esc(opp.color)}"><small>YOUR OPPORTUNITY</small><h3>${esc(opp.name)}</h3><b>${Math.round(opp.score)}</b><p>${esc(dimMeta[opp.id]?.opp||'Deliberate improvement here can create useful lift.')}</p></article></div></section>
 <section class="mx-section"><div class="mx-insight"><div class="mx-kicker">04 · THE “OH, THAT’S WHY” MOMENT</div><h2>Your pattern explains more than your score.</h2><p>${insight(strong,opp,r.overall)}</p><span class="source">Derived from the five dimension scores across the 15-question MAXESS assessment.</span></div></section>
 <section class="mx-section"><div class="mx-section-head center"><div class="mx-kicker">05 · YOUR NEXT MOVE</div><h2>Turn capability into a repeatable advantage.</h2></div><div class="mx-flow">KNOW → TELL → ASK → LOOK → SCORE → IMPROVE → REPEAT</div></section>
 <section class="mx-section"><div class="mx-naya"><div class="mx-naya-orb">N</div><div><div class="mx-kicker">06 · NAYA</div><h2>Now that you know your pattern, Naya can help you build from here.</h2><p>Your strongest capability is <strong>${esc(strong.name)}</strong>. Your greatest leverage opportunity is <strong>${esc(opp.name)}</strong>. That gives Naya a meaningful starting point instead of a generic conversation.</p></div></div></section>
 <section class="mx-section"><div class="mx-section-head center"><div class="mx-kicker">07 · YOUR NAYA MASTERS</div><h2>The three areas most worth developing next.</h2></div><div class="mx-masters">${masters.map((d,i)=>`<article class="mx-master"><small>MASTER ${String(i+1).padStart(2,'0')}</small><h3>Naya Master · ${esc(dimMeta[d.id]?.role||d.name)}</h3><div class="score">${Math.round(d.score)}</div><p>${esc(dimMeta[d.id]?.opp||'Build this capability deliberately and turn the improvement into a reusable workflow.')}</p></article>`).join('')}</div></section>
 <section class="mx-section"><div class="mx-keys"><div class="mx-key"><div class="mx-kicker">08 · THE THREE KEYS</div><h3>Three moves. No overwhelm.</h3><p>Take the result you just discovered and turn it into behavior.</p></div><div class="mx-key"><b>01</b><h3>Strengthen the weak link</h3><p>${esc(dimMeta[opp.id]?.opp||'Choose the dimension with the most useful room to grow.')}</p></div><div class="mx-key"><b>02</b><h3>Use the 10-point test</h3><p>Ask what works, what is missing, what is unclear, and what would make the result a 10.</p></div><div class="mx-key"><b>03</b><h3>Build the system</h3><p>When something works, save the method. Your future self should start from the win.</p></div></div></section>
