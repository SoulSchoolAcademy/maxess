name: MAXESS Results — Apply Naya Experience

on:
  push:
    branches:
      - naya-results-master-instruction-set
    paths:
      - '.naya/MAXESS-RESULTS-NAYA-EXPERIENCE-FRAGMENT.html'
      - '.naya/MAXESS-RESULTS-NAYA-EXPERIENCE-FIX-V2.html'
      - '.naya/apply_maxess_results_experience.py'
      - '.naya/MAXESS-RESULTS-MASTER-INSTRUCTION-SET.md'
      - '.naya/NAYA-GOVERNANCE.md'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-results-experience:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'naya-results-master-instruction-set'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: naya-results-master-instruction-set

      - name: Apply deterministic Results experience patch
        run: python3 .naya/apply_maxess_results_experience.py

      - name: Structural safety checks
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('MAXESS-RESULTS-10-GROOVE.html')
          s = p.read_text(encoding='utf-8')
          checks = {
              'MAXESS_RESULT data boundary': 'window.MAXESS_RESULT' in s,
              'Results contract': 'MAXESS-RESULTS-CONTRACT-1' in s,
              'Complete video system': 'ny-youtube-player' in s,
              'Original CTA': 'Start Your Free Trial' in s,
              'New hero': 'YOUR AI SCORE' in s,
              'Naya presence': 'naya-presence' in s,
              'Five dimensions': 'your-dimensions' in s,
              'Biggest lever': 'biggest-lever' in s,
              '18 Naya Masters': 'naya-masters' in s,
              'Human + AI bridge': 'naya-human-bridge' in s,
              'Final solution relocation': 'naya-final-solution' in s,
              'V2 asset fix': 'naya-results-experience-v1-fix' in s,
              'Supplied Naya dark asset': 'grok-image-f75a6f12-4e3a-4c99-a334-5684ba0f7401.jpg' in s,
              'Supplied Naya light asset': 'grok-image-c6a924fd-1f75-4ac8-840d-35b224fb3e52.jpg' in s,
              'Supplied brand asset': 'ICON-LOGO.png' in s,
          }
          failed = [k for k, v in checks.items() if not v]
          for k, v in checks.items(): print(('PASS' if v else 'FAIL') + ' — ' + k)
          if failed: raise SystemExit('BLOCKED — structural checks failed: ' + ', '.join(failed))
          if p.stat().st_size < 100000: raise SystemExit('BLOCKED — authoritative Results artifact unexpectedly small')
          PY2

      - name: Diff and whitespace check
        run: |
          git diff --check
          git diff --stat

      - name: Commit applied Results artifact
        run: |
          if git diff --quiet -- MAXESS-RESULTS-10-GROOVE.html; then
            echo 'No Results artifact diff; nothing to commit.'
            exit 0
          fi
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add -- MAXESS-RESULTS-10-GROOVE.html
          git commit -m 'Apply MAXESS Results Naya experience fix V2 [skip ci]'
          git push origin HEAD:naya-results-master-instruction-set
