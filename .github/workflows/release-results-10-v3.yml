name: Release MAXESS Results 10 v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final self-contained source and scorecard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          base=Path('MAXESS-RESULTS-AAA-FULL.html').read_text(encoding='utf-8')
          wf=Path('.github/workflows/build-maxess-results.yml').read_text(encoding='utf-8')
          m=re.search(r"polish = r'''(.*?)'''",wf,re.S)
          if not m: raise SystemExit('POLISH_LAYER_MISSING')
          final=base.replace('</body>',m.group(1)+'\n</body>',1).replace('\r\n','\n')
          def pretty_style(m):
              s=m.group(0)
              s=re.sub(r'\s*;\s*', ';\n', s)
              s=re.sub(r'\}\s*', '}\n', s)
              s=re.sub(r'\n{3,}','\n\n',s)
              return s
          def pretty_script(m):
              s=m.group(0)
              s=re.sub(r';(?=\s*[^<])',';\n',s)
              s=re.sub(r'\n{3,}','\n\n',s)
              return s
          final=re.sub(r'<style[^>]*>.*?</style>',pretty_style,final,flags=re.S|re.I)
          final=re.sub(r'<script[^>]*>.*?</script>',pretty_script,final,flags=re.S|re.I)
          final=re.sub(r'>\s*<','>\n<',final)
          final=re.sub(r'\n{3,}','\n\n',final)
          Path('MAXESS-RESULTS-10-GROOVE.html').write_text(final,encoding='utf-8')
          lines=final.count('\n')+1; size=len(final.encode())
          required=['MAXESS — Your AI Mastery Results','m10-hero','m10-fingerprint','m10-radar-card','m10-gauge-card','m10-insight','m10-path','m10-method','m10-naya','m10Progress','Direction','Communication','Evaluation','Iteration','Systems','KNOW','TELL','ASK','CREATE','SCORE','IMPROVE','REPEAT','nayanet.xyz','prefers-reduced-motion']
          missing=[x for x in required if x not in final]
          checks={
            'single_document': final.lower().count('<html')==1 and final.lower().count('</html>')==1 and final.lower().count('<body')==1 and final.lower().count('</body>')==1,
            'thousands_scale': lines>=2000,
            'complete_inventory': not missing,
            'responsive': '@media' in final,
            'keyboard_accessible': 'focus-visible' in final,
            'reduced_motion': 'prefers-reduced-motion' in final,
            'data_handoff': 'MAXESS_RESULT' in final or 'MAXESS_RESULTS' in final,
            'naya_audio_surface': 'm10-naya' in final and 'm10-play' in final,
            'nayanet_continuation': 'nayanet.xyz' in final,
            'no_questionnaire_ui': not re.search(r'Question\\s+1|question-1|answer-1',final,re.I),
            'no_external_ui_dependency': 'cdn.' not in final and 'unpkg.' not in final and 'jsdelivr.' not in final,
          }
          print('MAXESS RESULTS 10 RELEASE SCORECARD')
          print('SOURCE_LINES',lines,'SOURCE_BYTES',size)
          for k,v in checks.items(): print(f'{k}:', 'PASS' if v else 'FAIL')
          if missing: print('MISSING:',missing)
          if not all(checks.values()): raise SystemExit('RELEASE_GATE_FAILED')
          print('ALL RELEASE GATES PASS')
          PY
          git config user.name 'MAXESS Release System'
          git config user.email 'actions@github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          git diff --cached --quiet || git commit -m 'Release final MAXESS Results 10 Groove source'
          git push
