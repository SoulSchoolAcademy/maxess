name: Build MAXESS Results Groove

on:
  push:
    branches: [main]
    paths:
      - 'MAXESS-RESULTS-9-5-GROOVE.html'
      - '.github/workflows/build-maxess-results.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build polished standalone Results artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          src = Path('MAXESS-RESULTS-9-5-GROOVE.html').read_text(encoding='utf-8')
          polish = r'''
<style id="maxess-10-polish">
