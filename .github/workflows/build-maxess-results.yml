</style>
<div class="maxess-10-layer" id="maxess10">
<section class="m10-hero">
<div class="m10-eyebrow">MAXESS · YOUR RESULTS</div>
<h1 class="m10-title">Your AI capability, made visible.</h1>
<p class="m10-subtitle">A useful result should do more than tell you a number. It should help you understand yourself, see the pattern, and know what to do next.</p>
<div class="m10-score-wrap">
<svg viewBox="0 0 290 290" aria-hidden="true"><defs><linearGradient id="m10g"><stop offset="0%" stop-color="#6b3ad4"/><stop offset="55%" stop-color="#9a68ff"/><stop offset="100%" stop-color="#d0b8ff"/></linearGradient></defs><circle class="m10-track" cx="145" cy="145" r="120"/><circle id="m10Progress" class="m10-progress" cx="145" cy="145" r="120"/></svg>
<div><div class="m10-score" id="m10Score">84</div><div class="m10-denom">MAXESS SCORE / 100</div></div>
</div>
<div class="m10-level" id="m10Level">ADVANCING</div>
</section>
<section class="m10-section">
<div class="m10-section-head"><div class="m10-eyebrow">THE FINGERPRINT</div><h2>Five dimensions. One personal pattern.</h2><p>See the shape of your AI capability instead of reading a list of scores. Select a dimension to understand what it means and where it can take you.</p></div>
<div class="m10-fingerprint">
<div class="m10-radar-card"><div class="m10-radar"><svg viewBox="0 0 440 440"><polygon class="m10-grid" points="220,44 387,165 323,362 117,362 53,165"/><polygon class="m10-grid" points="220,84 348,177 299,326 141,326 92,177"/><polygon class="m10-grid" points="220,124 309,188 276,290 164,290 131,188"/><line class="m10-axis" x1="220" y1="220" x2="220" y2="44"/><line class="m10-axis" x1="220" y1="220" x2="387" y2="165"/><line class="m10-axis" x1="220" y1="220" x2="323" y2="362"/><line class="m10-axis" x1="220" y1="220" x2="117" y2="362"/><line class="m10-axis" x1="220" y1="220" x2="53" y2="165"/><polygon id="m10Area" class="m10-area" points="220,60 360,174 305,338 125,338 90,175"/><g id="m10Dots"></g><text class="m10-label" x="220" y="25">DIRECTION</text><text class="m10-label" x="410" y="160">COMMUNICATION</text><text class="m10-label" x="345" y="400">EVALUATION</text><text class="m10-label" x="95" y="400">ITERATION</text><text class="m10-label" x="30" y="160">SYSTEMS</text></svg></div></div>
<div><div class="m10-gauges" id="m10Gauges"></div><div class="m10-detail" id="m10Detail">Choose a dimension.</div></div>
</div>
</section>
<section class="m10-section"><div class="m10-insight"><div class="m10-eyebrow">THE MOMENT THAT MATTERS</div><h2>Oh… that's why.</h2><p class="m10-insight-lead" id="m10Insight">Your strongest ability and your highest-leverage opportunity are not the same thing. That difference is where growth becomes practical.</p><div class="m10-insight-grid"><div class="m10-insight-item"><strong>YOUR ADVANTAGE</strong><p id="m10Advantage"></p></div><div class="m10-insight-item"><strong>YOUR LEVERAGE POINT</strong><p id="m10Opportunity"></p></div><div class="m10-insight-item"><strong>YOUR NEXT LEVEL</strong><p id="m10Next"></p></div></div></div></section>
<section class="m10-section"><div class="m10-section-head"><div class="m10-eyebrow">YOUR PATH FORWARD</div><h2>Three moves. No guesswork.</h2><p>Use the result as a starting point. Focus your energy where it can create the biggest improvement instead of trying to fix everything at once.</p></div><div class="m10-path"><div class="m10-path-grid"><article class="m10-step"><div class="m10-step-no">01</div><h3>See the pattern</h3><p>Understand what your scores are actually telling you and recognize the behavior behind the number.</p></article><article class="m10-step"><div class="m10-step-no">02</div><h3>Practice the leverage</h3><p>Turn the opportunity into one deliberate habit that you can use in real AI work immediately.</p></article><article class="m10-step"><div class="m10-step-no">03</div><h3>Compound the gain</h3><p>Create, score, improve, and repeat until the new behavior becomes part of how you naturally work.</p></article></div></div></section>
<section class="m10-section"><div class="m10-method"><div class="m10-section-head"><div class="m10-eyebrow">THE MAXESS OPERATING SYSTEM</div><h2>KNOW → TELL → ASK → CREATE → SCORE → IMPROVE → REPEAT</h2><p>Better AI results come from better human direction and better judgment. MAXESS turns that into a repeatable loop.</p></div><div class="m10-loop"><span class="m10-node">KNOW</span><span class="m10-arrow">→</span><span class="m10-node">TELL</span><span class="m10-arrow">→</span><span class="m10-node">ASK</span><span class="m10-arrow">→</span><span class="m10-node">CREATE</span><span class="m10-arrow">→</span><span class="m10-node">SCORE</span><span class="m10-arrow">→</span><span class="m10-node">IMPROVE</span><span class="m10-arrow">→</span><span class="m10-node">REPEAT</span><span class="m10-arrow">↺</span></div><p class="m10-method-note">The first answer is material. Your job is to direct it, judge it, improve it, and keep going until the result deserves to ship.</p></div></section>
<section class="m10-section"><div class="m10-naya"><div><div class="m10-eyebrow">NAYA · YOUR PERSONAL REPORT</div><h2>Hear what Naya sees.</h2><p>The written result gives you the map. Naya gives it a voice. The player is deliberately compact so it supports the Results experience instead of competing with it.</p></div><div class="m10-player"><div class="m10-player-row"><button class="m10-play" id="m10Play" type="button" aria-label="Play Naya report"></button><div><strong>Listen to your report</strong><div id="m10Tier" style="margin-top:5px;color:#c4a5ff;font-size:11px">Advancing · personalized report</div></div></div><div class="m10-wave" id="m10Wave"></div></div></div></section>
<section class="m10-next"><div class="m10-eyebrow">THE NEXT CHAPTER</div><h2>You know where you are.<br>Now see what's possible.</h2><p>MAXESS gives you the insight. NayaNET is where that insight can turn into learning, tools, experiences, and action.</p><a class="m10-cta" href="https://nayanet.xyz/" target="_blank" rel="noopener">Continue into NayaNET&nbsp; →</a></section>
</div>
<script id="maxess-10-script">
(()=>{
const fallback={score:84,level:'ADVANCING',dimensions:{Direction:91,Communication:84,Evaluation:78,Iteration:72,'Systems Thinking':88}};
const descriptions={Direction:'You naturally establish a destination before asking AI to move. That gives your work clarity and reduces wasted effort.',Communication:'You can translate intent into language AI can work with. Your next gain comes from making constraints and desired outcomes even more explicit.',Evaluation:'You can recognize quality, but your score suggests the judging step can become more deliberate and repeatable.',Iteration:'This is a high-leverage skill because every strong first answer can become better through deliberate revision.', 'Systems Thinking':'You see connections between tasks and ideas, which gives you an advantage when building repeatable AI workflows.'};
function read(){for(const store of [localStorage,sessionStorage]){try{const r=JSON.parse(store.getItem('MAXESS_RESULT')||'null');if(r)return {...fallback,...r,dimensions:{...fallback.dimensions,...(r.dimensions||{})}}}catch(e){}}return fallback}
const r=read();
const score=Math.max(0,Math.min(100,Number(r.score)||84));
document.getElementById('m10Score').textContent=Math.round(score);
document.getElementById('m10Level').textContent=r.level||fallback.level;
document.getElementById('m10Progress').style.strokeDashoffset=753-(753*score/100);
const names=['Direction','Communication','Evaluation','Iteration','Systems Thinking'];
const d=r.dimensions||fallback.dimensions;
const gauges=document.getElementById('m10Gauges');
const angles=[-Math.PI/2,-Math.PI/2+Math.PI*2/5,-Math.PI/2+Math.PI*4/5,-Math.PI/2+Math.PI*6/5,-Math.PI/2+Math.PI*8/5];
const pts=names.map((n,i)=>{const v=Math.max(0,Math.min(100,Number(d[n])||fallback.dimensions[n]));const rad=176*v/100;return [220+Math.cos(angles[i])*rad,220+Math.sin(angles[i])*rad]});
document.getElementById('m10Area').setAttribute('points',pts.map(p=>p.join(',')).join(' '));
pts.forEach(p=>{const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('class','m10-dot');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r','5');document.getElementById('m10Dots').appendChild(c)});
names.forEach((n,i)=>{const v=Math.max(0,Math.min(100,Number(d[n])||fallback.dimensions[n]));const b=document.createElement('button');b.type='button';b.className='m10-gauge-card'+(i===0?' active':'');b.innerHTML='<div class="m10-gauge-top"><span class="m10-gauge-name">'+n+'</span><strong class="m10-gauge-score">'+v+'</strong></div><div class="m10-trackbar"><div class="m10-fill" style="width:'+v+'%"></div></div><div class="m10-meta"><span>FOUNDATION</span><span>MASTERING</span></div>';b.onclick=()=>{document.querySelectorAll('.m10-gauge-card').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('m10Detail').textContent=descriptions[n]};gauges.appendChild(b)});
document.getElementById('m10Detail').textContent=descriptions[names[0]];
const strongest=names.reduce((a,b)=>Number(d[a])>=Number(d[b])?a:b);const weakest=names.reduce((a,b)=>Number(d[a])<=Number(d[b])?a:b);
document.getElementById('m10Advantage').textContent=strongest+' is your strongest dimension at '+d[strongest]+'.';
document.getElementById('m10Opportunity').textContent=weakest+' is your clearest leverage point at '+d[weakest]+'.';
document.getElementById('m10Next').textContent='Focus on '+weakest+', then score the improvement and repeat.';
document.getElementById('m10Insight').textContent='Your profile is strongest in '+strongest+' while '+weakest+' has the most room to create leverage. That gap is not a flaw. It is a map.';
const wave=document.getElementById('m10Wave');for(let i=0;i<46;i++){const x=document.createElement('i');x.style.height=(12+Math.abs(Math.sin(i*1.41))*76)+'%';wave.appendChild(x)}
let playing=false;const toggle=()=>{playing=!playing;document.getElementById('m10Play').classList.toggle('playing',playing);window.dispatchEvent(new CustomEvent('maxess:naya-play',{detail:{result:r}}))};document.getElementById('m10Play').onclick=toggle;
document.getElementById('m10Tier').textContent=(r.level||'Advancing')+' · personalized report';
window.MAXESS_RESULTS={version:'10.0',getResult:()=>r,setResult:(next)=>{localStorage.setItem('MAXESS_RESULT',JSON.stringify(next));location.reload()},playNaya:toggle};
window.addEventListener('message',e=>{if(e.data?.type==='MAXESS_ASSESSMENT_COMPLETE'){localStorage.setItem('MAXESS_RESULT',JSON.stringify(e.data.result));location.reload()}});
})();
</script>
'''
          # Keep the existing mature artifact as the source of truth, then place the new Results experience before it.
          # The existing NayaNET experience remains untouched and continues to be the final destination layer.
          marker='</body>'
          if marker not in src:
              raise SystemExit('Source artifact has no closing body tag')
          final=src.replace(marker, polish+'\n'+marker, 1)
          Path('MAXESS-RESULTS-10-GROOVE.html').write_text(final,encoding='utf-8')
          lines=final.count('\n')+1
          bytes_=len(final.encode('utf-8'))
          print(f'MAXESS FINAL: {lines} lines / {bytes_} bytes')
          if lines < 5000:
              raise SystemExit(f'RELEASE BLOCKED: only {lines} lines')
          for required in ['m10-hero','m10-fingerprint','m10-insight','m10-path','m10-method','m10-naya','nayanet.xyz']:
              if required not in final:
                  raise SystemExit('RELEASE BLOCKED: missing '+required)
          PY
      - name: Commit final artifact
        run: |
          git config user.name 'MAXESS Build System'
          git config user.email 'actions@github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          git diff --cached --quiet && exit 0
          git commit -m 'Build complete MAXESS Results 10 Groove artifact'
          git push
