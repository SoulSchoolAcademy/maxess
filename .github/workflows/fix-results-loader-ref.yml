name: MAXESS Results — Normalize Presentation Loader Ref

on:
  push:
    branches: [maxess-results-rebuild-10-10]
    paths:
      - 'release-results-loader-ref.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point Results presentation layer at canonical main source
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's#maxess-results-rebuild-10-10/MAXESS-RESULTS-EXPERIENCE.js#main/MAXESS-RESULTS-EXPERIENCE.js#g' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'raw.githubusercontent.com/SoulSchoolAcademy/maxess/main/MAXESS-RESULTS-EXPERIENCE.js' MAXESS-RESULTS-10-GROOVE.html
      - name: Commit and remove temporary release fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya'
          git config user.email 'naya@users.noreply.github.com'
          rm -f .github/workflows/fix-results-loader-ref.yml release-results-loader-ref.trigger
          git add -- MAXESS-RESULTS-10-GROOVE.html .github/workflows/fix-results-loader-ref.yml release-results-loader-ref.trigger
          git commit -m 'Use canonical main Results presentation layer reference'
          git push origin HEAD:maxess-results-rebuild-10-10
