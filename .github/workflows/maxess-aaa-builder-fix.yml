name: MAXESS AAA Builder Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('.github/workflows/maxess-aaa-results.yml')
          s=p.read_text()
          old="              'no_external_results_renderer': 'MAXESS-RESULTS-EXPERIENCE.js' not in built,\n"
          if old not in s:
              print('No obsolete gate present; nothing to change.')
          else:
              p.write_text(s.replace(old,''))
              subprocess.run(['git','config','user.name','MAXESS Naya Builder'],check=True)
              subprocess.run(['git','config','user.email','noreply@maxess.local'],check=True)
              subprocess.run(['git','add',str(p)],check=True)
              subprocess.run(['git','commit','-m','MAXESS AAA: remove obsolete renderer-string gate'],check=True)
              subprocess.run(['git','push'],check=True)
