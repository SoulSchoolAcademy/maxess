name: MAXESS AAA v2

on:
  push:
    branches: [main]
    paths:
      - 'code'
      - 'tools/aaa_patch.py'
      - '.github/workflows/maxess-aaa-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply idempotent AAA v2 patch
        run: python3 tools/aaa_patch.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- code; then
            echo 'No code changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add code
          git commit -m 'feat(maxess): deliver visible AAA v2 UX pass'
          git push

      - name: Verify source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('code').read_text(encoding='utf-8')
          assert s.count('maxess-aaa-pass') == 1
          assert s.count('aaa-status-rail') >= 2
          assert 'STEP 16 · COMPLETE' in s
          assert s.count('@media(max-height:820px) and (min-width:761px)') == 1
          assert s.count('id="questionCountChip"') == 1
          assert s.count('id="aaaStepLabel"') == 1
          assert s.count('AI_AREAS = [') == 1
          assert s.count('id:"') >= 15
          print('MAXESS AAA v2 invariants passed')
          PY
