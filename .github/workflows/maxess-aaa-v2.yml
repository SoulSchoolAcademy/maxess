name: MAXESS AAA v4 Results

on:
  push:
    branches: [main]
    paths:
      - 'code'
      - 'tools/aaa_patch.py'
      - 'tools/results_experience_v4.py'
      - 'tools/fix_results_v4_anchor.py'
      - '.github/workflows/maxess-aaa-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply idempotent assessment craft patch
        run: python3 tools/aaa_patch.py

      - name: Repair V4 patch anchor if needed
        run: python3 tools/fix_results_v4_anchor.py

      - name: Apply idempotent results experience V4 patch
        run: python3 tools/results_experience_v4.py

      - name: Commit and push generated code if changed
        run: |
          if git diff --quiet -- code; then
            echo 'No generated code changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add code
            git commit -m 'feat(maxess): deliver results experience v4'
            git push
          fi

      - name: Verify MAXESS source invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('code').read_text(encoding='utf-8')
          assert s.count('maxess-aaa-pass') == 1
          assert s.count('aaa-status-rail') >= 2
          assert 'STEP 16 · COMPLETE' in s
          assert s.count('@media(max-height:820px) and (min-width:761px)') == 1
          assert s.count('id="questionCountChip"') == 1
          assert s.count('id="aaaStepLabel"') == 1
          assert s.count('AI_AREAS = [') == 1
          assert s.count('id:"') >= 15
          assert 'MAXESS RESULTS EXPERIENCE V4' in s
          assert 'resultsV4Opening' in s
          assert 'resultsV4MasterKeyTitle' in s
          assert 'resultsV4MethodDetail' in s
          print('MAXESS AAA v4 source invariants passed')
          PY
