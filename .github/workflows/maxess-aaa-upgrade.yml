name: MAXESS Safe Results Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "code"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild, normalize, and validate only the Results presentation
        run: python3 tools/rebuild_results_v5.py
      - name: Validate protected assessment structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('code').read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert 'MAXESS RESULTS — FRESH FLAGSHIP 2026-08-15' in s
          assert s.count('id="resultsView"')==1
          assert s.count('questions:[')==1
          assert 'questionId' in s
          print('PROTECTED ASSESSMENT + FRESH RESULTS STRUCTURE VERIFIED')
          print('LINES',len(s.splitlines()),'BYTES',len(s))
          PY
      - name: Commit generated code
        run: |
          if git diff --quiet -- code; then echo "No Results changes required"; exit 0; fi
          git config user.name "MAXESS Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code
          git commit -m "feat(maxess): rebuild Results presentation from stable assessment"
          git push
