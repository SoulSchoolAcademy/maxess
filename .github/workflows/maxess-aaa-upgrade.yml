name: MAXESS Safe Results Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "code"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild only the Results presentation
        run: python3 tools/rebuild_results_v2.py
      - name: Validate source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert 'MAXESS RESULTS — FRESH FLAGSHIP 2026-08-15' in s
          assert s.count('id="resultsView"')==1
          assert s.count('MAXESS_ASSESSMENT')==1
          assert s.count('questions:[')==1
          assert s.count('questionId')>=1
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          for i,x in enumerate(scripts,1): Path(f'/tmp/maxess-{i}.js').write_text(x,encoding='utf-8')
          print('LINES',len(s.splitlines()),'BYTES',len(s),'SCRIPTS',len(scripts))
          PY
          for f in /tmp/maxess-*.js; do node --check "$f"; done
      - name: Commit generated code
        run: |
          if git diff --quiet -- code; then echo "No Results changes required"; exit 0; fi
          git config user.name "MAXESS Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code
          git commit -m "feat(maxess): rebuild Results presentation from stable assessment"
          git push
