name: MAXESS Safe Results Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "code"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the complete Results + NayaNET experience
        run: python3 tools/merge_maxess_nayanet.py
      - name: Repair and validate the Results integration
        run: python3 tools/repair_results_v6.py
      - name: Validate protected assessment structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('code').read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert s.count('<html')==1 and s.count('</html>')==1
          assert 'MAXESS RESULTS — FRESH FLAGSHIP 2026-08-15' in s
          assert s.count('id="resultsView"')==1
          assert s.count('questions:[')==1
          assert 'questionId' in s
          assert 'class="fresh-compat"' in s
          r=Path('MAXESS-RESULTS-9-5-GROOVE.html').read_text(encoding='utf-8')
          assert 'MAXESS NAYANET MERGED EXPERIENCE v10' in r
          assert len(r.splitlines()) >= 5000
          print('PROTECTED ASSESSMENT + COMPLETE RESULTS/NAYANET BUILD VERIFIED')
          print('ASSESSMENT LINES',len(s.splitlines()),'BYTES',len(s))
          print('RESULTS LINES',len(r.splitlines()),'BYTES',len(r))
          PY
      - name: Commit repaired and merged build
        run: |
          if git diff --quiet -- code MAXESS-RESULTS-9-5-GROOVE.html; then echo "No Results build changes required"; exit 0; fi
          git config user.name "MAXESS Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code MAXESS-RESULTS-9-5-GROOVE.html
          git commit -m "feat(maxess): merge complete Results experience with NayaNET"
          git push
