name: MAXESS AAA Release Pipeline

on:
  push:
    branches: [main, feat/results-logic-10star]
    paths-ignore:
      - "code"
      - "QA_NODE_ERROR.txt"
      - "QA_TRIGGER.txt"

permissions:
  contents: write

concurrency:
  group: maxess-aaa-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply core AAA UX and resilience patch
        run: python3 tools/maxess_aaa_upgrade.py

      - name: Apply idempotent visible assessment craft pass
        run: python3 tools/aaa_patch.py

      - name: Build fresh MAXESS Results experience
        run: python3 tools/results_final_authority.py

      - name: Verify generated MAXESS source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('code').read_text(encoding='utf-8')
          checks = {
            'maxess-aaa-pass': s.count('maxess-aaa-pass') == 1,
            'questionCountChip': s.count('id="questionCountChip"') == 1,
            'aaaStepLabel': s.count('id="aaaStepLabel"') == 1,
            'AI_AREAS': s.count('AI_AREAS = [') == 1,
            'area ids': s.count('id:"') >= 15,
            'area colors': s.count('color:"') >= 18,
            'fresh Results authority': 'MAXESS RESULTS FRESH AUTHORITY V3' in s,
            'your MAXESS result': 'Your MAXESS Result' in s,
            'personalized analysis': 'Your Personalized Analysis' in s,
            'score meaning': 'What Your Score Tells You' in s,
            'capability signature': 'AI Capability Signature' in s,
            'natural advantage': 'Your Natural Advantage' in s,
            'highest leverage': 'Your Highest-Leverage Opportunity' in s,
            'oh why': 'The “OH… THAT’S WHY” Discovery' in s,
            'report': 'Your MAXESS Report' in s,
            'naya': 'I GOT YOU.' in s,
            'masters': 'Naya Master Intelligence' in s,
            'three keys': 'The Three-Key System' in s,
            'master ai': 'MASTER AI →' in s,
            'naya image': 'Naya-and-shawn-ok-0.png' in s,
            'gauge': 'mxr-gauge' in s,
            'fingerprint': 'mxr-constellation' in s,
            'portal language': 'Highest-Leverage Opportunity' in s,
            'fresh authority only': s.count('<!-- MAXESS RESULTS FRESH AUTHORITY V3 -->') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
            print('FAILED SOURCE INVARIANTS:', ', '.join(failed))
            raise SystemExit(1)
          if s.count('<script>') != 2:
            print('FAILED SOURCE INVARIANT: expected exactly two script blocks, found', s.count('<script>'))
            raise SystemExit(1)
          if re.search(r'</style>\s*\(function\s*\(', s):
            print('FAILED SOURCE INVARIANT: raw JavaScript text leak detected')
            raise SystemExit(1)
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', s, flags=re.I)
          if not scripts:
            print('FAILED SOURCE INVARIANT: application scripts missing')
            raise SystemExit(1)
          Path('/tmp/maxess-scripts').mkdir(exist_ok=True)
          for i,script in enumerate(scripts,1):
              Path(f'/tmp/maxess-scripts/script-{i}.js').write_text(script,encoding='utf-8')
          print(f'MAXESS Results fresh-source invariants passed; found {len(scripts)} script blocks')
          PY

      - name: Validate every JavaScript block independently
        run: |
          set +e
          rm -f QA_NODE_ERROR.txt
          status=0
          for file in /tmp/maxess-scripts/*.js; do
            echo "=== $file ===" >> QA_NODE_ERROR.txt
            node --check "$file" >> QA_NODE_ERROR.txt 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then status=$rc; fi
          done
          cat QA_NODE_ERROR.txt
          if [ $status -eq 0 ]; then rm -f QA_NODE_ERROR.txt; fi
          exit $status

      - name: Publish QA diagnostic when syntax validation fails
        if: failure()
        run: |
          if [ -s QA_NODE_ERROR.txt ]; then
            git config user.name "MAXESS QA Bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add QA_NODE_ERROR.txt
            git commit -m "chore(maxess): capture JavaScript syntax QA diagnostic" || true
            git push || true
          fi

      - name: Publish generated code artifact
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/results-logic-10star')
        run: |
          rm -f QA_NODE_ERROR.txt QA_TRIGGER.txt
          if git diff --quiet -- code; then
            echo "No generated code changes required."
            exit 0
          fi
          git config user.name "MAXESS AAA Release Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- code
          git commit -m "feat(maxess): deliver AAA results experience"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            STASHED=0
            if ! git diff --quiet || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              git stash push --include-untracked -m "maxess-release-generated-worktree"
              STASHED=1
            fi
            git pull --rebase origin main
            if [ "$STASHED" -eq 1 ]; then
              git stash pop
              git add -- code
              if ! git diff --cached --quiet; then
                git commit -m "chore(maxess): preserve generated release changes"
              fi
            fi
          fi
          git push
