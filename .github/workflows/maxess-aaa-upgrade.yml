name: MAXESS Safe QA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate embed source exists
        run: test -s code

      - name: Validate HTML structure
        run: python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('code').read_text(encoding='utf-8')
          assert '<!doctype html>' in s.lower()
          assert '</html>' in s.lower()
          assert '<script' in s.lower()
          assert '</script>' in s.lower()
          assert s.count('<html') == 1
          print(f'Embed source validated: {len(s.splitlines())} lines / {len(s)} bytes')
          PY

      - name: Validate JavaScript blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          Path('/tmp').mkdir(exist_ok=True)
          for i,script in enumerate(scripts,1):
              Path(f'/tmp/maxess-{i}.js').write_text(script,encoding='utf-8')
          print(f'Found {len(scripts)} script blocks')
          PY
          for f in /tmp/maxess-*.js; do node --check "$f"; done

      - name: Report
        run: echo "MAXESS safe QA passed. This workflow never rewrites code."
