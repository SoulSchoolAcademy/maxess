name: MAXESS Safe QA

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and inspect embed source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          print('=== BASELINE ===')
          print('LINES',len(s.splitlines()))
          print('BYTES',len(s))
          print('SCRIPTS',len(re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)))
          print('BODY_CLOSE',s.lower().count('</body>'))
          print('HTML_CLOSE',s.lower().count('</html>'))
          print('RESULT_TERMS')
          for i,line in enumerate(s.splitlines(),1):
              if re.search(r'result|score|question|complete|finish',line,re.I):
                  print(f'{i}: {line[:300]}')
          PY

      - name: Validate JavaScript blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\\s[^>]*)?>([\\s\\S]*?)</script>',s,re.I)
          for i,script in enumerate(scripts,1):
              Path(f'/tmp/maxess-{i}.js').write_text(script,encoding='utf-8')
          print(f'Found {len(scripts)} script blocks')
          PY
          for f in /tmp/maxess-*.js; do node --check "$f"; done

      - name: Report
        run: echo "MAXESS safe QA passed. This workflow never rewrites code."
