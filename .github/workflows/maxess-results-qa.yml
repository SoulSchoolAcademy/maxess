name: MAXESS Results QA

on:
  push:
    paths:
      - 'tools/build_maxess_results_final.py'
      - 'nayanetpagecode'
      - 'MAXESS-RESULTS-FINAL-GROOVE.html'
      - 'MAXESS-RESULTS-FINAL-GROOVE-EMBED.html'
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - 'MAXESS-RESULTS-GROOVE-EMBED.html'
      - '.naya/memory/28-MAXESS-FINAL-RESULTS-BUILD-DIRECTIVE.md'
  pull_request:
    paths:
      - 'tools/build_maxess_results_final.py'
      - 'nayanetpagecode'
      - 'MAXESS-RESULTS-FINAL-GROOVE.html'
      - 'MAXESS-RESULTS-FINAL-GROOVE-EMBED.html'
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - 'MAXESS-RESULTS-GROOVE-EMBED.html'
      - '.naya/memory/28-MAXESS-FINAL-RESULTS-BUILD-DIRECTIVE.md'

jobs:
  final-results-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check builder syntax
        run: python -m py_compile tools/build_maxess_results_final.py

      - name: Check authoritative foundation exists
        run: |
          test -s nayanetpagecode
          grep -q 'NAYANET' nayanetpagecode
          grep -q 'ny-button' nayanetpagecode
          grep -q 'ny-primary' nayanetpagecode

      - name: Build final Results fixture
        run: python3 tools/build_maxess_results_final.py

      - name: Verify final Results contract
        run: |
          set -euo pipefail
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q '0–50' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q '51–75' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q '76–90' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q '91–100' MAXESS-RESULTS-FINAL-GROOVE.html
          test "$(grep -o 'mx-area mx-reveal' MAXESS-RESULTS-FINAL-GROOVE.html | wc -l)" -eq 18
          test "$(grep -o 'mx-dimension mx-reveal' MAXESS-RESULTS-FINAL-GROOVE.html | wc -l)" -eq 5
          grep -q 'Naya — Listen to Your Report' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'KNOW' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'TELL' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'ASK' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'CREATE' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'SCORE' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'IMPROVE' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'REPEAT' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'https://takeyourpowerback.xyz/services' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'nayanet-foundation-anchor' MAXESS-RESULTS-FINAL-GROOVE.html

      - name: Verify Groove fragment shape
        run: |
          set -euo pipefail
          ! grep -qi '<!doctype' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<html' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<head' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<body' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          grep -q 'nayanet-foundation-anchor' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html

      - name: Report final Results contract
        run: echo 'Definitive MAXESS Results QA passed: builder syntax, NayaNET foundation, score bands, five dimensions, 18 mastery areas, Master Key, Naya bridge, CTA destination, and Groove fragment structure are present.'
