name: Build MAXESS 9.5 Final Artifact

on:
  push:
    branches:
      - maxess-results-10-real-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format the single-file source
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.6.2 --parser html MAXESS-RESULTS-9-5-FINAL.html --write

      - name: Build complete verified artifact
        shell: bash
        run: |
          set -euo pipefail
          source_file="MAXESS-RESULTS-9-5-FINAL.html"
          output_file="MAXESS-RESULTS-9-5-COMPLETE-SINGLE-FILE.html"
          cp "$source_file" "$output_file"

          cat >> "$output_file" <<'EOF'

<!-- =========================================================
     MAXESS 9.5 — INTERNAL QUALITY / DIAGNOSTIC APPENDIX
     ========================================================= -->
<script>
(function(){
  'use strict';
  const QA={version:'MAXESS-QA-9.5',startedAt:new Date().toISOString(),checks:[],warnings:[],failures:[],passed:0,failed:0,warned:0};
  const REQUIRED=['direction','communication','evaluation','iteration','systemsThinking'];
  const SELECTORS=[
    '#overallScore','#overallLevel','#scoreMeaning','#characterGrid','#radarCanvas',
    '#patternDetails','#dimensionDetails','#capabilityTitle','#opportunityTitle',
    '#whyStrength','#whyGap','#whyMove','#pathway','#library','#roles','#methodLoop',
    '#naya','#nayanet','#nayaMainButton','#masterCopy','#masterScore'
  ];
  function check(name,ok,details){
    const item={name,ok:Boolean(ok),details:details||''};
    QA.checks.push(item);
    if(item.ok)QA.passed+=1;else{QA.failed+=1;QA.failures.push(item)}
    return item.ok;
  }
  function warn(name,details){QA.warned+=1;QA.warnings.push({name,details:details||''});}
  function result(){return window.MAXESS_RESULTS?.getResult?.()||window.MAXESS_RESULT||null;}
  function structure(){
    SELECTORS.forEach(selector=>check('Required UI '+selector,Boolean(document.querySelector(selector)),'Results contract anchor.'));
    check('Exactly five AI character cards',document.querySelectorAll('#characterGrid .dimension-card').length===5,'Five dimensions.');
    check('Exactly five pattern rows',document.querySelectorAll('#patternDetails .detail-row').length===5,'Five dimensions.');
    check('Exactly five explanatory rows',document.querySelectorAll('#dimensionDetails .detail-row').length===5,'Five dimensions.');
    check('Exactly eighteen library areas',document.querySelectorAll('#library .path-card').length===18,'MAXESS AI Mastery Library.');
    check('Exactly three Naya roles',document.querySelectorAll('#roles .path-card').length===3,'Director, Oscar, Architect.');
    check('Exactly seven method steps',document.querySelectorAll('#methodLoop .method-node').length===7,'KNOW through REPEAT.');
  }
  function data(){
    const r=result();
    if(!r){warn('Result data','No result is expected until the assessment handoff arrives.');return;}
    check('Result object present',typeof r==='object','Normalized result exists.');
    check('Overall score range',Number.isFinite(Number(r.overall))&&Number(r.overall)>=0&&Number(r.overall)<=100,'0–100.');
    check('Assessment completed',r.completed!==false,'Completed result required.');
    check('Assessment identity',Boolean(r.assessmentId),'Assessment ID required.');
    check('Five dimensions present',r.dimensions&&REQUIRED.every(key=>Number.isFinite(Number(r.dimensions[key]))),'Every configured dimension must be numeric.');
    check('Strongest capability present',Boolean(r.strongest),'Strongest dimension required.');
    check('Opportunity capability present',Boolean(r.opportunity),'Opportunity dimension required.');
  }
  function accessibility(){
    check('Document language',document.documentElement.lang==='en','English document language.');
    check('Viewport metadata',Boolean(document.querySelector('meta[name="viewport"]')),'Responsive viewport.');
    check('Primary heading',Boolean(document.querySelector('h1')),'One primary page heading.');
    check('Interactive names',[...document.querySelectorAll('button')].every(el=>el.textContent.trim()||el.getAttribute('aria-label')),'Buttons need accessible names.');
    check('Radar accessible',Boolean(document.querySelector('#radarCanvas[aria-label]')),'Canvas label.');
    check('Reduced motion CSS',Array.from(document.styleSheets).length>0,'Stylesheet loaded.');
  }
  function integrity(){
    const preview=new URLSearchParams(location.search).get('preview')==='1';
    check('Preview is explicit',preview===false||preview===true,'Preview mode can only be requested explicitly.');
    check('Public open API',typeof window.MAXESS_OPEN_RESULTS==='function','Assessment-to-results API.');
    check('Production API',Boolean(window.MAXESS_RESULTS_PRODUCTION?.diagnostics||window.MAXESS_RESULTS?.diagnostics),'Diagnostics API.');
    check('No external application JS',![...document.scripts].some(s=>s.src&&!s.src.startsWith(location.origin)&&!/fonts|youtube|nayanet/i.test(s.src)),'Single-file rule.');
  }
  function report(){
    const payload={version:QA.version,startedAt:QA.startedAt,finishedAt:new Date().toISOString(),passed:QA.passed,failed:QA.failed,warned:QA.warned,checks:QA.checks,warnings:QA.warnings,failures:QA.failures};
    window.MAXESS_QA_REPORT=payload;
    return payload;
  }
  function panel(){
    if(new URLSearchParams(location.search).get('qa')!=='1')return;
    if(document.getElementById('maxessQAPanel'))return;
    const p=document.createElement('aside');
    p.id='maxessQAPanel';
    p.style.cssText='position:fixed;right:16px;bottom:16px;z-index:10000;width:min(560px,calc(100% - 32px));max-height:70vh;overflow:auto;padding:18px;border:1px solid rgba(181,140,255,.35);border-radius:18px;background:rgba(8,7,12,.97);color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.7);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace';
    const r=window.MAXESS_QA_REPORT;
    p.innerHTML='<strong style="font-size:14px">MAXESS 9.5 QA</strong><div style="margin-top:10px">PASS '+r.passed+' · FAIL '+r.failed+' · WARN '+r.warned+'</div><hr style="border:0;border-top:1px solid rgba(255,255,255,.1);margin:12px 0">'+r.checks.map(c=>'<div style="color:'+(c.ok?'#8ff0c4':'#ff9090')+'">'+(c.ok?'✓':'✕')+' '+c.name+'</div>').join('')+'<button id="closeQAPanel" style="margin-top:14px;padding:8px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.12);background:#111;color:#fff">Close</button>';
    document.body.appendChild(p);
    document.getElementById('closeQAPanel').onclick=()=>p.remove();
  }
  function run(){structure();data();accessibility();integrity();report();panel();console.info('[MAXESS QA 9.5]',window.MAXESS_QA_REPORT);}
  window.MAXESS_QA={run,report,getResult:result};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(run,200),{once:true});else setTimeout(run,200);
})();
</script>
<!-- =========================================================
     MAXESS 9.5 — ACCEPTANCE CONTRACT
     =========================================================
     REAL DATA      = production renders only a valid result object.
     FIVE           = exactly five configured dimensions.
     EXPLANATION    = every dimension has meaning + action.
     PATHWAY        = three deliberate next moves.
     LIBRARY        = eighteen specialized AI areas.
     NAYA           = result context is saved + broadcast.
     NAYANET        = existing ecosystem is the final bridge.
     MOBILE         = responsive layout, not a shrunken desktop.
     ACCESSIBILITY  = labels, focus, keyboard, reduced motion, print.
     INTEGRITY      = no implicit fake result, no URL score injection.
     ========================================================= -->
EOF

          node -e "const fs=require('fs'); const p=process.argv[1]; const s=fs.readFileSync(p,'utf8'); const lines=s.split(/\r?\n/).length; if(lines<1000) throw new Error('MAXESS final artifact only '+lines+' lines; required >=1000'); if(!s.includes('MAXESS-QA-9.5')) throw new Error('QA appendix missing'); console.log('MAXESS final artifact verified:',lines,'lines');" "$output_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output_file"
          git commit -m "Build verified self-contained MAXESS 9.5 single-file artifact" || true
          git push
