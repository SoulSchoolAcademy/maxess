name: MAXESS V21 Browser QA

on:
  push:
    branches: [maxess-results-v21-complete]
    paths:
      - '.github/workflows/maxess-v21-browser-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run browser and PDF release gate
        run: |
          python3 -m http.server 4173 >/tmp/maxess-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          cat > qa.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const url='http://127.0.0.1:4173/MAXESS-RESULTS-10-GROOVE.html?fixture=demo';
          async function inspect(page,label){
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:15000});
            await page.waitForTimeout(1200);
            const checks=await page.evaluate(()=>{
              const root=document.querySelector('#maxess-results-10');
              const stage=root?.querySelector('.v20-stage');
              const orb=root?.querySelector('.v20-score-orb');
              const num=root?.querySelector('.v20-score .v13-score-number');
              const rb=orb?.getBoundingClientRect(); const nb=num?.getBoundingClientRect();
              const centered=!!(rb&&nb)&&Math.abs((nb.left+nb.width/2)-(rb.left+rb.width/2))<18&&Math.abs((nb.top+nb.height/2)-(rb.top+rb.height/2))<28;
              return {
                canonical:root?.dataset.v21Canonical==='1', resultSource:!!window.MAXESS_RESULT,
                naya:root?.querySelectorAll('.v21-naya').length===1,
                listen:root?.querySelectorAll('.v21-listen').length===1,
                miniOrbs:root?.querySelectorAll('.v21-dim-orb').length===5,
                report:root?.querySelectorAll('.v21-report').length===1,
                printReport:root?.querySelectorAll('#maxess-v21-print-report').length===1,
                oldDims:root?.querySelectorAll('.v20-dims').length===0,
                oldReportHidden:root?.querySelector('#v13-report') ? getComputedStyle(root.querySelector('#v13-report')).display==='none' : true,
                scoreCentered:centered, scoreText:num?.textContent?.trim()==='82',
                masters:root?.querySelectorAll('.v13-master').length===18,
                playground:!!root?.querySelector('.mx-naya-playground-head'),
                stageOrder:[...stage?.children||[]].slice(0,5).map(x=>x.className||x.id)
              };
            });
            console.log(label,JSON.stringify(checks,null,2));
            const failed=Object.entries(checks).filter(([k,v])=>k!=='stageOrder'&&!v).map(([k])=>k);
            if(failed.length) throw new Error(label+' gate failed: '+failed.join(', '));
            return checks;
          }
          const desktop=await browser.newPage({viewport:{width:1440,height:1100},deviceScaleFactor:1});
          await inspect(desktop,'DESKTOP');
          await desktop.screenshot({path:'/tmp/maxess-v21-desktop.png',fullPage:true});
          const mobile=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await inspect(mobile,'MOBILE');
          await mobile.screenshot({path:'/tmp/maxess-v21-mobile.png',fullPage:true});
          await desktop.pdf({path:'/tmp/maxess-v21.pdf',format:'Letter',printBackground:true,preferCSSPageSize:true});
          await browser.close();
          JS
          node qa.mjs
          test -s /tmp/maxess-v21.pdf
          PDF_BYTES=$(stat -c %s /tmp/maxess-v21.pdf)
          test "$PDF_BYTES" -gt 10000
          PDF_PAGES=$(python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/maxess-v21.pdf').read_bytes()
          print(max(0,b.count(b'/Type /Page')-b.count(b'/Type /Pages')))
          PY
          )
          test "${PDF_PAGES:-0}" -ge 2
          echo "PDF RELEASE GATE PASSED: ${PDF_PAGES} pages, ${PDF_BYTES} bytes"

      - name: Remove one-shot QA workflow after success
        run: |
          git config user.name 'MAXESS Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/maxess-v21-browser-qa.yml qa.mjs package.json package-lock.json
          git add .github/workflows/maxess-v21-browser-qa.yml qa.mjs package.json package-lock.json
          git commit -m 'MAXESS V21: browser and PDF QA passed; remove one-shot QA tooling'
          git push origin HEAD:maxess-results-v21-complete
