name: MAXESS Results V16 Candidate Build

on:
  push:
    branches:
      - naya-v16-results-candidate
    paths:
      - nayanetpagecode
      - tools/build_maxess_results_v16.py
      - tools/build_maxess_results_v16_fragment.py
      - .github/workflows/maxess-results-v16-build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-results-v16-candidate
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build complete Results artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_maxess_results_v16_fragment.py
          test -s MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS RESULTS V16 TOWER' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'window.MAXESS_RESULT' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Writing & Communication' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'AI Orchestration' MAXESS-RESULTS-10-GROOVE.html

      - name: Static HTML fragment and JavaScript checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('MAXESS-RESULTS-10-GROOVE.html')
          s=p.read_text(encoding='utf-8')
          foundation=Path('nayanetpagecode').read_text(encoding='utf-8')
          tower=s[:-len(foundation)]
          assert s.startswith('<!-- MAXESS RESULTS V16 TOWER'), 'V16 tower is not the first layer'
          assert s.endswith(foundation), 'foundation was not preserved exactly as the lower layer'
          assert tower.count('id="maxess-results-v16"') == 1
          assert tower.count('id="maxess-results-v16-css"') == 1
          assert tower.count('id="maxess-results-v16-js"') == 1
          ids=re.findall(r'\bid="([^"]+)"', tower)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate Results ids: {dup}'
          assert 'get(\'fixture\')' in tower and 'demo' in tower
          assert 'window.MAXESS_RESULT' in tower
          assert 'https://raw.githubusercontent.com' not in tower
          assert 'fetch(' not in tower
          assert 'iframe' not in tower.lower()
          assert 'document.write' not in tower
          print('STATIC STRUCTURE PASS', p.stat().st_size, 'bytes; foundation bytes=', len(foundation.encode('utf-8')))
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.I|re.S)
          with tempfile.TemporaryDirectory() as d:
              for i,script in enumerate(scripts):
                  path=Path(d)/f'script-{i}.js'
                  path.write_text(script,encoding='utf-8')
                  result=subprocess.run(['node','--check',str(path)],capture_output=True,text=True)
                  if result.returncode:
                      print(result.stderr)
                      raise SystemExit(f'JavaScript syntax failed in script {i}')
          print('JAVASCRIPT SYNTAX PASS', len(scripts), 'script blocks')
          PY

      - name: Verify required product markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            'YOUR AI SCORE' \
            'THE PATTERN' \
            'YOUR FIVE DIMENSIONS' \
            'WHAT IT MEANS' \
            'YOUR STRONGEST SIGNAL' \
            'YOUR BIGGEST LEVER' \
            'YOUR NEXT MOVE' \
            '18 NAYA MASTERS' \
            'THE SYSTEM' \
            'YOUR NEXT CHAPTER' \
            'KNOW' \
            'TELL' \
            'ASK' \
            'CREATE' \
            'SCORE' \
            'IMPROVE' \
            'REPEAT'; do
            grep -q "$marker" MAXESS-RESULTS-10-GROOVE.html
          done
          python3 - <<'PY'
          from pathlib import Path
          s=Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          names=[
            'Writing & Communication','Research & Information','Brainstorming & Ideas','Content Creation',
            'Business & Strategy','Marketing & Sales','Learning & Education','Coding & Software',
            'Images & Visual Creation','Video & Media','Audio & Music','Data & Analysis',
            'Productivity & Organization','Career & Professional Growth','Decision Making',
            'Creative Development','Systems & Automation','AI Orchestration'
          ]
          missing=[name for name in names if name not in s]
          assert not missing, f'missing canonical pathways: {missing}'
          assert sum(name in s for name in names)==18
          print('18 SPECIALIST AREAS PASS')
          PY

      - name: Commit generated candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'MAXESS V16 Builder'
          git config user.email 'maxess-v16-builder@users.noreply.github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          if git diff --cached --quiet; then
            echo 'BLOCKED — ZERO-CHANGE EXECUTION'
            exit 1
          fi
          git commit -m 'MAXESS Results V16 candidate: coherent results tower'
          git push origin HEAD:naya-v16-results-candidate
