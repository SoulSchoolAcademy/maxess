name: Build MAXESS Results

on:
  push:
    branches: [main, maxess-results-authentic-rebuild]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build canonical Results UI
        run: node scripts/build-authentic-results.js
      - name: Verify canonical output
        run: |
          test -s current-ui/MAXESS-RESULTS.html
          grep -q 'NAYANET GROUND FLOOR' current-ui/MAXESS-RESULTS.html
          grep -q 'Continue with Naya' current-ui/MAXESS-RESULTS.html
          grep -q 'Your growth path' current-ui/MAXESS-RESULTS.html
          grep -q 'MAXESS_NAYA_CONTEXT' current-ui/MAXESS-RESULTS.html
      - name: Commit generated UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-ui/MAXESS-RESULTS.html
          git diff --cached --quiet || git commit -m 'Build canonical MAXESS Results UI'
          git push
