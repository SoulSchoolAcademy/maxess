name: MAXESS V22 AAA Execution

on:
  push:
    branches:
      - maxess-results-v22-aaa-execution

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute deterministic AAA patch against the real artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python tools/maxess_aaa_v22_patch.py

      - name: Verify material implementation delta
        run: |
          test -f MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'MAXESS_AAA_V22_EXECUTION_LAYER' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'MAXESS_AAA_V22_EXECUTION_SCRIPT' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'window.MAXESS_RESULT' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'Naya%20Profile%20Black.jpg' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'Naya%20Profile%20white.jpg' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          grep -q 'prefers-reduced-motion' MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          python - <<'PY'
          from pathlib import Path
          p=Path('MAXESS-RESULTS-AAA-GROOVE-EMBED.html')
          s=p.read_text(encoding='utf-8')
          assert len(s) > 100000, len(s)
          assert s.count('<html') == 1
          assert s.count('</html>') == 1
          assert s.count('<head') == 1 and s.count('</head>') == 1
          assert s.count('<body') == 1 and s.count('</body>') == 1
          assert 'fixtureMode' in s
          print('bytes=',len(s.encode()),'lines=',len(s.splitlines()))
          PY

      - name: Commit executed artifact only
        run: |
          git config user.name 'MAXESS V22 Executor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          if git diff --cached --quiet; then
            echo 'No artifact delta remains; deterministic patch already applied.'
            exit 0
          fi
          git diff --cached --stat
          git diff --cached --check
          git commit -m 'MAXESS V22: execute AAA visual/personalization upgrade'
          git push origin HEAD:maxess-results-v22-aaa-execution
