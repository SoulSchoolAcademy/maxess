name: MAXESS AAA Results Validation
on:
  push:
    branches:
      - maxess/aaa-results-treasure
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate MAXESS JavaScript blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          assert len(scripts)==2, f'Expected 2 script blocks, found {len(scripts)}'
          for i,js in enumerate(scripts,1):
              Path(f'/tmp/maxess-script-{i}.js').write_text(js,encoding='utf-8')
          print('Extracted',len(scripts),'script blocks')
          PY
          node --check /tmp/maxess-script-1.js
          node --check /tmp/maxess-script-2.js
          grep -q 'const areas=typeof AI_AREAS' code
          grep -q 'maxess-treasure' code
          grep -q 'calculateResults' code
          grep -q 'function renderResults' code
          echo 'MAXESS AAA RESULTS VALIDATION PASS'
      - name: Remove one-time validation workflow
        run: |
          git config user.name "MAXESS Build Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/aaa-results-validate.yml
          git commit -m "chore: remove one-time results validation workflow"
          git push origin HEAD:maxess/aaa-results-treasure
