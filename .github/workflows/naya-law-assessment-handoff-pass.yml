name: Naya Law — Assessment Results Handoff Pass

on:
  push:
    branches:
      - naya/maxess-results-aaa
    paths:
      - .naya/NAYA-LAW-HANDOFF-TRIGGER

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply deterministic assessment handoff
        run: python .github/naya_law_assessment_handoff.py

      - name: Validate handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          source = Path('code').read_text(encoding='utf-8')
          required = [
              'MAXESS_9_5_CROSS_DOMAIN_HANDOFF',
              'https://results.nayanet.xyz/?result=',
              'responses: state.responses'
          ]
          missing = [x for x in required if x not in source]
          if missing:
              raise SystemExit('Missing handoff markers: ' + ', '.join(missing))
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', source, flags=re.S|re.I)
          checked = 0
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False, encoding='utf-8') as f:
                  f.write(script)
                  name = f.name
              result = subprocess.run(['node','--check',name],capture_output=True,text=True)
              if result.returncode:
                  # The assessment contains markup-adjacent inline scripts only; every script block must parse.
                  raise SystemExit('JavaScript syntax failure: ' + result.stderr)
              checked += 1
          print(f'Assessment → Results handoff validation: PASS ({checked} script blocks)')
          PY

      - name: Commit handoff and remove migrator
        run: |
          git config user.name 'Naya Law Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add code
          git rm -f .github/workflows/naya-law-assessment-handoff-pass.yml .github/naya_law_assessment_handoff.py .naya/NAYA-LAW-HANDOFF-TRIGGER
          git commit -m 'Connect MAXESS assessment to authoritative Results contract [naya-law-handoff-complete]'
          git push
