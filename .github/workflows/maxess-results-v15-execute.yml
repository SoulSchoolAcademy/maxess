name: MAXESS Results V15 — Reconstruct and Verify

on:
  push:
    branches:
      - 'naya/maxess-results-v15-execution'
    paths:
      - '.naya/maxess-results-v15-reconstruction.py'
      - '.naya/maxess-results-v15-polish.py'
      - '.github/workflows/maxess-results-v15-execute.yml'
      - 'MAXESS-RESULTS-10-GROOVE.html'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact execution branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baseline proof
        shell: bash
        run: |
          set -euo pipefail
          test -f MAXESS-RESULTS-10-GROOVE.html
          grep -q 'window.MAXESS_RESULT' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS_RESULTS_V13_EXECUTED' MAXESS-RESULTS-10-GROOVE.html
          test "$(wc -c < MAXESS-RESULTS-10-GROOVE.html)" -gt 350000

      - name: Execute V15 reconstruction when not already present
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '<!-- MAXESS-RESULTS-V15-RECONSTRUCTION -->' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'V15 reconstruction already present; preserving verified artifact.'
          else
            python3 -m py_compile .naya/maxess-results-v15-reconstruction.py
            python3 .naya/maxess-results-v15-reconstruction.py
          fi

      - name: Repair generated V15 JavaScript before proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('MAXESS-RESULTS-10-GROOVE.html')
          s = p.read_text(encoding='utf-8')
          pattern = r"(card\.setAttribute\('aria-label',`[^`]*`\))\}const h=sec\.querySelector"
          repaired, count = re.subn(pattern, r"\1});const h=sec.querySelector", s, count=1)
          if count == 1:
              p.write_text(repaired, encoding='utf-8')
              print('V15 generated-JS repair applied:', count)
          else:
              print('V15 generated-JS repair not required.')
          PY

      - name: Execute final V15 visual polish
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .naya/maxess-results-v15-polish.py
          if grep -q '<!-- MAXESS-RESULTS-V15-POLISH -->' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'V15 polish already present; preserving verified artifact.'
          else
            python3 .naya/maxess-results-v15-polish.py
          fi

      - name: Static inventory and acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MAXESS-RESULTS-10-GROOVE.html')
          s = p.read_text(encoding='utf-8')
          required = [
              '<!-- MAXESS-RESULTS-V15-RECONSTRUCTION -->','<!-- MAXESS-RESULTS-V15-POLISH -->',
              'v15-results','v15-personal-profile','MAXESS_PROFILE','maxess:profile-ready','window.MAXESS_RESULT',
              'YOUR AI SCORE','YOUR REPORT','YOUR FIVE DIMENSIONS','SEE THE PATTERN','YOUR STRENGTHS',
              'YOUR BIGGEST LEVER','YOUR NEXT MOVE','18 NAYA MASTERS','YOUR NEXT CHAPTER','Print / Save PDF',
              'maxess-results-v15-js','maxess-results-v15-polish-js','v15-master-icon'
          ]
          masters = [
              'Writing & Communication','Research & Information','Brainstorming & Ideas','Content Creation',
              'Business & Strategy','Marketing & Sales','Learning & Education','Coding & Software',
              'Images & Visual Creation','Video & Media','Audio & Music','Data & Analysis',
              'Productivity & Organization','Career & Professional Growth','Decision Making',
              'Creative Development','Systems & Automation','AI Orchestration'
          ]
          missing = [x for x in required + masters if x not in s]
          if missing: raise SystemExit('V15 validation failed; missing: ' + ', '.join(missing))
          if len(s) <= 350000: raise SystemExit(f'V15 validation failed; artifact unexpectedly small: {len(s)} bytes')
          forbidden = [
              'https://raw.githubusercontent.com/SoulSchoolAcademy/maxess/main/MAXESS-RESULTS-EXPERIENCE.js',
              'script.src=LIVING_SIGNATURE_URL;script.async=true;'
          ]
          present = [x for x in forbidden if x in s]
          if present: raise SystemExit('V15 self-contained gate failed: ' + ', '.join(present))
          if s.count('<!-- MAXESS-RESULTS-V15-RECONSTRUCTION -->') != 1: raise SystemExit('V15 duplicate reconstruction marker detected')
          if s.count('<!-- MAXESS-RESULTS-V15-POLISH -->') != 1: raise SystemExit('V15 duplicate polish marker detected')
          print('V15 static inventory passed:', len(s), 'bytes')
          print('18/18 Naya Masters present')
          print('Self-contained renderer gate passed')
          PY

      - name: JavaScript syntax proof for V15 layers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          for ident in ('maxess-results-v15-js','maxess-results-v15-polish-js'):
              m = re.search(rf'<script id="{ident}">(.*?)</script>', s, re.S)
              if not m: raise SystemExit(f'{ident} block not found')
              Path(f'/tmp/{ident}.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/maxess-results-v15-js.js
          node --check /tmp/maxess-results-v15-polish-js.js

      - name: OSCAR — adversarial static review
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          s = Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          failures = []
          checks = {
              'complete html closing': s.strip().endswith('</html>'),
              'authoritative result boundary': 'window.MAXESS_RESULT' in s,
              'personal profile contract': 'window.MAXESS_PROFILE' in s,
              'strongest signal': 'strongestSignal' in s,
              'biggest lever': 'biggestLever' in s,
              '18 masters': all(x in s for x in ['Writing & Communication','AI Orchestration']),
              'no runtime renderer loader': 'MAXESS-RESULTS-EXPERIENCE.js' not in s,
              'no living signature runtime fetch': 'script.src=LIVING_SIGNATURE_URL;script.async=true;' not in s,
              'reduced motion': 'prefers-reduced-motion:reduce' in s,
              'print layer': '@media print' in s and 'Print / Save PDF' in s,
              'responsive layer': '@media(max-width:720px)' in s,
              'naya/orb relationship': 'is-naya-speaking' in s and 'maxess:naya-speaking' in s,
              'visual master treatment': 'v15-master-icon' in s,
              'material v15 diff': s.count('MAXESS-RESULTS-V15-RECONSTRUCTION') == 2,
          }
          for name, ok in checks.items():
              print(('PASS ' if ok else 'FAIL ') + name)
              if not ok: failures.append(name)
          if failures: raise SystemExit('OSCAR FOUND MATERIAL STATIC DEFICIENCIES: ' + ', '.join(failures))
          print('OSCAR STATIC REVIEW: PASS — no material static deficiency detected.')
          PY

      - name: Diff proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          if git diff --quiet -- MAXESS-RESULTS-10-GROOVE.html; then echo 'BLOCKED — ZERO-CHANGE EXECUTION'; exit 1; fi
          git diff -- MAXESS-RESULTS-10-GROOVE.html | grep -q 'MAXESS-RESULTS-V15-RECONSTRUCTION'

      - name: Commit complete authoritative artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add -- MAXESS-RESULTS-10-GROOVE.html
          if git diff --cached --quiet; then echo 'BLOCKED — ZERO-CHANGE EXECUTION'; exit 1; fi
          git commit -m 'MAXESS Results V15: complete reconstruction and Oscar polish'
          git push origin HEAD:naya/maxess-results-v15-execution
