              'no_external_results_renderer': 'MAXESS-RESULTS-EXPERIENCE.js' not in built,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('FAILED BUILD GATES: '+', '.join(failed))

          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          Path('.naya/MAXESS-AAA-DELIVERY-MANIFEST.md').write_text(f'''# MAXESS AAA DELIVERY MANIFEST\n\n- Source master: `MAXESS-RESULTS-10-GROOVE.html`\n- Source commit: `{sha}`\n- Delivery: `MAXESS-RESULTS-AAA-GROOVE-EMBED.html`\n- Upgrade layer: `MAXESS-AAA-10.4-UPGRADE`\n- Architecture: additive; master preserved\n- Production data: `window.MAXESS_RESULT`\n- Verification gates: PASS\n\nThis is the complete readable source master plus the AAA upgrade layer.\n''', encoding='utf-8')
          subprocess.run(['git','config','user.name','MAXESS Naya Builder'],check=True)
          subprocess.run(['git','config','user.email','noreply@maxess.local'],check=True)
          subprocess.run(['git','add',str(out),'.naya/MAXESS-AAA-DELIVERY-MANIFEST.md'],check=True)
          subprocess.run(['git','commit','-m','MAXESS AAA 10.4: upgrade preserved Results master'],check=True)
          subprocess.run(['git','push'],check=True)
