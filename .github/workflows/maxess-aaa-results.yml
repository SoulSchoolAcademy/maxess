name: MAXESS AAA Results Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build complete readable Groove artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          src = Path('MAXESS-RESULTS-10-GROOVE.html')
          out = Path('MAXESS-RESULTS-AAA-GROOVE-EMBED.html')
          html = src.read_text(encoding='utf-8')
          marker = '<!-- MAXESS-AAA-10.4-UPGRADE -->'

          upgrade = r'''<!-- MAXESS-AAA-10.4-UPGRADE -->
          <style id="maxess-aaa-10-4">
          #maxess-results-10.mx-aaa-live{--aaa-c1:#ff3b30;--aaa-c2:#ff9f0a;--aaa-c3:#ffd60a;--aaa-c4:#34c759;--aaa-c5:#30d5c8;--aaa-c6:#0a84ff;--aaa-c7:#5856d6;--aaa-c8:#ff2d55}
          #maxess-results-10 .mx-aaa-orb-ring{position:absolute;inset:-7%;border-radius:50%;pointer-events:none;border:1px solid color-mix(in srgb,var(--aaa-orb,#a66cff) 60%,transparent);box-shadow:0 0 55px color-mix(in srgb,var(--aaa-orb,#a66cff) 28%,transparent),inset 0 0 45px color-mix(in srgb,var(--aaa-orb,#a66cff) 10%,transparent);animation:mxAAAOrbit 18s linear infinite}
          #maxess-results-10 .mx-aaa-orb-ring.r2{inset:12%;border-style:dashed;opacity:.42;animation-duration:26s;animation-direction:reverse}
          #maxess-results-10 .mx-score-orb{isolation:isolate;overflow:visible}
          #maxess-results-10 .mx-score-orb .mx-score{z-index:4}
          #maxess-results-10 .mx-score-orb .mx-aaa-pulse{position:absolute;inset:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--aaa-orb,#a66cff) 18%,transparent),transparent 62%);animation:mxAAAPulse 3.8s ease-in-out infinite;z-index:0}
          @keyframes mxAAAOrbit{to{transform:rotate(360deg)}}
          @keyframes mxAAAPulse{0%,100%{transform:scale(.96);opacity:.45}50%{transform:scale(1.06);opacity:.9}}
          #maxess-results-10 .mx-aaa-gauge{position:relative;display:grid!important;place-items:center!important;min-height:0!important;aspect-ratio:1!important;border-radius:50%!important;padding:28px!important;overflow:hidden!important;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.13),rgba(255,255,255,.035) 46%,rgba(0,0,0,.34) 100%)!important;border:1px solid rgba(255,255,255,.16)!important;box-shadow:inset 0 1px rgba(255,255,255,.18),0 25px 75px rgba(0,0,0,.35),0 0 45px color-mix(in srgb,var(--aaa-dim,#a66cff) 12%,transparent)!important}
          #maxess-results-10 .mx-aaa-gauge::before{content:"";position:absolute;inset:9%;border-radius:50%;background:conic-gradient(var(--aaa-dim,#a66cff) calc(var(--aaa-score,0)*1%),rgba(255,255,255,.07) 0);mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));filter:drop-shadow(0 0 8px color-mix(in srgb,var(--aaa-dim,#a66cff) 45%,transparent))}
          #maxess-results-10 .mx-aaa-gauge::after{content:"";position:absolute;inset:17%;border-radius:50%;border:1px solid color-mix(in srgb,var(--aaa-dim,#a66cff) 30%,transparent);box-shadow:inset 0 0 30px color-mix(in srgb,var(--aaa-dim,#a66cff) 10%,transparent)}
          #maxess-results-10 .mx-aaa-gauge .mx-dim-head{position:relative;z-index:2;display:flex!important;flex-direction:column!important;align-items:center!important;gap:7px!important}
          #maxess-results-10 .mx-aaa-gauge .mx-dim-head .mx-kicker{display:none}
          #maxess-results-10 .mx-aaa-gauge .mx-dim-head h3{font-size:clamp(16px,1.7vw,22px)!important;line-height:1.1!important;order:2}
          #maxess-results-10 .mx-aaa-gauge .mx-dim-head strong{order:1;font-size:clamp(44px,5vw,68px)!important;line-height:.9!important;letter-spacing:-.06em!important;text-shadow:0 0 30px color-mix(in srgb,var(--aaa-dim,#a66cff) 35%,transparent)}
          #maxess-results-10 .mx-aaa-gauge .mx-track{position:absolute!important;inset:0!important;margin:0!important;background:none!important;overflow:visible!important;z-index:1}
