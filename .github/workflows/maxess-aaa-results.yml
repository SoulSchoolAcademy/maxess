          #maxess-results-10 .mx-aaa-key div{padding:12px 7px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.035);font-size:10px;font-weight:900;letter-spacing:.07em}
          #maxess-results-10 .mx-aaa-key div:nth-child(1){border-color:rgba(255,59,48,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(2){border-color:rgba(255,159,10,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(3){border-color:rgba(255,214,10,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(4){border-color:rgba(10,132,255,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(5){border-color:rgba(88,86,214,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(6){border-color:rgba(175,82,222,.32)}#maxess-results-10 .mx-aaa-key div:nth-child(7){border-color:rgba(255,45,85,.32)}
          #maxess-results-10 .mx-aaa-naya-state{display:inline-flex;align-items:center;gap:8px;margin-top:15px;color:rgba(255,255,255,.55);font-size:11px}
          #maxess-results-10 .mx-aaa-naya-dot{width:8px;height:8px;border-radius:50%;background:var(--aaa-orb,#a66cff);box-shadow:0 0 15px var(--aaa-orb,#a66cff);animation:mxAAAPulse 2s ease-in-out infinite}
          @media(max-width:1150px){#maxess-results-10 .mx-aaa-gauge-grid{grid-template-columns:repeat(3,minmax(180px,1fr))!important}#maxess-results-10 .mx-aaa-masters{grid-template-columns:repeat(2,minmax(0,1fr))}}
          @media(max-width:800px){#maxess-results-10 .mx-aaa-pattern-grid{grid-template-columns:1fr}#maxess-results-10 .mx-aaa-pattern-visual{min-height:280px}#maxess-results-10 .mx-aaa-gauge-grid{grid-template-columns:repeat(2,minmax(150px,1fr))!important}#maxess-results-10 .mx-aaa-key{grid-template-columns:repeat(4,1fr)}}
          @media(max-width:520px){#maxess-results-10 .mx-aaa-gauge-grid{grid-template-columns:1fr 1fr!important;gap:12px!important}#maxess-results-10 .mx-aaa-gauge{padding:18px!important}#maxess-results-10 .mx-aaa-masters{grid-template-columns:1fr}#maxess-results-10 .mx-aaa-key{grid-template-columns:repeat(2,1fr)}}
          @media(prefers-reduced-motion:reduce){#maxess-results-10 .mx-aaa-orb-ring,#maxess-results-10 .mx-aaa-pulse,#maxess-results-10 .mx-aaa-naya-dot{animation:none!important}#maxess-results-10 .mx-aaa-master,#maxess-results-10 .mx-aaa-gauge{transition:none!important}}
          </style>
          <script id="maxess-aaa-10-4-js">
          (function(){
            'use strict';
            var names=['Direction','Communication','Evaluation','Iteration','Systems Thinking'];
