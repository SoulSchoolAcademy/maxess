          #maxess-results-10 .mx-aaa-gauge-grid{display:grid!important;grid-template-columns:repeat(5,minmax(170px,1fr))!important;gap:20px!important}
          #maxess-results-10 .mx-aaa-pattern{position:relative;margin-top:28px;padding:clamp(24px,3vw,42px);border:1px solid rgba(255,255,255,.14);border-radius:32px;background:linear-gradient(135deg,rgba(255,255,255,.065),rgba(255,255,255,.018));overflow:hidden}
          #maxess-results-10 .mx-aaa-pattern-grid{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.2fr);gap:32px;align-items:center}
          #maxess-results-10 .mx-aaa-pattern-visual{min-height:360px;display:grid;place-items:center}
          #maxess-results-10 .mx-aaa-pattern-visual svg{width:min(460px,90vw);height:auto;filter:drop-shadow(0 0 30px rgba(123,67,230,.18))}
          #maxess-results-10 .mx-aaa-pattern-copy h3{margin:0;font-size:clamp(28px,3vw,48px);letter-spacing:-.045em}
          #maxess-results-10 .mx-aaa-pattern-copy p{max-width:650px;color:rgba(255,255,255,.68);line-height:1.65}
          #maxess-results-10 .mx-aaa-pattern-copy strong{color:#fff}
          #maxess-results-10 .mx-aaa-lever{margin-top:20px;padding:18px 20px;border-left:3px solid var(--aaa-lever,#a66cff);background:rgba(255,255,255,.035);border-radius:0 16px 16px 0}
          #maxess-results-10 .mx-aaa-lever small{display:block;color:rgba(255,255,255,.48);font-size:10px;font-weight:900;letter-spacing:.15em;text-transform:uppercase}
