                  raise SystemExit('ERROR: master artifact has no closing body tag')
              idx = html.lower().rfind('</body>')
              built = html[:idx] + '\n' + upgrade + '\n' + html[idx:]
          else:
              built = html

          out.write_text(built, encoding='utf-8')
          checks = {
              'doctype': '<!doctype html>' in built.lower(),
              'result_contract': 'window.MAXESS_RESULT' in built,
              'five_dimensions': all(n in built for n in ['Direction','Communication','Evaluation','Iteration','Systems Thinking']),
              '18_pathways': built.count('class="mx-area') >= 18,
