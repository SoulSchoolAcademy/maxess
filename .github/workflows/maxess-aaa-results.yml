            var masterDescriptions=['Write clearly, naturally, and with purpose.','Find, compare, synthesize, and explain information.','Expand possibilities without losing the goal.','Turn ideas into useful human content.','Turn insight into positioning, decisions, and plans.','Make value understandable and action easier.','Learn, teach, explain, and build understanding.','Build, debug, explain, and improve software.','Turn concepts into visual communication.','Plan, script, package, and improve media.','Create polished documents and presentations.','Use evidence and analysis to make better decisions.','Turn intention into organized execution.','Build skills, positioning, and opportunity.','Think through important choices with more clarity.','Explore and finish original creative work.','Connect repeatable work into reliable systems.','Orchestrate models, agents, tools, context, and evaluation.'];
            var spectrum=[[0,'#ff3b30'],[49,'#ff9f0a'],[64,'#ffd60a'],[74,'#34c759'],[84,'#0a84ff'],[89,'#5856d6'],[94,'#af52de'],[100,'#ff2d55']];
            function clamp(n){return Math.max(0,Math.min(100,Number(n)||0))}
            function mix(a,b,t){function h(x){return parseInt(x.slice(1),16)}var x=h(a),y=h(b),r=Math.round(((x>>16)&255)+(((y>>16)&255)-((x>>16)&255))*t),g=Math.round(((x>>8)&255)+(((y>>8)&255)-((x>>8)&255))*t),bl=Math.round((x&255)+((y&255)-(x&255))*t);return '#'+[r,g,bl].map(function(v){return v.toString(16).padStart(2,'0')}).join('')}
            function colorFor(s){s=clamp(s);for(var i=1;i<spectrum.length;i++){if(s<=spectrum[i][0]){var a=spectrum[i-1],b=spectrum[i],t=(s-a[0])/Math.max(1,b[0]-a[0]);return mix(a[1],b[1],t)}}return spectrum[spectrum.length-1][1]}
            function result(){return window.MAXESS_RESULT||null}
            function dims(r){var d=Array.isArray(r&&r.dimensions)?r.dimensions:[];return names.map(function(n,i){var x=d.find(function(v){return String(v.name||'').toLowerCase()===n.toLowerCase()})||d[i]||{};return{name:n,score:clamp(x.score)}})}
            function text(el,v){if(el)el.textContent=String(Math.round(v))}
            function hero(root,r,ds){var s=clamp(r.overallScore),orb=root.querySelector('.mx-score-orb');var e=root.querySelector('.mx-hero .mx-eyebrow'),t=root.querySelector('.mx-title'),c=root.querySelector('.mx-hero .mx-copy');if(e)e.textContent='MAXESS AI MASTERY ASSESSMENT';if(t)t.innerHTML='Your MAXESS AI Assessment<br><em>Score</em>';if(c)c.textContent='Your score is the starting point. This report shows what it reveals, where your strongest advantage lives, and what to do next.';var b=root.querySelector('.mx-hero-actions .mx-cta-primary');if(b){b.innerHTML='See your results <span aria-hidden="true">↓</span>';b.href='#your-fingerprint'}if(orb){orb.style.setProperty('--aaa-orb',colorFor(s));var strong=orb.querySelector('.mx-score strong');text(strong,s);var band=orb.querySelector('.mx-band');if(band)band.textContent=r.band||band.textContent;if(!orb.querySelector('.mx-aaa-orb-ring')){['','r2'].forEach(function(cl){var x=document.createElement('span');x.className='mx-aaa-orb-ring '+cl;x.setAttribute('aria-hidden','true');orb.appendChild(x)});var p=document.createElement('span');p.className='mx-aaa-pulse';p.setAttribute('aria-hidden','true');orb.appendChild(p)}}}
            function gauges(root,ds){var grid=root.querySelector('.mx-dim-grid');if(!grid)return;grid.classList.add('mx-aaa-gauge-grid');[].slice.call(grid.querySelectorAll('.mx-dim')).slice(0,5).forEach(function(card,i){var d=ds[i],h=card.querySelector('.mx-dim-head h3'),s=card.querySelector('.mx-dim-head strong');card.classList.add('mx-aaa-gauge');card.style.setProperty('--aaa-score',d.score);card.style.setProperty('--aaa-dim',colors[i]);if(h)h.textContent=d.name;if(s)s.innerHTML=Math.round(d.score)+'<small>/100</small>'})}
            function bars(root,ds){root.querySelectorAll('.mx-list-row').forEach(function(row){var n=row.querySelector('b'),d=n&&ds.find(function(x){return x.name===n.textContent.trim()});if(d){text(row.querySelector('strong'),d.score);var i=row.querySelector('.mx-bar i');if(i)i.style.setProperty('--w',d.score+'%')}});root.querySelectorAll('.mx-scorecard-row').forEach(function(row){var n=row.querySelector('span'),d=n&&ds.find(function(x){return x.name===n.textContent.trim()});if(d){text(row.querySelector('b'),d.score);var i=row.querySelector('i');if(i)i.style.setProperty('--w',d.score+'%')}})}
            function radar(root,ds){var h=root.querySelector('.mx-radar'),svg=h&&h.querySelector('svg');if(!svg)return;var pts=ds.map(function(d,i){var a=-Math.PI/2+i*2*Math.PI/5,r=170*d.score/100;return[250+Math.cos(a)*r,250+Math.sin(a)*r]});svg.innerHTML='<polygon points="'+pts.map(function(p){return p.map(function(v){return v.toFixed(1)}).join(',')}).join(' ')+'" fill="rgba(166,108,255,.22)" stroke="#d7b2ff" stroke-width="3"/>';var center=h.querySelector('.mx-radar-center b');text(center,clamp(result().overallScore))}
            function pattern(root,ds){var anchor=root.querySelector('#your-fingerprint');if(!anchor||root.querySelector('.mx-aaa-pattern'))return;var hi=ds.slice().sort(function(a,b){return b.score-a.score})[0],lo=ds.slice().sort(function(a,b){return a.score-b.score})[0],avg=ds.reduce(function(a,b){return a+b.score},0)/5;var card=document.createElement('div');card.className='mx-aaa-pattern';card.innerHTML='<div class="mx-aaa-pattern-grid"><div class="mx-aaa-pattern-visual" aria-hidden="true"><svg viewBox="0 0 460 360"><circle cx="230" cy="180" r="145" fill="none" stroke="rgba(255,255,255,.09)"/><circle cx="230" cy="180" r="92" fill="none" stroke="rgba(255,255,255,.07)"/><polygon points="230,55 350,142 305,282 155,282 110,142" fill="none" stroke="rgba(255,255,255,.09)"/><polygon points="'+ds.map(function(d,i){var a=-Math.PI/2+i*2*Math.PI/5,r=125*d.score/100;return(230+Math.cos(a)*r).toFixed(1)+','+(180+Math.sin(a)*r).toFixed(1)}).join(' ')+'" fill="rgba(166,108,255,.22)" stroke="#cda5ff" stroke-width="3"/></svg></div><div class="mx-aaa-pattern-copy"><span class="mx-aaa-report-label">04 · SEE THE PATTERN</span><h3>How your strengths work together.</h3><p>Your <strong>'+hi.name+'</strong> strength gives you a foundation. Your <strong>'+lo.name+'</strong> score is the biggest lever because improving it can make the rest of your system work harder for you.</p><div class="mx-aaa-lever" style="--aaa-lever:'+colors[ds.indexOf(lo)]+'"><small>Your Biggest Lever</small><b>'+lo.name+' · '+Math.round(lo.score)+'/100</b></div><p><strong>Average capability: '+Math.round(avg)+'/100.</strong> The goal is not to make every number identical. It is to make your strengths reinforce the area with the greatest upside.</p></div></div>';anchor.appendChild(card)}
            function masters(root){var areas=[].slice.call(root.querySelectorAll('.mx-area')).slice(0,18);if(!areas.length)return;var sec=areas[0].closest('section');if(!sec||sec.querySelector('.mx-aaa-masters'))return;var grid=document.createElement('div');grid.className='mx-aaa-masters';masterNames.forEach(function(n,i){var a=areas[i],bar=a&&a.querySelector('.mx-area-relevance em'),pct=bar?(bar.style.getPropertyValue('--w')||'80%'):'80%',card=document.createElement('article');card.className='mx-aaa-master';card.style.setProperty('--aaa-master',colors[i%5]);card.style.setProperty('--aaa-w',pct);card.innerHTML='<div class="mx-aaa-master-num">'+String(i+1).padStart(2,'0')+' · NAYA MASTER</div><h3>'+n+'</h3><p>'+masterDescriptions[i]+'</p><div class="mx-aaa-master-bar"><i></i></div>';grid.appendChild(card)});var h=sec.querySelector('.mx-section-head p');if(h)h.textContent='18 specialist Naya Masters turn your assessment into practical capability pathways. Start with the areas that matter most to your goals.';var ag=sec.querySelector('.mx-areas');if(ag){ag.style.display='none';ag.insertAdjacentElement('afterend',grid)}}
            function key(root){var k=root.querySelector('.mx-key');if(!k||k.dataset.aaa)return;k.dataset.aaa='1';k.innerHTML=['KNOW','TELL','ASK','CREATE','SCORE','IMPROVE','FREEZE'].map(function(x){return'<div>'+x+'</div>'}).join('');k.classList.add('mx-aaa-key');var n=document.createElement('div');n.className='mx-aaa-naya-state';n.innerHTML='<span class="mx-aaa-naya-dot"></span><span>Naya is ready to interpret your result.</span>';k.parentNode.appendChild(n)}
            function boot(){var root=document.getElementById('maxess-results-10'),r=result();if(!root||!r||root.dataset.aaa104)return;root.dataset.aaa104='1';root.classList.add('mx-aaa-live');var ds=dims(r);hero(root,r,ds);gauges(root,ds);bars(root,ds);radar(root,ds);pattern(root,ds);masters(root);key(root);root.setAttribute('data-aaa-version','10.4')}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,80)},{once:true});else setTimeout(boot,80);
