          #maxess-results-10 .mx-aaa-master:hover{transform:translateY(-5px);border-color:rgba(255,255,255,.3);box-shadow:0 25px 60px rgba(0,0,0,.35)}
          #maxess-results-10 .mx-aaa-master-num{color:var(--aaa-master,#a66cff);font-size:10px;font-weight:900;letter-spacing:.15em}
          #maxess-results-10 .mx-aaa-master h3{margin:7px 0 5px;font-size:19px}
          #maxess-results-10 .mx-aaa-master p{margin:0;color:rgba(255,255,255,.58);font-size:12px;line-height:1.55}
          #maxess-results-10 .mx-aaa-master-bar{height:3px;margin-top:17px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
          #maxess-results-10 .mx-aaa-master-bar i{display:block;width:var(--aaa-w);height:100%;background:linear-gradient(90deg,var(--aaa-master,#a66cff),rgba(255,255,255,.9))}
