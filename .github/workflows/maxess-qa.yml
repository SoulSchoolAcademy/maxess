name: MAXESS QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('code').read_text(encoding='utf-8')
          assert s.count('id:"') >= 15, 'question configuration appears incomplete'
          assert 'AI_AREAS = [' in s, 'AI area configuration missing'
          assert s.count('color:"') >= 18, 'AI area configuration appears incomplete'
          assert s.count('meta name="maxess-build"') == 1, 'build marker must exist exactly once'
          assert 'maxess-aaa-pass" content="2026-08-14-v4-results' in s, 'V4 results marker missing'
          assert 'questionCountChip' in s, 'question counter missing'
          assert 'resultsV4Opening' in s, 'results reward layer missing'
          assert 'resultsV4MasterKeyTitle' in s, 'Master Key reveal missing'
          assert 'resultsV4MethodDetail' in s, 'scoring disclosure missing'
          assert '.results-v4-steps{display:flex' in s, 'Master Key desktop layout not normalized'
          assert 'No pressure.' in s, 'CTA trust note missing'
          assert 'They do not change your score' in s, 'interest transparency missing'
          js=re.search(r'<script>([\s\S]*)</script>', s)
          assert js, 'application script missing'
          Path('/tmp/maxess.js').write_text(js.group(1), encoding='utf-8')
          print('MAXESS structural checks passed')
          PY
      - name: JavaScript syntax validation
        run: node --check /tmp/maxess.js
