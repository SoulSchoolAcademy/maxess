name: Naya Law — Results Section Pass

on:
  push:
    paths:
      - '.naya/EXECUTE-RESULTS-SECTION-PASS'

permissions:
  contents: write

jobs:
  section-pass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply section-by-section experience pass
        env:
          FILE: MAXESS-RESULTS-10-GROOVE.html
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('MAXESS-RESULTS-10-GROOVE.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- NAYA-LAW-SECTION-FLOW-10.5 -->'
          if marker in text:
              print('Section pass already present; no-op.')
          else:
              patch = r'''
<!-- NAYA-LAW-SECTION-FLOW-10.5 -->
<style id="naya-law-section-flow-10-5">
/* 10.5 — SECTION-BY-SECTION COMPOSITION PASS
   Story first. Visual hierarchy second. Marketing last. */
#maxess-results-10{--s-black:#020205;--s-white:#fff;--s-soft:rgba(255,255,255,.76);--s-muted:rgba(255,255,255,.52);--s-line:rgba(255,255,255,.12);--s-purple:#9a62ff;--s-cyan:#46e5ff;--s-green:#39df91;--s-yellow:#ffd84a;--s-orange:#ff9d3d;--s-blue:#4c9dff;--s-magenta:#ef4bc8;background:#020205!important;color:#fff!important}
#maxess-results-10 .mx-section{padding-block:clamp(58px,6vw,96px)!important}
#maxess-results-10 .mx-section-head{max-width:1500px;margin-inline:auto!important}
#maxess-results-10 .mx-section-head h2{font-size:clamp(34px,4.6vw,72px)!important;letter-spacing:-.055em!important}
#maxess-results-10 .mx-section-head p,#maxess-results-10 .mx-copy{color:var(--s-soft)!important}

/* HERO: one glance = MAXESS + score + what happens next. */
#maxess-results-10 .mx-hero{min-height:min(900px,94vh)!important;background:radial-gradient(circle at 50% 42%,rgba(120,70,220,.20),transparent 34%),linear-gradient(180deg,#020205,#06040a 72%,#020205)!important}
#maxess-results-10 .mx-hero-grid{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(340px,620px) minmax(0,1fr)!important;grid-template-areas:'copy orb side'!important;align-items:center!important;gap:clamp(24px,4vw,72px)!important;max-width:1680px!important}
#maxess-results-10 .mx-hero-grid>.mx-score-orb{grid-area:orb!important;order:0!important;width:min(600px,45vw)!important;min-width:330px!important;margin:auto!important}
#maxess-results-10 .mx-hero-grid>div:first-child{grid-area:copy!important;text-align:left!important;display:flex!important;flex-direction:column!important;align-items:flex-start!important}
#maxess-results-10 .mx-title{font-size:clamp(44px,5.8vw,88px)!important;line-height:.92!important}
#maxess-results-10 .mx-score strong{font-size:clamp(110px,13vw,185px)!important}

/* 82 is advancing, not danger: score color follows the actual score. */
#maxess-results-10 .mx-score strong{background:linear-gradient(110deg,#39df91,#46e5ff,#4c9dff)!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important}
#maxess-results-10 .mx-score-orb{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.24),rgba(57,223,145,.18) 20%,rgba(20,30,38,.88) 48%,#030509 78%)!important;box-shadow:0 0 0 1px rgba(255,255,255,.22),inset 0 0 90px rgba(57,223,145,.18),0 40px 120px rgba(0,0,0,.72),0 0 130px rgba(70,229,255,.15)!important}
#maxess-results-10 .mx-score-orb::before{border-color:rgba(70,229,255,.42)!important;box-shadow:0 0 55px rgba(70,229,255,.16)!important}
#maxess-results-10 .mx-score-orb::after{border-color:rgba(57,223,145,.22)!important}

/* NAYA REPORT belongs near the beginning: understand before selling. */
#maxess-results-10 #naya-report{order:2;background:linear-gradient(180deg,#f7f7fa,#fff)!important;color:#08080c!important;padding-block:clamp(56px,6vw,92px)!important}
#maxess-results-10 #naya-report .mx-bridge-card{max-width:1280px!important;margin:auto!important;background:#fff!important;color:#08080c!important;border:1px solid rgba(0,0,0,.10)!important;box-shadow:0 30px 90px rgba(0,0,0,.12)!important}
#maxess-results-10 #naya-report .mx-audio-label{color:#6b36bd!important}
#maxess-results-10 #naya-report .mx-bridge-card h2{color:#08080c!important;font-size:clamp(38px,5vw,76px)!important}
#maxess-results-10 #naya-report .mx-bridge-card p{color:#33343b!important}
#maxess-results-10 #naya-report .mx-key div{color:#fff!important;box-shadow:none!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(1){background:#ff4b55!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(2){background:#ff9d3d!important;color:#111!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(3){background:#ffd84a!important;color:#111!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(4){background:#36d9d1!important;color:#07100e!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(5){background:#4c6cff!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(6){background:#9a62ff!important}
#maxess-results-10 #naya-report .mx-key div:nth-child(7){background:#ef4bc8!important}

/* FIVE DIMENSIONS: visual scan, not card reading. */
#maxess-results-10 #your-fingerprint{background:#fff!important;color:#09090d!important}
#maxess-results-10 #your-fingerprint .mx-eyebrow{color:#6637a8!important}
#maxess-results-10 #your-fingerprint .mx-section-head h2{color:#09090d!important}
#maxess-results-10 #your-fingerprint .mx-section-head p{color:#34343a!important;font-size:clamp(16px,1.35vw,20px)!important}
#maxess-results-10 #your-fingerprint .mx-radar{filter:drop-shadow(0 20px 40px rgba(70,30,120,.16))}
#maxess-results-10 #your-fingerprint .mx-list-row{background:#f4f3f7!important;border-color:rgba(0,0,0,.09)!important;color:#111!important}
#maxess-results-10 #your-fingerprint .mx-list-row span,#maxess-results-10 #your-fingerprint .mx-list-row b{color:#15151a!important}
#maxess-results-10 #your-fingerprint .mx-list-row strong{color:#6637a8!important}
#maxess-results-10 #your-fingerprint .mx-bar{background:#dedde5!important}
#maxess-results-10 #your-fingerprint .mx-bar i{background:linear-gradient(90deg,#6637a8,#46bfe0)!important}

/* DIMENSIONS: each score has a distinct energy, while staying one system. */
#maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(5,minmax(150px,1fr))!important;gap:18px!important}
#maxess-results-10 .mx-dim{min-height:330px!important;border-radius:28px!important;background:linear-gradient(160deg,#0b0b10,#15111c)!important;border:1px solid rgba(255,255,255,.13)!important;box-shadow:inset 0 1px rgba(255,255,255,.12),0 26px 70px rgba(0,0,0,.38)!important}
#maxess-results-10 .mx-dim:nth-child(1){--g:#ff9d3d}
#maxess-results-10 .mx-dim:nth-child(2){--g:#ffd84a}
#maxess-results-10 .mx-dim:nth-child(3){--g:#39df91}
#maxess-results-10 .mx-dim:nth-child(4){--g:#4c9dff}
#maxess-results-10 .mx-dim:nth-child(5){--g:#9a62ff}
#maxess-results-10 .mx-dim::before{content:"";position:absolute;top:22px;left:50%;width:154px;height:154px;transform:translateX(-50%);border-radius:50%;background:conic-gradient(var(--g) calc(var(--score,0)*1%),rgba(255,255,255,.08) 0);filter:drop-shadow(0 0 15px color-mix(in srgb,var(--g) 36%,transparent))}
#maxess-results-10 .mx-dim::after{content:"";position:absolute;top:34px;left:50%;width:130px;height:130px;transform:translateX(-50%);border-radius:50%;background:#0b0b10;box-shadow:inset 0 0 24px rgba(0,0,0,.75)}
#maxess-results-10 .mx-dim-head{position:relative;z-index:2;margin-top:52px;display:flex;flex-direction:column;align-items:center;gap:6px}
#maxess-results-10 .mx-dim-head strong{font-size:44px!important;color:var(--g)!important}
#maxess-results-10 .mx-dim .mx-track{position:relative;z-index:2;width:82%;background:rgba(255,255,255,.08)}
#maxess-results-10 .mx-dim .mx-track span{background:var(--g)!important}
#maxess-results-10 .mx-dim p,#maxess-results-10 .mx-lever{position:relative;z-index:2}
#maxess-results-10 .mx-lever span{color:var(--g)!important}

/* ADVANTAGE → LEVER → NEXT MOVE: keep the emotional progression intact. */
#maxess-results-10 .mx-panel-power{background:linear-gradient(145deg,rgba(57,223,145,.13),rgba(255,255,255,.025))!important}
#maxess-results-10 .mx-panel-lever{background:linear-gradient(145deg,rgba(154,98,255,.15),rgba(255,255,255,.025))!important}
#maxess-results-10 .mx-panel h3{font-size:clamp(30px,3.5vw,54px)!important}
#maxess-results-10 #growth-scorecard .mx-growth-cta,#maxess-results-10 #growth-scorecard .mx-micro{display:none!important}
#maxess-results-10 #growth-scorecard .mx-growth-card{background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.015))!important}

/* 18 pathways come after self-understanding, before the final solution. */
#maxess-results-10 .mx-area{background:linear-gradient(145deg,#09090e,#15101d)!important;border:1px solid rgba(255,255,255,.12)!important}
#maxess-results-10 .mx-area:hover{border-color:rgba(154,98,255,.42)!important;transform:translateY(-3px)!important}
#maxess-results-10 .mx-area-main h3{font-size:15px!important;color:#fff!important}
#maxess-results-10 .mx-mini{background:#08080d!important;color:#fff!important;border:1px solid rgba(255,255,255,.20)!important}

/* Naya playground is a bridge to the ecosystem, not the opening sales pitch. */
#maxess-results-10 .mx-naya-playground{background:linear-gradient(135deg,#160a24,#050507 72%)!important;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10)}
#maxess-results-10 .mx-naya-door{background:linear-gradient(145deg,#0b0a10,#17101f)!important;border:1px solid rgba(255,255,255,.14)!important}

/* The commercial NayaNET chapter stays after the report. */
#maxess-results-10 .mx-final-note{color:rgba(255,255,255,.48)!important}

/* PDF is a report, not a dark web screenshot. */
@media print{
  @page{size:letter;margin:.55in}
  html,body{background:#fff!important;color:#111!important}
  #maxess-results-10{background:#fff!important;color:#111!important;width:100%!important;margin:0!important}
  #maxess-results-10 .mx-section{background:#fff!important;color:#111!important;padding:28px 0!important;break-inside:avoid!important}
  #maxess-results-10 .mx-section-head h2,#maxess-results-10 .mx-title,#maxess-results-10 .mx-bridge-card h2,#maxess-results-10 h1,#maxess-results-10 h2,#maxess-results-10 h3,#maxess-results-10 h4,#maxess-results-10 strong,#maxess-results-10 b{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}
  #maxess-results-10 .mx-copy,#maxess-results-10 .mx-section-head p,#maxess-results-10 p,#maxess-results-10 .mx-dim p,#maxess-results-10 .mx-lever b{color:#333!important}
  #maxess-results-10 #naya-report{background:#fff!important}
  #maxess-results-10 .mx-bridge-card,#maxess-results-10 .mx-growth-card,#maxess-results-10 .mx-dim,#maxess-results-10 .mx-area,#maxess-results-10 .mx-panel{background:#fff!important;color:#111!important;box-shadow:none!important;border:1px solid #bbb!important;break-inside:avoid!important}
  #maxess-results-10 .mx-dim::before,#maxess-results-10 .mx-dim::after{display:none!important}
  #maxess-results-10 .mx-hero{min-height:auto!important;background:#fff!important;padding:20px 0 30px!important}
  #maxess-results-10 .mx-score-orb{width:230px!important;min-width:0!important;animation:none!important;box-shadow:none!important;background:#f3f3f5!important;color:#111!important}
  #maxess-results-10 .mx-score strong{font-size:90px!important;background:none!important;color:#111!important;-webkit-text-fill-color:#111!important}
  #maxess-results-10 .mx-hero-actions,#maxess-results-10 .mx-proof,#maxess-results-10 .nl-print,#maxess-results-10 .mx-mini{display:none!important}
  #maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(5,1fr)!important;gap:8px!important}
  #maxess-results-10 .mx-dim{min-height:180px!important}
  #maxess-results-10 .mx-key div{color:#fff!important;-webkit-text-fill-color:#fff!important}
  .ny-page-inner{break-before:page}
}

@media(max-width:1150px){
  #maxess-results-10 .mx-hero-grid{grid-template-columns:1fr!important;grid-template-areas:'orb' 'copy' 'side'!important;max-width:760px!important}
  #maxess-results-10 .mx-hero-grid>.mx-score-orb{width:min(500px,82vw)!important}
  #maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}
}
@media(max-width:720px){
  #maxess-results-10 .mx-dim-grid{grid-template-columns:1fr 1fr!important;gap:12px!important}
  #maxess-results-10 .mx-dim{min-height:310px!important}
}
@media(max-width:520px){
  #maxess-results-10 .mx-section{padding-inline:16px!important}
  #maxess-results-10 .mx-dim-grid{grid-template-columns:1fr!important}
}
</style>
<script id="naya-law-section-flow-10-5-js">
(function(){
  'use strict';
  function boot(){
    var root=document.getElementById('maxess-results-10');
    if(!root)return;
    var hero=root.querySelector('.mx-hero');
    var naya=document.getElementById('naya-report');
    var fingerprint=document.getElementById('your-fingerprint');
    var growth=document.getElementById('growth-scorecard');
    var playground=document.getElementById('naya-playground');
    var sections=Array.prototype.slice.call(root.querySelectorAll(':scope > section'));
    function sectionByText(regex){return sections.find(function(s){return regex.test((s.textContent||'').toLowerCase())});}
    var insight=sectionByText(/meaningful ai foundation|short version/);
    var dimensions=sectionByText(/every score has|what it means/);
    var advantage=sectionByText(/natural advantage|what you already/);
    var path=sectionByText(/your next chapter|capability to compounding/);
    var pathways=sectionByText(/your 18 ai pathways|don.t learn ai/);
    /* Report order: person first, interpretation second, ecosystem last. */
    [hero,naya,insight,fingerprint,dimensions,advantage,growth,path,pathways,playground].forEach(function(s){if(s)root.appendChild(s)});
    /* Keep the existing NayaNET foundation outside MAXESS intact; it remains the final conversion chapter. */
    root.setAttribute('data-section-flow','10.5');
    var score=root.querySelector('.mx-score strong');
    if(score){
      var n=Number((window.MAXESS_RESULT||{}).overallScore||score.textContent||0);
      if(n>=75&&n<85){score.style.background='linear-gradient(110deg,#39df91,#46e5ff,#4c9dff)';score.style.webkitBackgroundClip='text';score.style.backgroundClip='text';score.style.color='transparent'}
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,80)},{once:true});else setTimeout(boot,80);
})();
</script>
'''
              path.write_text(text.rstrip() + '\n' + patch + '\n', encoding='utf-8')
              print('Applied 10.5 section-flow pass.')

          marker_path = Path('.naya/EXECUTE-RESULTS-SECTION-PASS')
          if marker_path.exists(): marker_path.unlink()
          PY

      - name: Commit section pass
        run: |
          git config user.name 'Naya Law'
          git config user.email 'naya-law@users.noreply.github.com'
          git add MAXESS-RESULTS-10-GROOVE.html .naya/EXECUTE-RESULTS-SECTION-PASS
          git diff --cached --quiet || git commit -m 'MAXESS Results: section-by-section visual and narrative flow pass'
          git push
