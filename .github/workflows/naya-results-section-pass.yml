name: Naya Law — Results Section Pass

on:
  push:
    paths:
      - '.naya/EXECUTE-RESULTS-SECTION-PASS'
      - '.naya/results-section-flow-10.5.html'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply frozen section pass
        run: |
          if grep -q 'NAYA-LAW-SECTION-FLOW-10.5' MAXESS-RESULTS-10-GROOVE.html; then
            echo '10.5 pass already applied'
          else
            cat .naya/results-section-flow-10.5.html >> MAXESS-RESULTS-10-GROOVE.html
            echo '10.5 section pass appended'
          fi
          rm -f .naya/EXECUTE-RESULTS-SECTION-PASS
      - name: Commit
        run: |
          git config user.name 'Naya Law'
          git config user.email 'naya-law@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'MAXESS Results: section-by-section visual and narrative flow pass'
          git push
