name: MAXESS — Legacy Preservation Audit (Manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit preservation markers without modifying the repository
        shell: bash
        run: |
          set -euo pipefail
          test -f MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-MASTER-BASELINE-PRESERVATION-10-10' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'width:100vw' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'ny-youtube-player' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Writer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Brainstormer' MAXESS-RESULTS-10-GROOVE.html
          echo 'LEGACY PRESERVATION AUDIT: PASS'
          echo 'This workflow is audit-only. It no longer edits or pushes the authoritative Results artifact.'
