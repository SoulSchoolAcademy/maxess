name: MAXESS V17 Execute

on:
  push:
    branches:
      - maxess-results-v16-updated-edited
    paths:
      - '.github/workflows/maxess-v17-execute.yml'
      - 'MAXESS-RESULTS-10-GROOVE.html'

permissions:
  contents: write

jobs:
  execute-v17:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v16-updated-edited
          fetch-depth: 1

      - name: Execute V17 editorial transformation
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('MAXESS-RESULTS-10-GROOVE.html')
          text = path.read_text(encoding='utf-8')
          marker = 'MAXESS_RESULTS_V17_EXECUTION'
          if marker in text:
              print('V17 already present; nothing to do.')
              raise SystemExit(0)

          css = r'''
<style id="maxess-results-v17-css">
/* MAXESS V17 — PERSONAL AI REPORT EXPERIENCE */
