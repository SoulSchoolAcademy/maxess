name: MAXESS V17 Execute

on:
  push:
    branches:
      - maxess-results-v16-updated-edited
    paths:
      - '.github/workflows/maxess-v17-execute.yml'
      - 'scripts/maxess_v17_transform.py'

permissions:
  contents: write

jobs:
  execute-v17:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution branch
        uses: actions/checkout@v4
        with:
          ref: maxess-results-v16-updated-edited
          fetch-depth: 1

      - name: Execute V17 transformation
        run: python3 scripts/maxess_v17_transform.py

      - name: Static V17 verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          required = [
              'MAXESS_RESULTS_V17_EXECUTION',
              'maxess-results-v17-css',
              'YOUR AI SCORE',
              'v17-naya-banner',
              'v17-mini-orb-grid',
              'Listen to Naya',
              'YOUR MOVE',
              'INCLUDES EVERYTHING',
              'AI PROFILE',
              'Learn what AI can do for you.',
              'Technology should amplify the human.'
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit('V17 STATIC FAIL: ' + ', '.join(missing))
          if text.count('MAXESS_RESULTS_V17_EXECUTION') != 1:
              raise SystemExit('V17 STATIC FAIL: duplicate execution marker')
          if 'window.MAXESS_RESULT' not in text:
              raise SystemExit('V17 STATIC FAIL: Result Contract boundary missing')
          print('V17 STATIC PASS')
          PY

      - name: Commit executed Groove artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          if git diff --cached --quiet; then
            echo 'No artifact changes to commit.'
          else
            git commit -m 'Execute MAXESS V17 personal report experience'
            git push origin maxess-results-v16-updated-edited
          fi
