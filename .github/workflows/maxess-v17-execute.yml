          js = r'''
<script id="MAXESS_RESULTS_V17_EXECUTION">
(function(){
  'use strict';
  var root=document.getElementById('maxess-results-10');
  if(!root)return;
  root.classList.add('v17-results');
  if(document.documentElement.dataset.maxessV17==='1')return;
  document.documentElement.dataset.maxessV17='1';

  function directChildrenBy(selector){return Array.prototype.slice.call(root.children).filter(function(el){return el.matches(selector)});}
  function findSection(predicate){return Array.prototype.slice.call(root.children).find(function(el){return el.tagName==='SECTION'&&predicate(el)})||null;}
  function text(el){return (el&&el.textContent||'').replace(/\s+/g,' ').trim();}
  function make(tag,cls){var el=document.createElement(tag);if(cls)el.className=cls;return el;}

  /* 1 — Move the existing Naya report bridge to the very top and turn it into orientation. */
  var bridge=root.querySelector('#naya-report');
  var hero=findSection(function(el){return el.classList.contains('mx-hero')});
  if(bridge&&hero){
    var card=bridge.querySelector('.mx-bridge-card');
    var img=(root.querySelector('.v13-naya-intro img,.v12-naya-intro img')||{}).src||'';
    bridge.classList.add('v17-naya-orientation');
    bridge.innerHTML='';
    var banner=make('div','v17-naya-banner');
    if(img){var im=document.createElement('img');im.src=img;im.alt='Naya';banner.appendChild(im)}
    else {var fallback=make('div');fallback.setAttribute('aria-hidden','true');fallback.textContent='✦';fallback.style.cssText='display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#d8b7ff,#6f36c6);color:#fff;font-size:22px;font-weight:900';banner.appendChild(fallback)}
    var copy=make('div');
    copy.innerHTML='<div class="v17-naya-kicker">NAYA</div><div class="v17-naya-title">This isn’t a judgment. It’s a map.</div><div class="v17-naya-copy">Hi. I’ve looked at your results. I’ll help you understand what they mean — and what to do with them.</div>';
    banner.appendChild(copy);
    bridge.appendChild(banner);
    root.insertBefore(bridge,hero);
  }

  /* 2 — Make the Orb the single authoritative hero score presentation. */
  var heroScore=root.querySelector('.mx-hero .mx-score strong');
  var runtimeScore=window.MAXESS_RESULT&&window.MAXESS_RESULT.overallScore;
  if(heroScore&&runtimeScore!=null)heroScore.textContent=String(runtimeScore);
  root.querySelectorAll('.mx-hero .mx-band').forEach(function(el){el.remove()});

  /* 3 — Convert the dimensions section into five mini-Orbs and put it directly after hero. */
  var dims=findSection(function(el){return /Every score has/i.test(text(el))});
  if(!dims)dims=findSection(function(el){return el.querySelector('.mx-dim-grid')});
  if(dims){
    dims.classList.add('v17-dimensions');
    var head=dims.querySelector('.mx-section-head');
    if(head){
      var h2=head.querySelector('h2'); if(h2)h2.innerHTML='YOUR AI CAPABILITIES';
      var p=head.querySelector('p'); if(p)p.textContent='Five capabilities make up your overall AI score.';
      var eyebrow=head.querySelector('.mx-eyebrow'); if(eyebrow)eyebrow.textContent='YOUR FIVE DIMENSIONS';
    }
    var grid=dims.querySelector('.mx-dim-grid');
    if(grid){
      var cards=Array.prototype.slice.call(grid.querySelectorAll('.mx-dim'));
      var colors=['#55dfff','#ff4fb7','#ffd84a','#58e18b','#a75bff'];
      var data=(window.MAXESS_RESULT&&Array.isArray(window.MAXESS_RESULT.dimensions))?window.MAXESS_RESULT.dimensions:[];
      var mini=make('div','v17-mini-orb-grid');
      cards.forEach(function(card,i){
        var name=(card.querySelector('h3')||{}).textContent||('Dimension '+(i+1));
        var score=(data[i]&&data[i].score!=null)?data[i].score:(card.dataset.score||0);
        var item=make('article','v17-mini-orb');
        item.style.setProperty('--score',score);
        item.innerHTML='<div class="orb" style="--g:'+colors[i]+'"><span class="score">'+score+'</span></div><h3>'+name+'</h3><p>AI CAPABILITY</p>';
        mini.appendChild(item);
      });
      grid.replaceWith(mini);
    }
    var afterHero=hero.nextSibling;
    while(afterHero&&afterHero.nodeType===3)afterHero=afterHero.nextSibling;
    if(afterHero)root.insertBefore(dims,afterHero);else root.appendChild(dims);
  }

  /* 4 — Put Listen to Naya immediately after the snapshot. */
  var listen=make('div','v17-listen');
  listen.innerHTML='<button class="mx-cta mx-cta-primary" type="button" id="v17-listen-naya">🎧 Listen to Naya</button>';
  if(dims){dims.parentNode.insertBefore(listen,dims.nextSibling)}
  var legacy=document.getElementById('mx-naya-listen');
  if(legacy)legacy.style.display='none';
  var newListen=document.getElementById('v17-listen-naya');
  if(newListen)newListen.addEventListener('click',function(){window.dispatchEvent(new CustomEvent('maxess:naya-report'));var target=document.querySelector('#nayanet-foundation-anchor');if(target)target.scrollIntoView({behavior:'smooth',block:'start'})});

  /* 5 — Reorder narrative: pattern -> meaning -> strength -> lever -> action. */
  var pattern=findSection(function(el){return /See the pattern/i.test(text(el))||el.id==='your-fingerprint'});
  if(pattern)pattern.classList.add('v17-pattern-section');
  var advantage=findSection(function(el){return /What you already/i.test(text(el))});
  var next=findSection(function(el){return /From capability/i.test(text(el))});
  if(next)next.classList.add('v17-action-section');
  var growth=findSection(function(el){return el.id==='growth-scorecard'});
  var narrative=[pattern,advantage,next].filter(Boolean);
  narrative.forEach(function(sec){root.appendChild(sec)});

  /* 6 — Move the real video/CTA experience immediately after the narrative. */
  var conversion=document.querySelector('.ny-page-inner');
  var membership=conversion&&conversion.querySelector('.ny-membership');
  if(conversion){
    conversion.classList.add('v17-conversion');
    var theater=conversion.querySelector('.ny-theater');
    var primary=conversion.querySelector('.ny-primary-zone');
    if(theater||primary){
      var wrap=make('section','mx-section v17-conversion');
      if(theater)wrap.appendChild(theater);
      var move=make('div','v17-your-move');
      move.innerHTML='<h2>YOUR MOVE</h2><p>Watch the video. Then start your free trial.</p>';
      if(primary)move.appendChild(primary);
      wrap.appendChild(move);
      root.appendChild(wrap);
    }
    if(membership)membership.remove();
    conversion.remove();
  }

  /* 7 — Put all 18 Masters after the conversion point, with AI profiles. */
  var pathways=findSection(function(el){return /18 AI PATHWAYS/i.test(text(el))||el.querySelector('.mx-areas')});
  if(pathways){
    pathways.classList.add('v17-masters-section');
    var head=pathways.querySelector('.mx-section-head');
    if(head){
      var h2=head.querySelector('h2'); if(h2)h2.innerHTML='INCLUDES EVERYTHING';
      var p=head.querySelector('p'); if(p)p.textContent='All 18 Naya Masters are included — each one is a capability you can develop with Naya.';
      var e=head.querySelector('.mx-eyebrow'); if(e)e.textContent='18 NAYA MASTERS';
    }
    var areas=pathways.querySelector('.mx-areas');
    if(areas){
      var cards=Array.prototype.slice.call(areas.querySelectorAll('.mx-area'));
      var profiles=make('div','v17-masters-grid');
      cards.forEach(function(card){
        var name=(card.querySelector('h3')||{}).textContent||'AI Master';
        var desc=(card.querySelector('p')||{}).textContent||'';
        var meter=(card.querySelector('.mx-area-relevance em')||{}).style&&card.querySelector('.mx-area-relevance em').style.getPropertyValue('--w')||'0%';
        var profile=make('article','v17-master-profile');
        profile.innerHTML='<h3>'+name+'</h3><div class="profile-kicker">AI PROFILE</div><p>'+desc+'</p><div class="profile-meter"><i style="--w:'+meter+'"></i></div>';
        profiles.appendChild(profile);
      });
      areas.replaceWith(profiles);
    }
    var seal=document.querySelector('.ny-membership');
    if(seal){pathways.insertBefore(seal,pathways.firstChild);}
    root.appendChild(pathways);
  }

  /* 8 — Playground comes after Masters. */
  var playground=findSection(function(el){return el.id==='naya-playground'});
  if(playground){playground.classList.add('v17-playground');root.appendChild(playground)}

  /* 9 — Final philosophy, no duplicate commercial noise. */
  var final=root.querySelector('.mx-final');
  if(final){
    final.classList.add('v17-philosophy');
    final.innerHTML='<span class="mx-eyebrow">NAYA + HUMAN</span><h2>Technology should amplify the human.</h2><p>Naya helps you understand your capability, turn insight into action, and use AI in service of what matters to you.</p>';
    root.appendChild(final);
  }

  /* 10 — Remove obsolete duplicate/competing report blocks after the new order is established. */
  root.querySelectorAll('.mx-insight').forEach(function(el){el.remove()});
  root.querySelectorAll('#growth-scorecard').forEach(function(el){el.remove()});
  root.querySelectorAll('.mx-fingerprint').forEach(function(el){
    if(el.closest('section')!==pattern)el.remove();
  });

  /* 11 — Runtime authority: replace any visible hero/dimension values with Result Contract data. */
  var result=window.MAXESS_RESULT;
  if(result){
    var s=root.querySelector('.mx-hero .mx-score strong'); if(s&&result.overallScore!=null)s.textContent=String(result.overallScore);
  }
  root.setAttribute('data-v17-order','NAYA>SCORE>DIMENSIONS>LISTEN>PATTERN>MEANING>STRENGTH>LEVER>ACTION>VIDEO>TRIAL>MASTERS>PLAYGROUND>PHILOSOPHY');
})();
</script>
'''

          # Insert the V17 layer immediately before body close. It is intentionally self-contained and does not load anything remotely.
          injection = css + '\n' + js + '\n'
          if '</body>' not in text:
              raise SystemExit('BLOCKED: no </body> marker found')
          text = text.replace('</body>', injection + '</body>', 1)
          path.write_text(text, encoding='utf-8')
          print('V17 transformation appended:', path.stat().st_size, 'bytes')
          PY

      - name: Static V17 verification
