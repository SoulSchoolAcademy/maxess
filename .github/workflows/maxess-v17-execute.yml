name: MAXESS V17 Execute
on: push
permissions:
  contents: write
# RELEASE CONTRACT: this workflow must modify the actual working Groove artifact.
# No script-only success is valid.
jobs:
  v17:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maxess-results-v16-updated-edited
          fetch-depth: 1
      - name: Execute transformation directly against working Groove file
        run: python3 scripts/maxess_v17_transform.py
      - name: Finalize working-file order directly in Groove file
        run: python3 scripts/maxess_v17_finalize.py
      - name: Force visual pass directly into working Groove file
        run: python3 scripts/maxess_v17_force_visual.py
      - name: Execute exact top-to-bottom contract against actual Groove file
        run: python3 scripts/maxess_v17_exact_finalize.py
      - name: Verify actual working Groove artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          required = [
            'MAXESS_RESULTS_V17_EXECUTION',
            'MAXESS_RESULTS_V17_FINALIZE',
            'MAXESS_RESULTS_V17_FORCE_VISUAL',
            'MAXESS_RESULTS_V17_EXACT_EXECUTION',
            'maxess-results-v17-force-css',
            'YOUR AI SCORE',
            'LISTEN TO NAYA',
            'INCLUDES EVERYTHING',
            'AI PROFILE',
            'Technology should amplify the human.',
            'NAYA>SCORE>DIMENSIONS>LISTEN>PATTERN>MEANING>STRENGTH>LEVER>ACTION>VIDEO/TRIAL>MASTERS>PLAYGROUND>PHILOSOPHY',
            'window.MAXESS_RESULT'
          ]
          missing = [x for x in required if x not in text]
          if missing:
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: ' + ', '.join(missing))
          if text.count('MAXESS_RESULTS_V17_EXACT_EXECUTION') != 1:
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: exact marker count is not 1')
          print('ACTUAL WORKING GROOVE FILE: EXACT CONTRACT EMBEDDED')
          PY
      - name: Commit actual updated Groove file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MAXESS-RESULTS-10-GROOVE.html
          if git diff --cached --quiet; then
            echo 'ERROR: actual working Groove file did not change. Refusing false success.'
            exit 1
          fi
          git commit -m 'Apply MAXESS V17 exact execution contract to working Groove artifact'
          git push origin maxess-results-v16-updated-edited
