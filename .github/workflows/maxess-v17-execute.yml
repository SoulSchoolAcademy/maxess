          text=Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          required=[
            'MAXESS_RESULTS_V17_EXECUTION',
            'maxess-results-v17-css',
            'YOUR AI SCORE',
            'v17-naya-banner',
            'v17-mini-orb-grid',
            'Listen to Naya',
            'YOUR MOVE',
            'INCLUDES EVERYTHING',
            'AI PROFILE',
            'Learn what AI can do for you.',
            'Technology should amplify the human.'
          ]
          missing=[x for x in required if x not in text]
          if missing: raise SystemExit('V17 STATIC FAIL: '+', '.join(missing))
          if text.count('MAXESS_RESULTS_V17_EXECUTION') != 1: raise SystemExit('V17 STATIC FAIL: duplicate execution marker')
          if 'window.MAXESS_RESULT' not in text: raise SystemExit('V17 STATIC FAIL: Result Contract boundary missing')
          if 'github' in text[text.find('MAXESS_RESULTS_V17_EXECUTION'):]:
              raise SystemExit('V17 STATIC FAIL: unexpected GitHub runtime loader reference')
          print('V17 STATIC PASS')
          PY

      - name: Commit V17 artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          git diff --cached --quiet && echo 'No artifact changes to commit.' || git commit -m 'Execute MAXESS V17 personal report experience'
