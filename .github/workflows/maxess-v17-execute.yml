name: MAXESS V18 Groove Safe Execute
on: push
permissions:
  contents: write
# RELEASE CONTRACT: the actual working Groove artifact must change and contain the V18 CSS-first presentation layer.
jobs:
  v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maxess-results-v16-updated-edited
          fetch-depth: 1
      - name: Preserve existing V17 foundation
        run: |
          test -f MAXESS-RESULTS-10-GROOVE.html
          grep -q 'window.MAXESS_RESULT' MAXESS-RESULTS-10-GROOVE.html
      - name: Execute Groove-safe V18 transformation against the actual working file
        run: python3 scripts/maxess_v18_groove_safe.py
      - name: Verify the actual working Groove artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('MAXESS-RESULTS-10-GROOVE.html').read_text(encoding='utf-8')
          required = [
            'MAXESS_RESULTS_V16_AAA_EXECUTION',
            'window.MAXESS_RESULT',
            'MAXESS_RESULTS_V17_EXACT_EXECUTION',
            'MAXESS_RESULTS_V18_GROOVE_SAFE',
            'maxess-results-v18-groove-safe',
            'id="v18-listen-static"',
            'YOUR AI SCORE',
            'AI PROFILE',
            'Technology should amplify the human.'
          ]
          missing = [x for x in required if x not in text]
          if missing:
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: ' + ', '.join(missing))
          if text.count('MAXESS_RESULTS_V18_GROOVE_SAFE') < 1:
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: V18 marker missing')
          if text.count('maxess-results-v18-groove-safe') != 1:
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: V18 style must exist exactly once')
          if text.find('id="v18-listen-static"') > text.find('</body>'):
            raise SystemExit('ACTUAL WORKING FILE VERIFICATION FAILED: V18 layer is outside body')
          print('ACTUAL WORKING GROOVE FILE: V18 CSS-FIRST LAYER VERIFIED')
          PY
      - name: Commit actual updated Groove file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- MAXESS-RESULTS-10-GROOVE.html
          if git diff --cached --quiet; then
            echo 'ERROR: actual working Groove file did not change. Refusing false success.'
            exit 1
          fi
          git commit -m 'Apply MAXESS V18 Groove-safe results presentation [skip ci]'
          git push origin maxess-results-v16-updated-edited
