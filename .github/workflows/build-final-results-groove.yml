name: Build Definitive MAXESS Results

on:
  push:
    branches: [main, 'feat/maxess-final-results-99', 'feat/maxess-results-10-self-optimized']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-optimized MAXESS Results
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_maxess_results_10_self_optimized.py
          python3 tools/build_maxess_results_10_self_optimized.py

      - name: Verify final Results artifacts
        run: |
          set -euo pipefail
          for artifact in \
            MAXESS-RESULTS-FINAL-GROOVE.html \
            MAXESS-RESULTS-FINAL-GROOVE-EMBED.html \
            MAXESS-RESULTS-10-GROOVE.html \
            MAXESS-RESULTS-GROOVE-EMBED.html \
            MAXESS-RESULTS-GROOVE-EMBED-9.95.html; do
            test -f "$artifact"
          done

          lines=$(wc -l < MAXESS-RESULTS-FINAL-GROOVE.html)
          bytes=$(wc -c < MAXESS-RESULTS-FINAL-GROOVE.html)
          embed_lines=$(wc -l < MAXESS-RESULTS-FINAL-GROOVE-EMBED.html)
          embed_bytes=$(wc -c < MAXESS-RESULTS-FINAL-GROOVE-EMBED.html)
          echo "FINAL: ${lines} lines / ${bytes} bytes"
          echo "FINAL EMBED: ${embed_lines} lines / ${embed_bytes} bytes"

          test "$lines" -ge 3000
          test "$bytes" -ge 100000
          test "$embed_lines" -ge 3000
          test "$embed_bytes" -ge 100000

          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Foundation' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Developing' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Advancing' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Mastering' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Writing & Communication' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Advanced AI Work' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'Naya — Listen to Your Report' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'nayanet-foundation-anchor' MAXESS-RESULTS-FINAL-GROOVE.html
          grep -q 'https://takeyourpowerback.xyz/services' MAXESS-RESULTS-FINAL-GROOVE.html

          ! grep -qi '<!doctype' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<html' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<head' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          ! grep -qi '<body' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          grep -q 'nayanet-foundation-anchor' MAXESS-RESULTS-FINAL-GROOVE-EMBED.html
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-GROOVE-EMBED.html

          echo 'DEFINITIVE MAXESS RESULTS RELEASE GATE: PASS'

      - name: Commit authoritative artifacts
        run: |
          set -euo pipefail
          git config user.name 'MAXESS Definitive Results Release System'
          git config user.email 'actions@github.com'
          git add \
            MAXESS-RESULTS-FINAL-GROOVE.html \
            MAXESS-RESULTS-FINAL-GROOVE-EMBED.html \
            MAXESS-RESULTS-10-GROOVE.html \
            MAXESS-RESULTS-GROOVE-EMBED.html \
            MAXESS-RESULTS-GROOVE-EMBED-9.95.html \
            tools/build_maxess_results_10_self_optimized.py \
            .github/workflows/build-final-results-groove.yml
          git diff --cached --quiet || git commit -m 'Publish self-optimized MAXESS Results experience'
          git push
