name: MAXESS Results — Canonical Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - '.naya/**'
      - 'tools/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - '.naya/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxess-results-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4

      - name: Verify source-of-truth registry
        shell: bash
        run: |
          set -euo pipefail
          test -f .naya/NAYA-LAW.md
          test -f .naya/NAYA-GOVERNANCE.md
          test -f .naya/RESULTS-SOURCE-REGISTRY.md
          test -f .naya/REPOSITORY-OPERATING-MAP.md
          test -f MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RESULTS-10-GROOVE.html' .naya/RESULTS-SOURCE-REGISTRY.md
          grep -q 'results.nayanet.xyz' .naya/RESULTS-SOURCE-REGISTRY.md

      - name: Verify authoritative Results structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'id=\"maxess-results-10\"' MAXESS-RESULTS-10-GROOVE.html)" -eq 1
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RESULTS-EXPERIENCE-MANIFEST-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Writer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Brainstormer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'ny-youtube-player' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'width:100vw' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'prefers-reduced-motion' MAXESS-RESULTS-10-GROOVE.html

      - name: Run existing deterministic Results verifier
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/verify_results_10.py; then
            python3 -m py_compile tools/verify_results_10.py
            python3 tools/verify_results_10.py
          else
            echo 'No legacy verifier present; structural gate above remains authoritative.'
          fi

      - name: Detect silent fake-result fallback
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'resonance: 10.10' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'BLOCKED — authoritative Results contains a silent production-looking fake result fallback.'
            exit 1
          fi
          if grep -q 'signature: "LIVING"' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'BLOCKED — authoritative Results contains a silent fake signature fallback.'
            exit 1
          fi
          echo 'No known silent fake-result fallback detected.'

      - name: Live parity gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import re
          import urllib.request

          source = open('MAXESS-RESULTS-10-GROOVE.html', 'rb').read()
          source_text = source.decode('utf-8', errors='replace')
          source_markers = [
              'MAXESS-RESULTS-CONTRACT-1',
              'MAXESS-RESULTS-EXPERIENCE-MANIFEST-1',
              'NAYA-LAW-AAA-RESULTS-PASS-2',
          ]

          try:
              with urllib.request.urlopen('https://results.nayanet.xyz/', timeout=20) as response:
                  live = response.read().decode('utf-8', errors='replace')
          except Exception as exc:
              raise SystemExit(f'BLOCKED — could not fetch public Results target: {exc}')

          missing = [m for m in source_markers if m in source_text and m not in live]
          if missing:
              raise SystemExit('BLOCKED — DEPLOYMENT PARITY FAILURE. Missing live markers: ' + ', '.join(missing))

          if 'MAXESS-RESULTS-EXPERIENCE-MANIFEST-1' not in live:
              raise SystemExit('BLOCKED — public target does not expose the authoritative Results experience manifest.')

          print('LIVE PARITY GATE: PASS')
          print('Authoritative source SHA256:', hashlib.sha256(source).hexdigest())
          PY
