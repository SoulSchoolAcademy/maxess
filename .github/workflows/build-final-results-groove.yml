name: Build Definitive MAXESS Results

on:
  push:
    branches: [main, 'feat/maxess-final-results-99', 'feat/maxess-results-10-self-optimized']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-optimized MAXESS Results
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_maxess_results_10_self_optimized.py
          python3 tools/build_maxess_results_10_self_optimized.py
          python3 -m py_compile tools/enhance_results_10_experience.py
          python3 tools/enhance_results_10_experience.py
          python3 -m py_compile tools/append_results_10_manifest.py
          python3 tools/append_results_10_manifest.py
          python3 -m py_compile tools/format_results_10_artifacts.py
          python3 tools/format_results_10_artifacts.py

      - name: Verify final Results artifacts
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_results_10.py
          python3 tools/verify_results_10.py

      - name: Commit authoritative artifacts
        run: |
          set -euo pipefail
          git config user.name 'MAXESS Definitive Results Release System'
          git config user.email 'actions@github.com'
          git add \
            MAXESS-RESULTS-FINAL-GROOVE.html \
            MAXESS-RESULTS-FINAL-GROOVE-EMBED.html \
            MAXESS-RESULTS-10-GROOVE.html \
            MAXESS-RESULTS-GROOVE-EMBED.html \
            MAXESS-RESULTS-GROOVE-EMBED-9.95.html \
            tools/build_maxess_results_10_self_optimized.py \
            tools/enhance_results_10_experience.py \
            tools/append_results_10_manifest.py \
            tools/format_results_10_artifacts.py \
            tools/verify_results_10.py \
            .github/workflows/build-final-results-groove.yml
          git diff --cached --quiet || git commit -m 'Publish self-optimized MAXESS Results experience'
          git push
