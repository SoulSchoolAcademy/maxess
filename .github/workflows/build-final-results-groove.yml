name: Build Definitive MAXESS Results

on:
  push:
    branches: [main, 'feat/maxess-final-results-99', 'feat/maxess-results-10-self-optimized', 'feat/maxess-10-4-recognition-flow', 'fix/maxess-10-4-pink-gate', 'fix/maxess-10-4-pink-gate-v2']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-definitive-results-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build self-optimized MAXESS Results
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_maxess_results_10_self_optimized.py
          python3 tools/build_maxess_results_10_self_optimized.py
          python3 -m py_compile tools/enhance_results_10_experience.py
          python3 tools/enhance_results_10_experience.py
          python3 -m py_compile tools/results_experience_10_self_optimization_pass.py
          python3 tools/results_experience_10_self_optimization_pass.py
          python3 -m py_compile tools/append_results_10_manifest.py
          python3 tools/append_results_10_manifest.py
          python3 -m py_compile tools/format_results_10_artifacts.py
          python3 tools/format_results_10_artifacts.py
          python3 -m py_compile tools/results_experience_oscar_pass_2.py
          python3 tools/results_experience_oscar_pass_2.py
          python3 -m py_compile tools/results_experience_oscar_pass_3.py
          python3 tools/results_experience_oscar_pass_3.py

      - name: Integrate MAXESS 10.1 live visual and Naya layer
        run: |
          set -euo pipefail
          python3 -m py_compile tools/integrate_living_signature_10_1.py
          python3 tools/integrate_living_signature_10_1.py

      - name: Bootstrap MAXESS_RESULT before every visual script
        run: |
          set -euo pipefail
          python3 -m py_compile tools/bootstrap_maxess_result_10_10_v2.py
          python3 tools/bootstrap_maxess_result_10_10_v2.py

      - name: Apply MAXESS 10.2 hero-first visual pass
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maxess_results_visual_pass_10_2.py
          python3 tools/maxess_results_visual_pass_10_2.py

      - name: Apply MAXESS 10.3 cinematic experience pass
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maxess_results_visual_pass_10_3.py
          python3 tools/maxess_results_visual_pass_10_3.py

      - name: Apply MAXESS 10.4 recognition-first experience pass
        run: |
          set -euo pipefail
          python3 -m py_compile tools/maxess_results_recognition_flow_10_4.py
          python3 tools/maxess_results_recognition_flow_10_4.py

      - name: Verify final Results artifacts
        run: |
          set -euo pipefail
          python3 -m py_compile tools/verify_results_10.py
          python3 tools/verify_results_10.py
          test "$(grep -c 'MAXESS-LIVING-SIGNATURE-10.1' MAXESS-RESULTS-10-GROOVE.html)" -eq 1
          grep -q 'maxess-result-live-bridge' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'maxess-live-naya-audio' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS_RESULT_10_10_BOOTSTRAP' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'naya-playground' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Writer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Brainstormer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'mx-naya-door' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-VISUAL-PASS-10.2' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-VISUAL-PASS-10.3' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RECOGNITION-FLOW-10.4' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'maxess-pattern-10-4' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'mx-recognition-naya' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'mx-score-orb' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'width:100vw' MAXESS-RESULTS-10-GROOVE.html
          if grep -Eiq '#ff00[0-9a-f]{2}|#ff1493|#ff69b4|magenta|hotpink' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'FAIL: disallowed pink color token detected'
            exit 1
          fi
          echo 'MAXESS 10.4 recognition-first visual release gate PASS'

      - name: Commit authoritative artifacts
        run: |
          set -euo pipefail
          git config user.name 'MAXESS Definitive Results Release System'
          git config user.email 'actions@github.com'
          git add \
            MAXESS-RESULTS-FINAL-GROOVE.html \
            MAXESS-RESULTS-FINAL-GROOVE-EMBED.html \
            MAXESS-RESULTS-10-GROOVE.html \
            MAXESS-RESULTS-GROOVE-EMBED.html \
            MAXESS-RESULTS-GROOVE-EMBED-9.95.html \
            tools/build_maxess_results_10_self_optimized.py \
            tools/enhance_results_10_experience.py \
            tools/results_experience_10_self_optimization_pass.py \
            tools/results_experience_oscar_pass_2.py \
            tools/results_experience_oscar_pass_3.py \
            tools/append_results_10_manifest.py \
            tools/format_results_10_artifacts.py \
            tools/integrate_living_signature_10_1.py \
            tools/bootstrap_maxess_result_10_10.py \
            tools/bootstrap_maxess_result_10_10_v2.py \
            tools/maxess_results_visual_pass_10_2.py \
            tools/maxess_results_visual_pass_10_3.py \
            tools/maxess_results_recognition_flow_10_4.py \
            tools/verify_results_10.py \
            .naya/memory/30-GROWING-LESSON-002-OSCAR-PASS-2.md \
            .naya/memory/31-GROWING-LESSON-003-10-STAR-LIVE-PRODUCT-GATE.md \
            .github/workflows/build-final-results-groove.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Fix MAXESS 10.4 release gate wording'
            git pull --rebase origin fix/maxess-10-4-pink-gate-v2
            git push origin fix/maxess-10-4-pink-gate-v2
          fi