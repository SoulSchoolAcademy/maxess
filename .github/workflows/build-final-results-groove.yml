name: MAXESS Results — Canonical Source Verification

on:
  pull_request:
    branches: [main]
    paths:
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - 'MAXESS-RESULTS-EXPERIENCE.js'
      - '.naya/**'
      - 'tools/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'MAXESS-RESULTS-10-GROOVE.html'
      - 'MAXESS-RESULTS-EXPERIENCE.js'
      - '.naya/**'
      - 'tools/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maxess-results-source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative repository
        uses: actions/checkout@v4

      - name: Verify source-of-truth registry
        shell: bash
        run: |
          set -euo pipefail
          test -f .naya/NAYA-LAW.md
          test -f .naya/NAYA-GOVERNANCE.md
          test -f .naya/RESULTS-SOURCE-REGISTRY.md
          test -f .naya/REPOSITORY-OPERATING-MAP.md
          test -f .naya/GROOVE-DEPLOYMENT-CONTRACT.md
          test -f MAXESS-RESULTS-10-GROOVE.html
          test -f MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'MAXESS-RESULTS-10-GROOVE.html' .naya/RESULTS-SOURCE-REGISTRY.md
          grep -q 'results.nayanet.xyz' .naya/RESULTS-SOURCE-REGISTRY.md

      - name: Verify authoritative Results structure
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'id=\"maxess-results-10\"' MAXESS-RESULTS-10-GROOVE.html)" -eq 1
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RESULTS-EXPERIENCE-MANIFEST-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Writer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Brainstormer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'ny-youtube-player' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'width:100vw' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'prefers-reduced-motion' MAXESS-RESULTS-10-GROOVE.html

      - name: Verify presentation engine is the new whole-system build
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAXESS RESULTS — WHOLE-SYSTEM AAA PRESENTATION ENGINE' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'MAXESS-RESULTS-WHOLE-SYSTEM-AAA-1.0' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'OH... THAT' MAXESS-RESULTS-EXPERIENCE.js
          grep -qi 'YOUR HIGHEST-LEVERAGE OPPORTUNITY' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'PERSONALIZED AI MASTERY LIBRARY' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'Naya Director' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'KNOW' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'Print / Save PDF' MAXESS-RESULTS-EXPERIENCE.js
          node --check MAXESS-RESULTS-EXPERIENCE.js

      - name: Verify result contract boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'window.MAXESS_RESULT' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'normalizeResult' MAXESS-RESULTS-EXPERIENCE.js
          grep -q 'Never calculate a new assessment score' MAXESS-RESULTS-EXPERIENCE.js
          if grep -q 'localStorage' MAXESS-RESULTS-EXPERIENCE.js; then
            echo 'BLOCKED — Results presentation must not use localStorage for the cross-origin handoff.'
            exit 1
          fi

      - name: Detect silent fake-result fallback
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'resonance: 10.10' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'BLOCKED — authoritative Results contains a silent production-looking fake result fallback.'
            exit 1
          fi
          if grep -q 'signature: "LIVING"' MAXESS-RESULTS-10-GROOVE.html; then
            echo 'BLOCKED — authoritative Results contains a silent fake signature fallback.'
            exit 1
          fi
          echo 'No known silent fake-result fallback detected.'

      - name: Report external live-parity boundary
        shell: bash
        run: |
          echo 'SOURCE VERIFICATION: PASS'
          echo 'LIVE PARITY: EXTERNAL GATE'
          echo 'The public Groove target must be verified independently after authenticated Groove publication.'
          echo 'GitHub Actions is not authorized to infer live parity from a source write.'
