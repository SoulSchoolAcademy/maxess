name: Build Authoritative MAXESS 9.9 Results Groove

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build MAXESS 9.9 transformation
        run: |
          set -euo pipefail
          python3 tools/build_maxess_results_9_9.py

      - name: Final source inventory
        run: |
          set -euo pipefail
          test -f MAXESS-RESULTS-10-GROOVE.html
          lines=$(wc -l < MAXESS-RESULTS-10-GROOVE.html)
          bytes=$(wc -c < MAXESS-RESULTS-10-GROOVE.html)
          echo "MAXESS 9.9 artifact: ${lines} lines / ${bytes} bytes"
          test "$lines" -ge 1000
          test "$bytes" -ge 70000
          grep -q 'MAXESS_RESULTS_9_9_TRANSFORMATION' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-RESULTS-CONTRACT-1' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'WHAT AI REALLY SAYS ABOUT YOU' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'm9Radar' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'm9Library' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'm9Roles' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'm9Naya' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'https://nayanet.xyz/' MAXESS-RESULTS-10-GROOVE.html
          echo 'MAXESS 9.9 release gate: PASS'

      - name: Commit authoritative artifact
        run: |
          set -euo pipefail
          git config user.name 'MAXESS 9.9 Release System'
          git config user.email 'actions@github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          git diff --cached --quiet || git commit -m 'Publish authoritative MAXESS 9.9 Results artifact'
          git push
