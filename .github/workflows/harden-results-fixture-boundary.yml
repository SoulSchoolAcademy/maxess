name: MAXESS — Harden Result Contract Boundary

on:
  push:
    branches: [naya/clarify-source-and-release-path]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maxess-result-contract-boundary
  cancel-in-progress: true

jobs:
  harden:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply explicit fixture boundary
        run: |
          set -euo pipefail
          python3 tools/harden_results_fixture_boundary.py

      - name: Prove the silent fake fallback is gone
        run: |
          set -euo pipefail
          ! grep -q 'resonance: 10.10' MAXESS-RESULTS-10-GROOVE.html
          ! grep -q 'signature: "LIVING"' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'fixtureMode' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'maxess-result-contract-guard' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'data-result-state' MAXESS-RESULTS-10-GROOVE.html

      - name: Commit hardened authoritative artifact
        run: |
          set -euo pipefail
          git config user.name 'MAXESS Result Contract Boundary System'
          git config user.email 'actions@github.com'
          git add MAXESS-RESULTS-10-GROOVE.html tools/harden_results_fixture_boundary.py
          if ! git diff --cached --quiet; then
            git commit -m 'Harden MAXESS Results fixture boundary [skip ci]'
            git push origin HEAD:${{ github.ref_name }}
          fi
