name: Naya Law — AAA Results Implementation Pass

# One-time controlled migration. It self-removes after the authoritative artifact is updated.
# Retry marker: validation now checks the actual circular-gauge implementation marker.

on:
  push:
    branches:
      - naya/maxess-results-aaa
    paths:
      - .github/workflows/naya-law-aaa-results-pass.yml

permissions:
  contents: write

jobs:
  implement:
    if: "!contains(github.event.head_commit.message, '[naya-law-aaa-complete]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply deterministic Naya Law implementation
        run: python .github/naya_law_aaa_results_pass.py

      - name: Validate implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MAXESS-RESULTS-10-GROOVE.html')
          s = p.read_text(encoding='utf-8')
          required = [
              'NAYA-LAW-AAA-IMPLEMENTATION-10',
              'MAXESS_RESULT',
              'maxess-aaa-runtime',
              'aaa-dim-gauge',
              'prefers-reduced-motion',
              'window.print'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required implementation markers: ' + ', '.join(missing))
          if 'resonance: 10.10' in s:
              raise SystemExit('Forbidden silent production fallback remains')
          if 'data-score="82"' in s:
              raise SystemExit('Static fixture score remains in authoritative markup')
          if 'const fallback=' in s:
              raise SystemExit('Recognition-flow fallback fixture remains')
          print('Naya Law implementation validation: PASS')
          PY

      - name: Commit authoritative artifact and remove one-time migrator
        run: |
          git config user.name 'Naya Law Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add MAXESS-RESULTS-10-GROOVE.html
          git rm -f .github/workflows/naya-law-aaa-results-pass.yml .github/naya_law_aaa_results_pass.py
          git commit -m 'Implement Naya Law AAA MAXESS Results pass [naya-law-aaa-complete]'
          git push
