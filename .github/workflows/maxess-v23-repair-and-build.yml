name: MAXESS V23 repair and build

on:
  push:
    branches: [maxess-results-v23-aaa-execution]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore authoritative production artifact
        run: |
          git fetch origin main
          git checkout origin/main -- MAXESS-RESULTS-AAA-GROOVE-EMBED.html

      - name: Apply safe AAA enhancement layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('MAXESS-RESULTS-AAA-GROOVE-EMBED.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\\\\\n', '\n')
          css = r'''<style id="maxess-v23-aaa-css">
          :root{--v23-ink:#08080d;--v23-white:#fff;--v23-purple:#8b4dff;--v23-magenta:#ee43c8;--v23-teal:#35d8c0;--v23-gold:#ffd447;}
          .v23-naya-note{position:relative;display:flex;align-items:center;gap:14px;max-width:860px;margin:24px auto 0;padding:14px 18px;border:1px solid rgba(139,77,255,.24);border-radius:28px;background:radial-gradient(circle at 12% 20%,rgba(139,77,255,.16),transparent 38%),rgba(255,255,255,.82);box-shadow:0 14px 45px rgba(20,10,40,.12);backdrop-filter:blur(18px);text-align:left;z-index:3}
          .v23-naya-note img{width:52px;height:52px;flex:0 0 52px;border-radius:50%;object-fit:cover;border:2px solid rgba(139,77,255,.35);box-shadow:0 0 0 6px rgba(139,77,255,.08),0 8px 24px rgba(40,10,80,.16)}
          .v23-naya-note strong{display:block;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#6e3ed1;margin-bottom:3px}.v23-naya-note span{display:block;font-size:1rem;line-height:1.45;color:#27232d}
          .v23-section-naya{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:8px 12px;width:max-content;max-width:100%;border-radius:999px;background:rgba(139,77,255,.07);border:1px solid rgba(139,77,255,.14)}
          .v23-section-naya img{width:30px;height:30px;border-radius:50%;object-fit:cover}.v23-section-naya span{font-size:.8rem;font-weight:700;letter-spacing:.04em;color:#5e3aa8}
          .v23-orb-enhanced{filter:drop-shadow(0 0 26px rgba(139,77,255,.28));animation:v23-breathe 4.8s ease-in-out infinite}.v23-score-glow{animation:v23-breathe 4.8s ease-in-out infinite}
          @keyframes v23-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
          @media (prefers-reduced-motion:reduce){.v23-orb-enhanced,.v23-score-glow{animation:none!important}}
          @media(max-width:700px){.v23-naya-note{margin:18px 12px 0;padding:12px 14px;border-radius:22px}.v23-naya-note img{width:44px;height:44px;flex-basis:44px}.v23-naya-note span{font-size:.92rem}}
          @media print{.v23-naya-note,.v23-section-naya{box-shadow:none;background:#fff;break-inside:avoid}}
          </style>'''
          js = r'''<script id="maxess-v23-aaa-js">
          (function(){
            'use strict';
            function ready(fn){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fn,{once:true});else fn();}
            ready(function(){
              var root=document.getElementById('maxess-results-10');
              if(!root)return;
              if(root.dataset.v23aaa==='1')return;
              root.dataset.v23aaa='1';
              var naya='https://i.postimg.cc/RF3XFWJ7/grok-image-c6a924fd-1f75-4ac8-840d-35b224fb3e52.jpg';
              var result=window.MAXESS_RESULT||{};
              var score=Number(result.overallScore??result.score??result.masterScore);
              if(!Number.isFinite(score)){var scoreEl=root.querySelector('.mx-score strong,.mx-score-number,.score-number');if(scoreEl)score=Number((scoreEl.textContent||'').replace(/[^0-9.]/g,''));}
              function note(text){var d=document.createElement('div');d.className='v23-naya-note';d.innerHTML='<img src="'+naya+'" alt="Naya"><div><strong>Naya · Your AI Guide</strong><span>'+text+'</span></div>';return d;}
              var first=root.querySelector('section');
              if(first&&!first.querySelector('.v23-naya-note')){
                var text=Number.isFinite(score)?'I\'m here with you. Your score is the beginning — let\'s look at what it reveals about the way you work with AI.':'I\'m here with you. Let\'s turn your results into something you can understand and use.';
                first.appendChild(note(text));
              }
              var sections=[].slice.call(root.querySelectorAll('section'));
              sections.slice(1).forEach(function(section){
                if(section.querySelector('.v23-section-naya'))return;
                var h=section.querySelector('h1,h2,h3');
                if(!h)return;
                var label=(h.textContent||'').replace(/\s+/g,' ').trim();
                if(!label)return;
                var chip=document.createElement('div');chip.className='v23-section-naya';chip.innerHTML='<img src="'+naya+'" alt="Naya"><span>Naya · '+label+'</span>';
                section.insertBefore(chip,section.firstChild);
              });
              var orb=root.querySelector('.v13-score-orb,.mx-orb,.score-orb,.orb');
              if(orb)orb.classList.add('v23-orb-enhanced');
              var scoreNodes=root.querySelectorAll('.mx-score strong,.mx-score-number,.score-number,.v13-score-number');
              scoreNodes.forEach(function(el){el.classList.add('v23-score-glow');});
            });
          })();
          </script>'''
          if '</head>' not in s or '</body>' not in s or 'id="maxess-results-10"' not in s:
              raise SystemExit('BUILD_GATE_FAIL: authoritative artifact structure is incomplete')
          s=s.replace('</head>',css+'\n</head>',1)
          s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate artifact structure and inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('MAXESS-RESULTS-AAA-GROOVE-EMBED.html').read_text(encoding='utf-8')
          required=['<!doctype html','</html>','id="maxess-results-10"','window.MAXESS_RESULT','v23-naya-note','maxess-v23-aaa-js']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('QA_FAIL missing: '+', '.join(missing))
          scripts=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          for i,code in enumerate(scripts):
              f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(code);f.close()
              r=subprocess.run(['node','--check',f.name],capture_output=True,text=True)
              if r.returncode: raise SystemExit(f'JS_SYNTAX_FAIL script {i}: {r.stderr}')
          print('QA_PASS',len(scripts),'inline scripts checked')
          print('SIZE',len(s),'bytes')
          PY

      - name: Commit repaired candidate
        run: |
          git config user.name "MAXESS V23 Builder"
          git config user.email "actions@github.com"
          git add MAXESS-RESULTS-AAA-GROOVE-EMBED.html
          git commit -m "MAXESS V23: restore complete artifact and apply safe AAA layer" || exit 0
          git push origin maxess-results-v23-aaa-execution
