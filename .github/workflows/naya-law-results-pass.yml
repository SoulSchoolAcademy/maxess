name: Naya Law — MAXESS Results Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Naya Law preservation markers
        shell: bash
        run: |
          set -euo pipefail
          test -f MAXESS-RESULTS-10-GROOVE.html
          grep -q 'MAXESS-MASTER-BASELINE-PRESERVATION-10-10' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'NAYA-LAW-AAA-RESULTS-PASS-2' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'width:100vw' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'ny-youtube-player' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Writer' MAXESS-RESULTS-10-GROOVE.html
          grep -q 'Naya Brainstormer' MAXESS-RESULTS-10-GROOVE.html
          echo 'NAYA LAW PRESERVATION AUDIT: PASS'

      - name: Verify duplicate artifacts are not silently treated as masters
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAXESS-RESULTS-10-GROOVE.html' .naya/RESULTS-SOURCE-REGISTRY.md
          grep -q 'DUPLICATE MIRROR' .naya/RESULTS-SOURCE-REGISTRY.md
          echo 'SOURCE-OF-TRUTH AUDIT: PASS'
          echo 'This workflow is audit-only. It no longer edits or pushes Results artifacts.'
