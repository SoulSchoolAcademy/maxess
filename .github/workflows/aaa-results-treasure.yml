name: MAXESS AAA Results Treasure Build

on:
  push:
    branches:
      - maxess/aaa-results-treasure

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply AAA results experience
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('code')
          s = p.read_text(encoding='utf-8')
          assert '<style>' in s and '</style>' in s and '</body>' in s, 'MAXESS structure not found'
          assert 'class="results-v4-intro results-v4-reveal"' in s, 'Expected results intro not found'
          assert 'id="dimensionConstellation"' in s, 'Expected dimensions anchor not found'
          assert 'class="final-cta"' in s, 'Expected legacy CTA not found'

          css = r'''
          /* =========================================================
             MAXESS AAA RESULTS — TREASURE EXPERIENCE LAYER
             Presentation-only layer. Scoring engine and assessment flow
             remain untouched. This layer elevates the post-assessment UX.
          ========================================================= */
          .results-v4-intro.maxess-legacy-hidden,
          .final-cta.maxess-legacy-hidden{display:none!important}
          .maxess-treasure{position:relative;margin:clamp(34px,5vw,72px) 0 12px;padding:clamp(28px,5vw,62px);border:1px solid rgba(255,212,90,.34);border-radius:34px;overflow:hidden;background:radial-gradient(circle at 50% -10%,rgba(255,212,90,.16),transparent 34%),radial-gradient(circle at 0% 80%,rgba(138,92,255,.18),transparent 35%),linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.012) 45%,rgba(138,92,255,.035));box-shadow:0 34px 100px rgba(0,0,0,.55),0 0 90px rgba(255,212,90,.08),inset 0 1px 0 rgba(255,255,255,.11)}
          .maxess-treasure::before{content:"";position:absolute;inset:-35%;pointer-events:none;background:conic-gradient(from 180deg,transparent,rgba(255,212,90,.08),transparent 30%,rgba(138,92,255,.08),transparent 65%);animation:maxessTreasureSpin 18s linear infinite}
          @keyframes maxessTreasureSpin{to{transform:rotate(360deg)}}
          .maxess-treasure-inner{position:relative;z-index:1;max-width:1080px;margin:auto;text-align:center}
          .maxess-treasure-kicker{font-size:10px;font-weight:950;letter-spacing:.22em;color:#ffd45a;text-transform:uppercase}
          .maxess-treasure-title{margin:12px auto 10px;max-width:900px;font-size:clamp(30px,5vw,62px);line-height:.98;letter-spacing:-.045em;font-weight:1000}
          .maxess-treasure-title span{background:linear-gradient(90deg,#fff,#ffd45a,#caa8ff,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:maxessShimmer 5s linear infinite}
          @keyframes maxessShimmer{to{background-position:220% center}}
          .maxess-treasure-sub{max-width:760px;margin:0 auto;color:#c7c2d0;font-size:clamp(14px,1.7vw,18px);line-height:1.65}
          .maxess-treasure-logo{display:block;width:min(210px,48vw);max-height:92px;object-fit:contain;margin:0 auto 18px;filter:drop-shadow(0 0 24px rgba(255,212,90,.16))}
          .maxess-value-line{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:24px auto 30px}
          .maxess-value-chip{padding:8px 12px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.035);color:#e7e2ed;font-size:10px;font-weight:850;letter-spacing:.04em}
          .maxess-expert-header{margin:42px 0 20px;text-align:left}
          .maxess-expert-header h4{margin:0 0 6px;font-size:clamp(20px,2.5vw,30px);font-weight:950}
          .maxess-expert-header p{margin:0;color:#9f9aa8;line-height:1.6}
          .maxess-expert-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;text-align:left}
          .maxess-expert-card{position:relative;min-height:112px;padding:14px 10px;border:1px solid rgba(255,255,255,.10);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));box-shadow:inset 0 1px 0 rgba(255,255,255,.05);transition:transform .22s var(--ease),border-color .22s ease,box-shadow .22s ease}
          .maxess-expert-card:hover{transform:translateY(-4px);border-color:rgba(255,212,90,.35);box-shadow:0 14px 30px rgba(0,0,0,.35),0 0 25px rgba(138,92,255,.09)}
          .maxess-expert-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;margin-bottom:9px;border:1px solid rgba(255,255,255,.14);background:radial-gradient(circle at 30% 20%,#fff,rgba(181,140,255,.55) 25%,rgba(87,37,178,.55) 62%,rgba(0,0,0,.3));color:#fff;font-size:12px;font-weight:1000;box-shadow:0 0 18px rgba(138,92,255,.15)}
          .maxess-expert-name{font-size:12px;font-weight:950;line-height:1.12;color:#fff}
          .maxess-expert-type{margin-top:5px;font-size:8px;line-height:1.3;letter-spacing:.08em;text-transform:uppercase;color:#9f99aa}
          .maxess-three-step{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:34px 0 0;text-align:left}
          .maxess-step-card{padding:20px;border-radius:22px;border:1px solid rgba(255,255,255,.11);background:rgba(0,0,0,.22)}
          .maxess-step-no{font-size:10px;font-weight:1000;letter-spacing:.16em;color:#ffd45a}
          .maxess-step-card h5{margin:8px 0 6px;font-size:18px}
          .maxess-step-card p{margin:0;color:#aaa5b2;font-size:12px;line-height:1.55}
          .maxess-offer{margin:38px 0 0;padding:clamp(24px,4vw,42px);border-radius:28px;border:1px solid rgba(255,212,90,.45);background:linear-gradient(145deg,rgba(255,212,90,.10),rgba(138,92,255,.10) 55%,rgba(0,0,0,.18));box-shadow:0 0 55px rgba(255,212,90,.08),inset 0 1px 0 rgba(255,255,255,.10)}
          .maxess-offer-badge{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(255,212,90,.12);border:1px solid rgba(255,212,90,.28);color:#ffe99b;font-size:9px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}
          .maxess-offer h4{margin:15px 0 10px;font-size:clamp(25px,3.4vw,42px);line-height:1.05;font-weight:1000}
          .maxess-offer p{max-width:760px;margin:0 auto;color:#c8c2cf;line-height:1.6}
          .maxess-cta-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:26px}
          .maxess-cta-actions button{min-height:58px;min-width:220px;padding:0 24px;border-radius:18px;border:1px solid rgba(255,255,255,.24);font-weight:1000;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s ease,border-color .2s ease}
          .maxess-cta-primary{color:#08070a;background:linear-gradient(180deg,#ffe38a,#ffd45a);box-shadow:0 15px 38px rgba(255,212,90,.20),0 0 30px rgba(255,212,90,.10)}
          .maxess-cta-secondary{color:#fff;background:linear-gradient(180deg,#17141e,#09080c);border-color:rgba(181,140,255,.55)!important}
          .maxess-cta-actions button:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.42),0 0 30px rgba(138,92,255,.18)}
          .maxess-cta-fine{margin-top:13px!important;font-size:10px!important;color:#8f8999!important}
          .maxess-ecosystem{margin-top:34px;padding-top:25px;border-top:1px solid rgba(255,255,255,.09);display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap;color:#aaa5b2;font-size:10px;letter-spacing:.04em}
          .maxess-ecosystem img{width:76px;max-height:42px;object-fit:contain;opacity:.9}
          .maxess-story-section{margin-top:clamp(24px,3vw,42px)}
          @media(max-width:900px){.maxess-expert-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
          @media(max-width:620px){.maxess-treasure{border-radius:26px;padding:24px 16px}.maxess-expert-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.maxess-expert-card{min-height:100px;padding:11px 8px}.maxess-expert-name{font-size:10px}.maxess-three-step{grid-template-columns:1fr}.maxess-cta-actions{flex-direction:column}.maxess-cta-actions button{width:100%}}
          @media(prefers-reduced-motion:reduce){.maxess-treasure::before,.maxess-treasure-title span{animation:none}}
          '''

          js = r'''
          (function(){
            "use strict";
            const escapeHtmlSafe=(value)=>String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
            const run=()=>{
              const resultsView=document.getElementById("resultsView");
              if(!resultsView || resultsView.dataset.maxessTreasureReady==="1") return;
              resultsView.dataset.maxessTreasureReady="1";
              const legacyIntro=resultsView.querySelector(".results-v4-intro");
              if(legacyIntro) legacyIntro.classList.add("maxess-legacy-hidden");
              const dimensionAnchor=document.getElementById("dimensionConstellation");
              const dimensionSection=dimensionAnchor ? dimensionAnchor.closest(".report-section") : null;
              const insightFlow=resultsView.querySelector(".insight-flow");
              const storySection=insightFlow ? insightFlow.closest(".report-section") : null;
              if(dimensionSection && storySection){dimensionSection.insertAdjacentElement("afterend",storySection);storySection.classList.add("maxess-story-section");}
              const legacyCta=resultsView.querySelector(".final-cta");
              if(legacyCta) legacyCta.classList.add("maxess-legacy-hidden");
              if(resultsView.querySelector(".maxess-treasure")) return;
              const logo="https://i.postimg.cc/QCJTLMd8/Maximus-2.png";
              const areas=Array.isArray(window.AI_AREAS) ? window.AI_AREAS : [];
              const specialized=areas.slice(0,18).map((area,i)=>({name:area&&area.name?area.name:`AI Expert ${i+1}`,type:"Specialized Naya"}));
              const core=[{name:"Naya Prime",type:"Master intelligence"},{name:"Naya Orchestrator",type:"Coordinates the experts"},{name:"Naya Oscar",type:"Elite quality judge"}];
              const experts=[...specialized,...core].slice(0,21);
              const fallback=["Naya Architect","Naya Writer","Naya Designer","Naya Video","Naya Researcher","Naya Marketer","Naya Strategist"];
              while(experts.length<21){experts.splice(Math.max(0,experts.length-3),0,{name:fallback[experts.length%fallback.length],type:"Specialized Naya"});}
              const iconFor=(name)=>{const letters=String(name).replace(/^Naya\s*/i,"").trim().split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();return letters||"N";};
              const cards=experts.map((e)=>`<article class="maxess-expert-card"><div class="maxess-expert-icon" aria-hidden="true">${escapeHtmlSafe(iconFor(e.name))}</div><div class="maxess-expert-name">${escapeHtmlSafe(e.name)}</div><div class="maxess-expert-type">${escapeHtmlSafe(e.type)}</div></article>`).join("");
              const offer=document.createElement("section");
              offer.className="maxess-treasure results-v4-reveal";
              offer.setAttribute("aria-labelledby","maxessTreasureTitle");
              offer.innerHTML=`<div class="maxess-treasure-inner"><img class="maxess-treasure-logo" src="${logo}" alt="Human Maximus" loading="lazy"><div class="maxess-treasure-kicker">YOU FOUND THE NEXT LEVEL</div><h3 class="maxess-treasure-title" id="maxessTreasureTitle">I got you. <span>Now let's end the frustration of not getting the results you want from AI.</span></h3><p class="maxess-treasure-sub">Your report showed you where you are. This is the simple system for learning how to get exceptional AI results — without having to figure the whole thing out yourself.</p><div class="maxess-value-line"><span class="maxess-value-chip">18 specialized Master Key blueprints</span><span class="maxess-value-chip">18 specialized Naya experts</span><span class="maxess-value-chip">AI Master Activation Rolodex</span><span class="maxess-value-chip">Master AI · Be Your Max · Get Paid</span></div><div class="maxess-expert-header"><h4>Your AI expert team</h4><p>Think of this as your ready-made team of AI specialists. Choose the area you want to master, give Naya the right blueprint, activate the expert role, and follow the process.</p></div><div class="maxess-expert-grid" aria-label="21 AI expert roles">${cards}</div><div class="maxess-expert-header"><h4>Three steps. That's it.</h4><p>The system is deliberately simple: give AI the big picture, choose the specialty, then activate the expert.</p></div><div class="maxess-three-step"><article class="maxess-step-card"><div class="maxess-step-no">01 · MASTER KEY</div><h5>Give Naya the blueprint</h5><p>The universal Master Key teaches the overall process for directing, evaluating, improving, and systematizing AI.</p></article><article class="maxess-step-card"><div class="maxess-step-no">02 · SPECIALIZED KEY</div><h5>Choose what you want to master</h5><p>Match the universal blueprint with the specialized key for the exact territory you want to work in.</p></article><article class="maxess-step-card"><div class="maxess-step-no">03 · ACTIVATE THE EXPERT</div><h5>Make Naya the master</h5><p>Use the activation Rolodex to give your AI the role, expertise, standards, and operating instructions for that specialty.</p></article></div><div class="maxess-offer"><div class="maxess-offer-badge">✦ YOUR INVITATION · START FREE</div><h4>Stop fighting with AI. Start directing it.</h4><p>Get the Master Key system, the specialized expert blueprints, the activation tools, and the AI Masterclass — then step into the Human Maximus ecosystem and start building capability you can actually use.</p><div class="maxess-cta-actions"><button type="button" class="maxess-cta-primary" id="maxessTreasureFree">Start My Free AI Masterclass <span class="button-arrow">→</span></button><button type="button" class="maxess-cta-secondary" id="maxessTreasureNaya">Meet Naya <span class="button-arrow">→</span></button></div><p class="maxess-cta-fine">No complicated setup. No scavenger hunt. Copy · paste · activate · follow the process.</p></div><div class="maxess-ecosystem"><img src="${logo}" alt="Human Maximus" loading="lazy"><span>Welcome to the Human Maximus ecosystem — where the goal is simple: master AI, become your MAX, and create more value in the world.</span></div></div>`;
              const actionFree=document.getElementById("freeTrialButton");
              const actionNaya=document.getElementById("enterNayaButton");
              offer.querySelector("#maxessTreasureFree").addEventListener("click",()=>{if(actionFree) actionFree.click();});
              offer.querySelector("#maxessTreasureNaya").addEventListener("click",()=>{if(actionNaya) actionNaya.click();});
              const resultActions=resultsView.querySelector(".result-actions");
              if(resultActions) resultActions.insertAdjacentElement("beforebegin",offer); else resultsView.appendChild(offer);
            };
            const waitForResults=()=>{const view=document.getElementById("resultsView");if(view&&view.classList.contains("visible"))run();};
            const observerTarget=document.getElementById("resultsView");
            if(observerTarget){new MutationObserver(waitForResults).observe(observerTarget,{attributes:true,attributeFilter:["class"]});}
            waitForResults();
          })();
          '''

          s = s.replace('</style>', css + '\n</style>', 1)
          s = s.replace('</body>', '<script>\n' + js + '\n</script>\n\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          print('patched', len(s), 'chars', s.count('\\n')+1, 'lines')
          PY

      - name: Validate HTML/JS markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('code').read_text(encoding='utf-8')
          checks=[
            'maxess-treasure',
            'maxess-expert-grid',
            'maxessTreasureFree',
            'maxessTreasureNaya',
            'maxess-legacy-hidden',
            'dimensionConstellation',
            'calculateResults',
            'function renderResults'
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, f'Missing markers: {missing}'
          assert s.count('</style>') == 1, 'Unexpected style tag count'
          assert s.count('</body>') == 1, 'Unexpected body tag count'
          assert s.count('</html>') == 1, 'Unexpected html tag count'
          print('AAA structural validation PASS')
          PY

      - name: Commit results build and remove one-time workflow
        run: |
          git config user.name "MAXESS Build Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- code .github/workflows/aaa-results-treasure.yml
          git rm .github/workflows/aaa-results-treasure.yml
          git commit -m "feat: elevate MAXESS results to AAA treasure experience"
          git push origin HEAD:maxess/aaa-results-treasure
