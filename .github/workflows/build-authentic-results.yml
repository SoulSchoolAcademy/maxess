name: Build Authentic MAXESS Results

on:
  push:
    branches:
      - maxess-results-authentic-rebuild
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build canonical single-document Results page
        run: node scripts/build-authentic-results.js

      - name: Verify build output
        run: |
          test -s MAXESS-RESULTS-AUTHENTIC-TOWER-BUILT.html
          grep -q 'NAYANET GROUND FLOOR' MAXESS-RESULTS-AUTHENTIC-TOWER-BUILT.html
          grep -q 'MAXESS' MAXESS-RESULTS-AUTHENTIC-TOWER-BUILT.html

      - name: Commit built artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MAXESS-RESULTS-AUTHENTIC-TOWER-BUILT.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Build canonical MAXESS Results tower with NayaNET ground floor'
            git push
          fi
