name: MAXESS Assessment → Results Handoff Audit

on:
  push:
    branches: [main, naya/maxess-results-aaa]
    paths:
      - code
      - .github/workflows/patch-assessment-results-handoff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify authoritative cross-domain handoff contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'MAXESS_9_5_CROSS_DOMAIN_HANDOFF' code
          grep -q 'results.nayanet.xyz' code
          grep -q 'responses: state.responses' code
          grep -q 'Object.fromEntries' code
          echo 'MAXESS Assessment → Results handoff contract: PASS'

      - name: Verify no workflow mutation authority
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'permissions:' .github/workflows/patch-assessment-results-handoff.yml && grep -q 'contents: write' .github/workflows/patch-assessment-results-handoff.yml; then
            echo 'Mutation authority detected in handoff audit workflow.'
            exit 1
          fi
          if grep -q 'git push' .github/workflows/patch-assessment-results-handoff.yml; then
            echo 'Self-mutating handoff workflow detected.'
            exit 1
          fi
          echo 'Read-only workflow guard: PASS'
