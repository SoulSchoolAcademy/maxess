name: MAXESS Assessment → Results Handoff Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify cross-domain handoff contract
        shell: bash
        run: |
          set -euo pipefail
          test -f code
          grep -q 'results.nayanet.xyz/?result=' code
          grep -q 'MAXESS-RESULTS-CONTRACT-1' code
          grep -q 'responses: state.responses' code
          node --check code
          echo 'ASSESSMENT → RESULTS HANDOFF AUDIT: PASS'
          echo 'This workflow is audit-only. It no longer mutates or pushes the assessment source.'
