name: MAXESS Results V14 Personalization

on:
  push:
    branches:
      - 'naya/results-personalization-v14'

permissions:
  contents: write

jobs:
  execute-personalization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute V14 personalization mutation
        run: python .naya/maxess-results-v14-personalization.py

      - name: Validate authoritative artifact
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('MAXESS-RESULTS-10-GROOVE.html')
          s = p.read_text(encoding='utf-8')
          required = [
              '<!-- MAXESS-RESULTS-V14-PERSONALIZATION -->',
              'maxess-personal-profile',
              'MAXESS_PROFILE',
              'maxess:profile-ready',
              'window.MAXESS_RESULT',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('V14 validation failed; missing: ' + ', '.join(missing))
          if len(s) < 350000:
              raise SystemExit(f'V14 validation failed; artifact unexpectedly small: {len(s)} bytes')
          print(f'V14 artifact validation passed: {len(s)} bytes')
          PY

      - name: Commit material artifact change
        run: |
          git config user.name 'Naya Master'
          git config user.email 'naya-master@users.noreply.github.com'
          git add -- MAXESS-RESULTS-10-GROOVE.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No material artifact change detected.'
            exit 1
          fi
          git commit -m 'MAXESS Results: add V14 personalized profile layer'
          git push origin HEAD:naya/results-personalization-v14

      - name: Emit execution proof
        run: |
          echo 'V14 EXECUTION COMPLETE'
          git log -1 --oneline
          git diff HEAD^ HEAD --stat
