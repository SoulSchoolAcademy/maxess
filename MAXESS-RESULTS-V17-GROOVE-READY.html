<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>MAXESS — Your AI Mastery Results</title>
<style>
:root{--bg:#050307;--panel:#0d0913;--text:#fff;--muted:rgba(255,255,255,.62);--soft:rgba(255,255,255,.42);--line:rgba(255,255,255,.12);--purple:#a66cff;--violet:#d9b8ff;--cyan:#50ddff;--gold:#f7d58c;--green:#51e2ad}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mxv17{min-height:100vh;background:radial-gradient(ellipse 80% 32% at 50% 0,rgba(166,108,255,.24),transparent 70%),linear-gradient(180deg,#10071a 0,#050307 28%,#030204 100%);overflow:hidden}.mxv17 *{box-sizing:border-box}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.2em;text-transform:uppercase;color:#d8b6ff}.hero{padding:34px 0 78px;text-align:center}.naya-intro{display:flex;justify-content:center;margin:0 auto 20px}.naya-card{display:flex;align-items:center;gap:15px;text-align:left;width:min(680px,100%);padding:13px 16px;border:1px solid rgba(201,145,255,.24);background:rgba(255,255,255,.045);border-radius:22px;box-shadow:0 18px 55px rgba(0,0,0,.24)}.naya-card img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.28);box-shadow:0 0 28px rgba(166,108,255,.25)}.naya-card strong{display:block;font-size:16px}.naya-card span{display:block;margin-top:3px;color:var(--muted);font-size:13px;line-height:1.4}.listen{margin-left:auto;white-space:nowrap;border:1px solid rgba(216,182,255,.35);background:rgba(166,108,255,.13);color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;font-size:11px;cursor:pointer}.listen:hover{background:rgba(166,108,255,.23)}.hero h1{font-size:clamp(42px,7vw,86px);line-height:.92;letter-spacing:-.065em;margin:30px auto 16px;max-width:900px}.hero h1 span{color:#cfa5ff}.hero-sub{max-width:680px;margin:auto;color:var(--muted);font-size:17px;line-height:1.65}.score-orb{width:min(500px,76vw);aspect-ratio:1;margin:42px auto 28px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(from 205deg,#ff4545,#ff9e4a 12%,#ffe56b 24%,#58e18b 37%,#50ddff 49%,#6472ff 63%,#a75bff 76%,#ff4fb7 90%,#ff4545);box-shadow:0 0 90px rgba(166,108,255,.3),0 0 180px rgba(80,220,255,.1);animation:spin 28s linear infinite}.score-orb:before{content:"";position:absolute;inset:3.5%;border-radius:50%;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.98),transparent 5%,rgba(255,255,255,.12) 12%,transparent 29%),radial-gradient(circle at 48% 54%,#28153f 0,#0b0712 57%,#020207 100%);box-shadow:inset 0 -70px 90px rgba(0,0,0,.72),inset 0 0 75px rgba(255,255,255,.09)}.score-orb:after{content:"";position:absolute;inset:9%;border:1px solid rgba(255,255,255,.32);border-radius:50%;box-shadow:0 0 35px rgba(255,255,255,.12),inset 0 0 40px rgba(255,255,255,.1)}.score-inner{position:relative;z-index:2;text-align:center}.score-inner strong{display:block;font-size:clamp(105px,16vw,190px);line-height:.78;letter-spacing:-.08em}.score-inner span{display:block;margin-top:20px;color:#d0a8ff;font-size:12px;font-weight:950;letter-spacing:.25em}.band{margin-top:10px;font-size:15px;font-weight:900}.hero-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 19px;border-radius:15px;text-decoration:none;font-weight:850;font-size:12px;border:1px solid var(--line);color:#fff;background:rgba(255,255,255,.05)}.cta.primary{background:linear-gradient(135deg,#a55cff,#6d2bd1);border-color:rgba(255,255,255,.18);box-shadow:0 14px 40px rgba(126,46,221,.25)}.section{padding:78px 0;border-top:1px solid rgba(255,255,255,.07)}.section-head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:30px}.section-head h2{font-size:clamp(34px,5vw,62px);line-height:.95;letter-spacing:-.055em;margin:8px 0 0}.section-head p{max-width:500px;color:var(--muted);line-height:1.6}.short{width:min(850px,100%);margin:auto;text-align:center}.quote{font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.04em}.quote strong{color:#d8b1ff}.note{color:var(--muted);line-height:1.65}.fingerprint{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}.radar{position:relative;width:min(520px,100%);margin:auto}.radar svg{display:block;width:100%;height:auto}.radar-center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.radar-center div{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:rgba(5,3,7,.88);border:1px solid rgba(255,255,255,.16);box-shadow:0 0 40px rgba(166,108,255,.18)}.radar-center b{font-size:36px}.radar-center span{margin-top:-35px;font-size:9px;color:var(--soft);letter-spacing:.16em;text-transform:uppercase}.dim-list{display:grid;gap:10px}.dim-row{padding:17px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035)}.dim-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.dim-top b{font-size:14px}.dim-top strong{font-size:18px}.bar{height:6px;margin-top:11px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;width:var(--w);height:100%;border-radius:inherit;background:linear-gradient(90deg,#7b3ce0,#d7b0ff,#50ddff)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:25px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018))}.card .num{color:#b989ff;font-size:10px;font-weight:950;letter-spacing:.15em}.card h3{font-size:22px;margin:9px 0}.card p{color:var(--muted);font-size:13px;line-height:1.6}.lever{margin-top:18px;padding:13px;border-radius:14px;background:rgba(166,108,255,.08);border:1px solid rgba(166,108,255,.16)}.lever span{display:block;color:#c99dff;font-size:9px;font-weight:950;letter-spacing:.14em}.lever b{display:block;margin-top:5px;font-size:12px;line-height:1.4}.contrast{display:grid;grid-template-columns:1fr 1fr;gap:14px}.contrast .card{min-height:240px}.chapter{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.step{padding:23px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.035)}.step b{display:block;color:#cfa5ff;font-size:10px;letter-spacing:.14em}.step h3{margin:10px 0 7px}.step p{margin:0;color:var(--muted);font-size:12px;line-height:1.55}.pathways{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.path{padding:20px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.035);transition:.2s}.path:hover{transform:translateY(-3px);border-color:rgba(216,182,255,.35);background:rgba(166,108,255,.07)}.path small{color:#a979ed;font-weight:950}.path h3{font-size:16px;margin:7px 0}.path p{color:var(--muted);font-size:12px;line-height:1.45;margin:0}.next{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.next .card{min-height:190px}.naya-end{padding:90px 0 100px;text-align:center}.naya-end-card{width:min(880px,100%);margin:auto;padding:48px 30px;border-radius:32px;border:1px solid rgba(201,145,255,.25);background:radial-gradient(ellipse 70% 80% at 50% 0,rgba(166,108,255,.15),transparent 70%),rgba(255,255,255,.03)}.naya-end img{width:88px;height:88px;object-fit:cover;border-radius:50%;border:1px solid rgba(255,255,255,.3);box-shadow:0 0 40px rgba(166,108,255,.2)}.naya-end h2{font-size:clamp(34px,5vw,58px);letter-spacing:-.05em;margin:18px 0 10px}.naya-end p{max-width:650px;margin:auto;color:var(--muted);line-height:1.65}.footer{padding:28px 0 50px;color:rgba(255,255,255,.35);text-align:center;font-size:10px;letter-spacing:.08em}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.cards,.pathways{grid-template-columns:repeat(2,1fr)}.chapter{grid-template-columns:repeat(2,1fr)}.fingerprint,.contrast{grid-template-columns:1fr}.section-head{display:block}.section-head p{margin-top:15px}}@media(max-width:620px){.wrap{width:min(100% - 24px,1180px)}.hero{padding-top:18px}.naya-card{align-items:flex-start}.naya-card img{width:50px;height:50px}.listen{margin-left:0}.naya-card{flex-wrap:wrap}.hero h1{font-size:clamp(42px,14vw,70px)}.score-orb{width:min(92vw,470px)}.cards,.pathways,.chapter,.next{grid-template-columns:1fr}.section{padding:56px 0}.hero-sub{font-size:15px}.hero-actions{flex-direction:column}.hero-actions .cta{width:100%}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.score-orb{animation:none}.path{transition:none}}
</style>
</head>
<body>
<div id="maxess-v17" class="mxv17"></div>
<script>
(function(){'use strict';
const NAYA='https://i.postimg.cc/dVXw7sRN/grok-image-f75a6f12-4e3a-4c99-a334-5684ba0f7401.jpg';
const pathways=[['Writing & Communication','Turn ideas into clear instructions, messages, stories, and decisions.'],['Research & Information','Find, compare, synthesize, and explain useful information.'],['Brainstorming & Ideas','Expand possibilities without losing the goal.'],['Content Creation','Create useful, human content faster and better.'],['Business & Strategy','Turn insight into positioning, offers, decisions, and plans.'],['Marketing & Sales','Make value understandable and action easier.'],['Learning & Education','Use AI as a tutor, curriculum designer, and thinking partner.'],['Coding & Software','Build, debug, explain, and improve software with AI.'],['Images & Visual Creation','Turn concepts into visual communication and creative assets.'],['Video & Media','Plan, script, edit, package, and distribute media.'],['Documents & Presentations','Transform raw thinking into polished deliverables.'],['Data & Analysis','Use evidence, structure, and models to make better decisions.'],['Productivity & Planning','Turn intention into organized execution.'],['Career & Professional Development','Build skills, positioning, confidence, and opportunity.'],['Personal Decision-Making','Think through choices with more clarity and less noise.'],['Creative Work','Explore, shape, and finish original creative work.'],['Automation & Systems','Connect repeatable work into reliable systems.'],['Advanced AI Work','Orchestrate models, agents, tools, context, and evaluation.']];
const demo={overallScore:82,band:'Advancing',dimensions:[{id:'1',name:'Direction',score:86},{id:'2',name:'Communication',score:91},{id:'3',name:'Evaluation',score:79},{id:'4',name:'Iteration',score:74},{id:'5',name:'Systems Thinking',score:68}]};
function readResult(){let r=window.MAXESS_RESULT;if(!r){try{const q=new URLSearchParams(location.search).get('result');if(q){let s=q.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';r=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));}}catch(e){}}if(!r&&new URLSearchParams(location.search).get('fixture')==='demo')r=demo;return r||demo;}
function clamp(n){return Math.max(0,Math.min(100,Number(n)||0));} function band(n){n=clamp(n);return n<=50?'Foundation':n<=75?'Developing':n<=90?'Advancing':'Mastering';} function escape(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function render(){const r=readResult();const score=Math.round(clamp(r.overallScore));const dims=(Array.isArray(r.dimensions)?r.dimensions:demo.dimensions).slice(0,5).map((d,i)=>({id:d.id||String(i+1),name:d.name||`Dimension ${i+1}`,score:Math.round(clamp(d.score))}));while(dims.length<5)dims.push({id:String(dims.length+1),name:`Dimension ${dims.length+1}`,score:0});const b=band(score);const sorted=[...dims].sort((a,b)=>b.score-a.score);const strong=sorted[0],lever=sorted[4];const angle=(i)=>-90+i*72;const pt=(i,val,rad=180)=>{const a=angle(i)*Math.PI/180,rr=rad*val/100;return `${250+Math.cos(a)*rr},${250+Math.sin(a)*rr}`};const poly=dims.map((d,i)=>pt(i,d.score)).join(' ');const rings=[20,40,60,80,100].map(v=>dims.map((_,i)=>pt(i,v)).join(' ')).map(p=>`<polygon points="${p}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>`).join('');const axes=dims.map((_,i)=>{const a=angle(i)*Math.PI/180;return `<line x1="250" y1="250" x2="${250+Math.cos(a)*180}" y2="${250+Math.sin(a)*180}" stroke="rgba(255,255,255,.08)"/>`;}).join('');const points=dims.map((d,i)=>{const a=angle(i)*Math.PI/180,rr=180*d.score/100;return `<circle cx="${250+Math.cos(a)*rr}" cy="${250+Math.sin(a)*rr}" r="6" fill="#fff" stroke="#a66cff" stroke-width="3"/>`;}).join('');const dimRows=dims.map((d,i)=>`<div class="dim-row"><div class="dim-top"><b>${String(i+1).padStart(2,'0')} · ${escape(d.name)}</b><strong>${d.score}</strong></div><div class="bar"><i style="--w:${d.score}%"></i></div></div>`).join('');const dimCards=dims.map((d,i)=>{const isStrong=d.id===strong.id,isLever=d.id===lever.id;const copy=isStrong?'This is currently one of your strongest AI capabilities. Use it as leverage rather than treating it as a finished skill.':isLever?'This is your largest current growth opportunity. Strengthening it can increase the value of everything else you already do.':'This capability is part of your current AI operating profile. The goal is deliberate practice, not chasing a perfect number.';const action=isStrong?'Turn this strength into reusable instructions, frameworks, and systems.':isLever?'Practice this dimension on one real workflow repeatedly until improvement becomes visible.':'Create a simple scorecard and improve one meaningful AI output at a time.';return `<article class="card"><span class="num">${String(i+1).padStart(2,'0')} · ${d.score}/100</span><h3>${escape(d.name)}</h3><p>${copy}</p><div class="lever"><span>${isStrong?'STRENGTH':isLever?'HIGHEST-LEVERAGE OPPORTUNITY':'LEVER'}</span><b>${action}</b></div></article>`;}).join('');const pathHtml=pathways.map((p,i)=>`<article class="path"><small>${String(i+1).padStart(2,'0')}</small><h3>${escape(p[0])}</h3><p>${escape(p[1])}</p></article>`).join('');const steps=[['01 · DIRECT','Know the outcome','Define what success looks like before AI begins.'],['02 · CREATE','Build the first version','Give AI enough context and direction to do useful work.'],['03 · SCORE','Judge the work','Use criteria instead of accepting the first answer.'],['04 · COMPOUND','Make it reusable','Turn successful work into a system you can repeat.']].map(s=>`<article class="step"><b>${s[0]}</b><h3>${s[1]}</h3><p>${s[2]}</p></article>`).join('');const text=`Hello. I'm Naya. I've looked at your MAXESS results. Your score is ${score} out of 100, placing you in the ${b} range. This isn't your judgment. It's your map. Your strongest dimension is ${strong.name} at ${strong.score}. Your biggest opportunity is ${lever.name} at ${lever.score}. The next step is to protect your strength, build your lever, and make quality repeatable. Your MAXESS result is a starting point for what you can do with AI next.`;
const html=`<section class="hero"><div class="wrap"><div class="naya-intro"><div class="naya-card"><img src="${NAYA}" alt="Naya, your MAXESS guide"><div><strong>Hi. I've looked at your results.</strong><span>I'm Naya, your guide. This isn't your judgment. It's your map.</span></div><button id="listenTop" class="listen" type="button">▶ Listen to Naya</button></div></div><div class="eyebrow">MAXESS · YOUR PERSONAL AI MASTERY REPORT</div><h1>Your AI Score is <span>${score}</span>.</h1><p class="hero-sub">Your score is the beginning, not the verdict. Here is the pattern behind it, what you already have working, where the leverage is, and what to do next.</p><div class="score-orb" aria-label="MAXESS AI Score ${score} out of 100"><div class="score-inner"><strong>${score}</strong><span>AI SCORE</span><div class="band">${b}</div></div></div><div class="hero-actions"><a class="cta primary" href="#fingerprint">See My Map ↓</a><a class="cta" href="#pathways">Explore My 18 Pathways →</a></div></div></section><section class="section"><div class="wrap short"><div class="eyebrow">THE SHORT VERSION</div><p class="quote">You already have something real. <strong>Your next leap is leverage.</strong></p><p class="note">The highest-value move is not simply learning more tools. It is becoming better at directing the work, judging the result, and turning what works into a repeatable system.</p></div></section><section id="fingerprint" class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">01 · YOUR FINGERPRINT</div><h2>See the pattern,<br>not just the score.</h2></div><p>Five dimensions show where your current capability is strong, where it is developing, and where improvement can create disproportionate upside.</p></div><div class="fingerprint"><div class="radar"><svg viewBox="0 0 500 500" role="img" aria-label="Five-dimension AI capability fingerprint">${rings}${axes}<polygon points="${poly}" fill="rgba(166,108,255,.20)" stroke="#d2a9ff" stroke-width="3"/>${points}</svg><div class="radar-center"><div><b>${score}</b><span>overall</span></div></div></div><div class="dim-list">${dimRows}</div></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">02 · WHAT IT MEANS</div><h2>Every score has<br>a job.</h2></div><p>A result becomes useful when you know what it means and what to do with it.</p></div><div class="cards">${dimCards}</div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">03 · YOUR ADVANTAGE</div><h2>What you already<br>have working.</h2></div></div><div class="contrast"><article class="card"><div class="eyebrow">NATURAL ADVANTAGE</div><h3>${escape(strong.name)}</h3><p>At ${strong.score}/100, this is the strongest signal in your current profile. It is something to build on, not something to stop developing.</p></article><article class="card"><div class="eyebrow">HIGHEST-LEVERAGE OPPORTUNITY</div><h3>${escape(lever.name)}</h3><p>At ${lever.score}/100, this is where deliberate improvement has the greatest potential to raise the usefulness of your whole AI workflow.</p></article></div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">04 · YOUR NEXT CHAPTER</div><h2>From capability<br>to compounding.</h2></div><p>Mastery is the ability to make strengths repeatable, measurable, and increasingly valuable.</p></div><div class="chapter">${steps}</div></div></section><section id="pathways" class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">05 · YOUR 18 AI PATHWAYS</div><h2>Don't learn AI.<br>Learn what AI can do for you.</h2></div><p>These are 18 capability doors. Explore the ones that matter most to your goals, then build depth instead of collecting tools.</p></div><div class="pathways">${pathHtml}</div></div></section><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">06 · TURN INSIGHT INTO GROWTH</div><h2>Know where you are.<br>Know what moves you.</h2></div><p>Protect the strength. Build the lever. Make progress repeatable.</p></div><div class="next"><article class="card"><div class="eyebrow">NEXT 01</div><h3>Protect your strength</h3><p>Use ${escape(strong.name)} as your directing advantage.</p></article><article class="card"><div class="eyebrow">NEXT 02</div><h3>Build your lever</h3><p>Practice ${escape(lever.name)} on one repeated workflow.</p></article><article class="card"><div class="eyebrow">NEXT 03</div><h3>Make quality visible</h3><p>Score every meaningful AI output before accepting it.</p></article></div></div></section><section class="naya-end"><div class="wrap"><div class="naya-end-card"><img src="${NAYA}" alt="Naya"><div class="eyebrow" style="margin-top:18px">PERSONALIZED REPORT</div><h2>You've seen the pattern.<br>Now hear what it means.</h2><p>Naya is your guide for turning the result into a practical conversation about where you are, where you can go, and what to do next.</p><button id="listenBottom" class="listen" style="margin-top:24px;padding:14px 20px" type="button">▶ Listen to Naya</button><div id="audioStatus" class="audio-status">Your result is ready. Choose Listen to Naya.</div></div></div></section><div class="footer">MAXESS · AI MASTERY RESULTS · ${score}/100 · ${b}</div>`;document.getElementById('maxess-v17').innerHTML=html;window.MAXESS_V17={score,dims,band:b,strong,lever};function speak(){if(!('speechSynthesis' in window)){document.getElementById('audioStatus').textContent='Speech preview is not available in this browser.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.94;u.pitch=1;u.onstart=()=>document.getElementById('audioStatus').textContent='Naya is speaking your report.';u.onend=()=>document.getElementById('audioStatus').textContent='Naya has finished your report.';speechSynthesis.speak(u)}['listenTop','listenBottom'].forEach(id=>document.getElementById(id)?.addEventListener('click',speak));}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
})();
</script>
</body>
</html>
