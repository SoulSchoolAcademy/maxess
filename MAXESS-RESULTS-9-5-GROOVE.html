<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030305"><title>MAXESS — Your AI Mastery Results</title><style>body{margin:0;background:#030305;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}.wrap{width:min(1240px,calc(100% - 34px));margin:auto}.top{min-height:62px;border-bottom:1px solid rgba(255,255,255,.11);background:rgba(3,3,5,.75);backdrop-filter:blur(18px);display:flex;align-items:center}.top .wrap{display:flex;justify-content:space-between}.brand{font-weight:950;letter-spacing:.15em}.brand i{font-style:normal;color:#dfc1ff}.status,.eyebrow{font-size:10px;font-weight:950;letter-spacing:.18em;text-transform:uppercase}.status{color:#918a99}.eyebrow{color:#dfc1ff}.hero{padding:clamp(65px,8vw,110px) 0 70px;background:radial-gradient(ellipse 100% 55% at 50% 0,rgba(196,100,255,.32),transparent 72%)}.hero-grid{display:grid;grid-template-columns:1fr .9fr;gap:70px;align-items:center}.hero h1{font-size:clamp(48px,7vw,90px);line-height:.9;letter-spacing:-.07em;margin:15px 0 25px}.hero h1 span{color:#dfc1ff}.lead{max-width:700px;color:#c7c0cd;font-size:18px;line-height:1.72}.score-wrap{display:grid;place-items:center}.score-ring{--score:0;width:min(390px,82vw);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from -90deg,#dfc1ff 0 calc(var(--score)*1%),rgba(255,255,255,.07) calc(var(--score)*1%) 100%);box-shadow:0 0 110px rgba(169,92,255,.23);position:relative}.score-ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 20%,#2b193b,#08070b 62%,#030305);border:1px solid rgba(255,255,255,.08)}.score-content{position:relative;text-align:center}.score{font-size:clamp(84px,10vw,132px);font-weight:950;letter-spacing:-.09em}.score-label{color:#918a99;font-size:10px;font-weight:950;letter-spacing:.2em}.score-band{margin-top:14px;color:#dfc1ff;font-size:12px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.section{padding:clamp(72px,9vw,110px) 0}.alt{background:linear-gradient(180deg,transparent,rgba(255,255,255,.018),transparent)}.head{max-width:850px;margin-bottom:38px}.head h2{font-size:clamp(37px,5.3vw,72px);line-height:.96;letter-spacing:-.06em;margin:10px 0}.head p,.card p{color:#aaa4b1;line-height:1.7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{border:1px solid rgba(255,255,255,.11);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.058),rgba(255,255,255,.014));box-shadow:0 28px 90px rgba(0,0,0,.45)}.identity{padding:44px;min-height:330px}.identity h3{font-size:clamp(38px,4.8vw,64px);line-height:.94;letter-spacing:-.06em;margin:16px 0}.stats{padding:18px;display:grid;gap:12px}.stat{padding:22px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:#07070a}.stat small{color:#8d8794;font-size:9px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.stat strong{display:block;margin-top:7px;font-size:25px}.visual{padding:30px}.radar{width:100%;height:auto}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.legend div{padding:12px 6px;text-align:center;border-top:1px solid rgba(255,255,255,.11)}.legend b{font-size:12px}.legend span{display:block;color:#dfc1ff;font-size:20px;margin-top:5px}.dims{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dim{padding:23px;border:1px solid rgba(255,255,255,.11);border-radius:20px;background:rgba(255,255,255,.025)}.dimtop{display:flex;justify-content:space-between;font-weight:900}.dimtop b{color:#dfc1ff}.bar{height:7px;border-radius:99px;background:#ffffff10;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;width:calc(var(--v)*1%);background:linear-gradient(90deg,#6f2fd5,#d19bff);border-radius:99px}.reveal{padding:55px;border-radius:34px;border:1px solid rgba(184,149,255,.22);background:radial-gradient(circle at 50% 0,rgba(138,92,255,.14),transparent 58%),linear-gradient(145deg,rgba(138,92,255,.06),rgba(255,255,255,.018))}.reveal h3{font-size:clamp(38px,5.2vw,68px);line-height:.97;letter-spacing:-.06em;margin:12px 0}.reveal hr{width:90px;margin:30px 0;border:0;border-top:2px solid #dfc1ff}.path{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.path article{padding:28px;min-height:235px;border:1px solid rgba(255,255,255,.11);border-radius:24px;background:rgba(255,255,255,.025)}.path small{color:#dfc1ff;font-weight:950;letter-spacing:.16em}.path h3{font-size:30px;letter-spacing:-.04em}.audio{padding:52px;border-radius:34px;border:1px solid rgba(184,149,255,.25);background:radial-gradient(circle at 50% 0,rgba(169,92,255,.16),transparent 60%),linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));text-align:center;box-shadow:0 28px 90px rgba(0,0,0,.48)}.audio h2{font-size:clamp(38px,5vw,64px);line-height:.96;letter-spacing:-.055em;margin:18px 0}.tier{color:#dfc1ff;font-size:12px;font-weight:950;letter-spacing:.18em;text-transform:uppercase}.listen{min-width:min(540px,100%);min-height:74px;margin-top:22px;padding:2px;border:0;border-radius:21px;background:linear-gradient(135deg,#fff6ff,#d8a7ff 13%,#8b42ef 42%,#43128e 68%,#e9c4ff);color:#fff;font-weight:950;box-shadow:0 18px 55px rgba(91,31,171,.35)}.listen span{display:flex;align-items:center;justify-content:center;gap:12px;height:100%;padding:0 28px;border-radius:19px;background:linear-gradient(145deg,#25202a,#09080b)}.audio-status{min-height:22px;margin-top:14px;color:#8f8997;font-size:12px}.naya{padding:90px 0 0;border-top:1px solid rgba(255,255,255,.08);background:radial-gradient(ellipse 80% 35% at 50% 0,rgba(196,100,255,.12),transparent 70%)}.nayahead{text-align:center;max-width:850px;margin:0 auto 35px}.nayahead h2{font-size:clamp(42px,6vw,80px);line-height:.95;letter-spacing:-.06em;margin:12px 0}.frame{width:100%;padding:3px;border-radius:23px;background:linear-gradient(135deg,rgba(255,255,255,.68),rgba(194,135,255,.68) 18%,rgba(93,32,175,.65) 48%,rgba(255,255,255,.25) 76%,rgba(132,70,230,.60));box-shadow:0 15px 45px rgba(0,0,0,.74),0 25px 90px rgba(71,17,142,.3)}#nayanet{min-height:900px;border-radius:20px;overflow:hidden;background:#030305}.loading{text-align:center;padding:80px 20px;color:#aaa4b1}.end{text-align:center;padding:70px 0;color:#6f6876;font-size:10px;letter-spacing:.12em;text-transform:uppercase}@media(max-width:900px){.hero-grid,.grid2,.dims{grid-template-columns:1fr}.path{grid-template-columns:1fr 1fr}.hero{text-align:center}.lead{margin:auto}}@media(max-width:600px){.wrap{width:calc(100% - 22px)}.status{display:none}.hero{padding:55px 0 35px}.section{padding:65px 0}.identity{padding:30px}.visual{padding:18px}.path{grid-template-columns:1fr}.reveal{padding:35px 24px}.audio{padding:34px 18px}.legend{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="top"><div class="wrap"><div class="brand">MAXESS <i>AI MASTERY</i></div><div class="status">YOUR PERSONAL RESULTS</div></div></div><main id="results"></main><section class="naya"><div class="wrap"><div class="nayahead"><div class="eyebrow">THE FINAL EXPERIENCE</div><h2>Now, meet Naya.</h2><p style="color:#aaa4b1;font-size:17px;line-height:1.6">You’ve seen your pattern. You’ve seen your opportunity. Now experience the NayaNET world that comes next.</p></div><div class="frame"><div id="nayanet"><div class="loading">Loading the original NayaNET experience…</div></div></div><div class="end">MAXESS • NayaNET • Serve humans. Think deeply. Build beautifully.</div></div></section><script>
(()=>{const K='MAXESS_RESULT';const get=()=>{let r=window.MAXESS_RESULT;try{r=r||JSON.parse(sessionStorage.getItem(K)||'null')}catch(e){}try{r=r||JSON.parse(localStorage.getItem(K)||'null')}catch(e){}if(!r){const q=new URLSearchParams(location.search),s=Number(q.get('score'));if(Number.isFinite(s))r={overall:s}}return r||{overall:0,dimensions:{}}};const clamp=v=>Math.max(0,Math.min(100,Math.round(Number(v)||0)));function model(r){const score=clamp(r.overall??r.score),n=['Direction','Communication','Evaluation','Iteration','Systems Thinking'],d=r.dimensions||r.dimensionScores||{},v=n.map((x,i)=>clamp(d[x]??d[x.toLowerCase().replaceAll(' ','_')]??(Array.isArray(r.dimensionScores)?r.dimensionScores[i]:score)));const band=score<=50?'Foundation':score<=75?'Developing':score<=90?'Advancing':'Mastering',hi=v.indexOf(Math.max(...v)),lo=v.indexOf(Math.min(...v));return{score,n,v,band,hi,lo}}function explain(n,s){const L=s<=50?0:s<=75?1:s<=90?2:3;const M={Direction:['Start by defining outcomes, constraints and what success means.','Make the destination and boundaries explicit.','Turn planning into repeatable leverage.','Use outcomes, constraints and success criteria as a force multiplier.'],Communication:['Add context, intent and specificity.','Structure your instructions and give AI useful context.','Direct complex work with increasing precision.','Communicate with exceptional clarity, context and precision.'],Evaluation:['Learn to judge output systematically.','Use scorecards and comparison criteria.','Turn judgment into repeatable quality control.','Use evidence, scorecards and iteration to drive exceptional quality.'],Iteration:['Treat the first answer as material to improve.','Give targeted feedback and repeat.','Use deliberate revision loops.','Make iteration a disciplined production system.'], 'Systems Thinking':['Connect individual tasks into workflows.','Move from prompts toward repeatable processes.','Connect tasks, tools and decisions.','Turn successful work into scalable systems and leverage.']};return M[n][L]}function steps(n){return({Direction:[['Define the outcome','Write the result you actually want.'],['Add constraints','Give AI boundaries, audience and definition of good.'],['Score the result','Judge the answer against that definition.']],Communication:[['Clarify intent','State goal, audience and desired outcome.'],['Add context','Give AI the information it needs.'],['Direct the format','Specify structure, tone, depth and constraints.']],Evaluation:[['Create a scorecard','Define excellent before judging.'],['Compare alternatives','Evaluate options and trade-offs.'],['Refine deliberately','Improve using the scorecard.']],Iteration:[['Expect version one','The first answer is raw material.'],['Give targeted feedback','Name what is weak, missing or unnecessary.'],['Repeat until strong','Create → Score → Improve → Repeat.']], 'Systems Thinking':[['Map the workflow','See the whole process, not one prompt.'],['Connect the pieces','Place AI, people, tools and decisions.'],['Make it repeatable','Turn success into a reusable system.']]})[n]}function radar(v){let c=350,y=255,R=185,p=v.map((x,i)=>{let a=-Math.PI/2+i*Math.PI*2/5;return[c+Math.cos(a)*R*x/100,y+Math.sin(a)*R*x/100]}),g='';for(let k=1;k<5;k++){let q=[];for(let i=0;i<5;i++){let a=-Math.PI/2+i*Math.PI*2/5;q.push(`${c+Math.cos(a)*R*k/4},${y+Math.sin(a)*R*k/4}`)}g+=`<polygon points="${q.join(' ')}" fill="none" stroke="rgba(255,255,255,.09)"/>`}return`<svg class="radar" viewBox="0 0 700 520" role="img" aria-label="MAXESS five-dimension fingerprint">${g}<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="rgba(169,92,255,.18)" stroke="#dfc1ff" stroke-width="3"/>${p.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="6" fill="#fff" stroke="#a95cff" stroke-width="4"/>`).join('')}</svg>`}function render(r){let x=model(r),{score,n,v,band,hi,lo}=x,s=n[hi],w=n[lo],st=steps(w),profile=score<=50?'You are building your AI foundation. Your next leap is learning the thinking patterns that make AI useful.':score<=75?'You are developing real AI capability. Your next leap is becoming more deliberate about quality and repeatability.':score<=90?'You are advancing into strategic AI use. Your next level is turning strong skills into systems and leverage.':'You are operating at a mastery level. Your next challenge is multiplying your capability through systems, teaching and leverage.';document.getElementById('results').innerHTML=`<section class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">YOUR MAXESS RESULTS</div><h1>This is how<br><span>you work with AI.</span></h1><p class="lead">MAXESS is here to show the pattern behind your number — where you already have leverage, where your next breakthrough lives, and what to do with it.</p></div><div class="score-wrap"><div class="score-ring" style="--score:${score}"><div class="score-content"><div class="score">${score}</div><div class="score-label">MAXESS SCORE</div><div class="score-band">${band}</div></div></div></div></div></section><section class="section alt"><div class="wrap"><div class="head"><div class="eyebrow">YOUR PROFILE</div><h2>${band}. This is your starting point.</h2><p>${profile}</p></div><div class="grid2"><article class="card identity"><div class="eyebrow">YOUR STRONGEST SIGNAL</div><h3>${s}</h3><p>${explain(s,v[hi])}</p></article><div class="card stats"><div class="stat"><small>Strongest dimension</small><strong>${s} · ${v[hi]}</strong><p>Your greatest current leverage point.</p></div><div class="stat"><small>Next opportunity</small><strong>${w} · ${v[lo]}</strong><p>The capability with the most room to unlock additional leverage.</p></div><div class="stat"><small>Level</small><strong>${band}</strong><p>Your score selects the matching Naya report.</p></div></div></div></div></section><section class="section"><div class="wrap"><div class="head"><div class="eyebrow">YOUR AI FINGERPRINT</div><h2>Five capabilities. One pattern.</h2><p>There is no perfect shape. The value is seeing where your capabilities reinforce one another — and where one improvement can lift the whole system.</p></div><div class="card visual">${radar(v)}<div class="legend">${n.map((z,i)=>`<div><b>${z}</b><span>${v[i]}</span></div>`).join('')}</div></div></div></section><section class="section alt"><div class="wrap"><div class="head"><div class="eyebrow">THE FIVE DIMENSIONS</div><h2>Here is what each signal means.</h2></div><div class="dims">${n.map((z,i)=>`<article class="dim"><div class="dimtop"><span>${z}</span><b>${v[i]}</b></div><div class="bar"><i style="--v:${v[i]}"></i></div><p>${explain(z,v[i])}</p></article>`).join('')}</div></div></section><section class="section"><div class="wrap"><div class="head"><div class="eyebrow">THE “OH… THAT’S WHY” MOMENT</div><h2>Your strength is <span style="color:#dfc1ff">${s}</span>. Your next unlock is <span style="color:#dfc1ff">${w}</span>.</h2><p>${explain(s,v[hi])} The strategic move is not to become equally good at everything. Use what is strong to pull the next capability upward.</p></div><div class="reveal"><div class="eyebrow">YOUR PERSONAL LEVERAGE</div><h3>Improve the right thing — not everything.</h3><hr><p>Your ${w} score is the clearest opportunity in this result. Raising that capability can make the rest of your AI workflow more effective.</p></div></div></section><section class="section alt"><div class="wrap"><div class="head"><div class="eyebrow">YOUR NEXT LEVEL</div><h2>Three moves. One pathway.</h2><p>Simple enough to use. Specific enough to matter.</p></div><div class="path">${st.map((a,i)=>`<article><small>STEP 0${i+1} • ${w.toUpperCase()}</small><h3>${a[0]}</h3><p>${a[1]}</p></article>`).join('')}</div><div class="reveal" style="margin-top:18px;padding:28px;text-align:center"><b>KNOW → TELL → ASK → CREATE → SCORE → IMPROVE → REPEAT</b></div></div></section><section class="section alt"><div class="wrap"><div class="audio"><div class="eyebrow">🎧 NAYA PERSONAL REPORT</div><h2>Listen to your results.</h2><p style="color:#aaa4b1;line-height:1.7;max-width:760px;margin:auto">Naya will walk you through your MAXESS result, your strongest capability, your opportunity and your next level.</p><div class="tier" style="margin-top:22px">${band} • ${score}/100</div><button class="listen" id="listen"><span><b>▶</b> Naya — Listen to Your Report</span></button><div class="audio-status" id="audioStatus">${band} report selected. The four Naya recordings will be connected when produced.</div></div></div></section>`;document.getElementById('listen').onclick=()=>document.getElementById('audioStatus').textContent=`Naya report selected: ${band}. Audio asset not yet published — ready for the ${band} recording.`}render(get());fetch('https://raw.githubusercontent.com/SoulSchoolAcademy/maxess/main/nayanetpagecode',{cache:'no-store'}).then(r=>r.json()).then(o=>{let raw=atob(o.content.replace(/\n/g,'')),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0)),html=new TextDecoder().decode(bytes);const host=document.getElementById('nayanet');host.innerHTML=html;host.querySelectorAll('script').forEach(s=>{let n=document.createElement('script');if(s.src)n.src=s.src;else n.textContent=s.textContent;document.body.appendChild(n);s.remove()})}).catch(()=>document.getElementById('nayanet').innerHTML='<div class="loading">The original NayaNET source could not be loaded. Results remain available above.</div>');})();
</script></body></html>
