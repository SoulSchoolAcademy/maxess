(()=>{'use strict';const root=document.getElementById('maxess-results-10'),q=new URLSearchParams(location.search);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Math.max(0,Math.min(100,Number(v)||0));let r=window.MAXESS_RESULT||null;try{const e=q.get('result');if(e){let x=e.replace(/-/g,'+').replace(/_/g,'/');while(x.length%4)x+='=';const b=atob(x),u=Uint8Array.from(b,c=>c.charCodeAt(0));r=JSON.parse(new TextDecoder().decode(u))}}catch(e){console.warn('MAXESS_RESULT decode failed',e)}if(!r&&q.get('fixture')==='demo')r={overallScore:82,profile:{name:'Alex Morgan',title:'AI Builder'},dimensions:[{name:'Direction',score:86},{name:'Communication',score:91},{name:'Evaluation',score:79},{name:'Iteration',score:74},{name:'Systems Thinking',score:68}]};window.MAXESS_RESULT=r;if(!r){root.innerHTML='<section class="sec final"><div class="wrap"><h1 class="h2">Your MAXESS result is not available yet.</h1><p>Complete the assessment or provide the production Result Contract. No score is manufactured in production.</p></div></section>';return}const names=['Direction','Communication','Evaluation','Iteration','Systems Thinking'],colors=['#ff9638','#ffd447','#36dd91','#45a4ff','#8b4dff'];let ds=(Array.isArray(r.dimensions)?r.dimensions:[]).slice(0,5).map((d,i)=>({name:d.name||names[i],score:n(d.score??d.value),insight:d.insight||d.description||'',lever:d.lever||''}));while(ds.length<5)ds.push({name:names[ds.length],score:0});const overall=n(r.overallScore??r.score??ds.reduce((a,d)=>a+d.score,0)/5),profile=r.profile||r.personalProfile||{},name=profile.name||r.name||'Your Profile',title=profile.title||profile.role||'MAXESS Participant',company=profile.company||'',avatar=profile.avatar||profile.avatarUrl||'https://i.postimg.cc/d1nncN9F/Naya-and-shawn-ok-44-a.png',band=overall>=91?'Mastering':overall>=76?'Advancing':overall>=51?'Developing':'Foundation';const defs={Direction:['You tend to know what you want AI to accomplish.','Define the outcome and success test before the work begins.'],Communication:['You are strong at expressing context, intent and human outcome.','Turn that strength into reusable briefs, instructions and decision frameworks.'],Evaluation:['You can recognize useful work, with room to make judgment more deliberate.','Use a visible scorecard before accepting important output.'],Iteration:['You understand that strong work improves through refinement.','Make create → score → improve → repeat explicit.'],Systems:['You can see connections between repeated work and bigger outcomes.','Turn repeated work into reusable workflows, rules and systems.']};const info=d=>d.insight||defs[d.name.includes('Systems')?'Systems':d.name][0]||defs.Direction[0],lev=d=>d.lever||defs[d.name.includes('Systems')?'Systems':d.name][1]||defs.Direction[1];const top=[...ds].sort((a,b)=>b.score-a.score)[0];const weights={Direction:1,Communication:.95,Evaluation:1.2,Iteration:1.15,'Systems Thinking':1.3};const biggest=[...ds].sort((a,b)=>(100-b.score)*(weights[b.name]||1)-(100-a.score)*(weights[a.name]||1))[0];const masters=[['Writing & Communication','Write clearly.'],['Research & Information','Find the signal.'],['Brainstorming & Ideas','Generate possibilities.'],['Content Creation','Create useful content.'],['Business & Strategy','Think strategically.'],['Marketing & Sales','Turn value into action.'],['Learning & Education','Learn intelligently.'],['Coding & Software','Build and debug.'],['Images & Visual Creation','Make ideas visible.'],['Video & Media','Create media.'],['Audio & Music','Shape sound.'],['Data & Analysis','Work with evidence.'],['Productivity & Organization','Organize execution.'],['Career & Professional Growth','Build capability.'],['Decision Making','Choose with clarity.'],['Creative Development','Create original work.'],['Systems & Automation','Build reusable systems.'],['AI Orchestration','Coordinate AI at scale.']];const matches=['Writing & Communication','Business & Strategy','Content Creation','Marketing & Sales','Video & Media','Decision Making','Systems & Automation','AI Orchestration'];root.innerHTML=`<section class="sec hero"><div class="tools"><button class="tool" id="print">Print / Save PDF</button></div><div class="wrap hero-in"><div class="ey">MAXESS AI MASTERY ASSESSMENT</div><div class="orb" role="img" aria-label="Your MAXESS AI score is ${Math.round(overall)} out of 100"><div class="score"><strong>${Math.round(overall)}</strong><span>YOUR AI SCORE · OUT OF 100</span></div></div><div class="band">${band}</div><div><a class="btn" href="#profile">See Your Report ↓</a></div></div></section><section class="sec light" id="profile"><div class="wrap"><div class="profile-card"><img class="avatar" src="${esc(avatar)}" alt="${esc(name)} profile"><div><div class="pk">PERSONAL PROFILE</div><div class="pn">${esc(name)}</div><div class="pm">${esc(title)}${company?' · '+esc(company):''}</div></div><button class="nb" id="naya">Naya is reading your report</button></div><div class="naya"><p>Hi ${esc(name.split(' ')[0])}. <strong>I can see a real pattern here.</strong> Your strongest signal is ${esc(top.name)}, while your highest-leverage opportunity is ${esc(biggest.name)}. I'm going to show you why — and what I'd do next.</p><small>This interpretation consumes MAXESS_RESULT. The Results layer does not recalculate your assessment.</small></div></div></section><section class="sec report"><div class="wrap"><div class="grid2"><div><div class="ch"><i>01</i> YOUR REPORT</div><h2 class="h2">The number tells you where. The report tells you why.</h2></div><p class="sub">Your result becomes useful when it becomes a story: what is working, how the dimensions connect, where improvement has the greatest leverage, and what to do next.</p></div><div class="quote">You are not trying to become <em>“good at AI.”</em><br>You are learning how to make AI work better for you.</div></div></section><section class="sec dims" id="dimensions"><div class="wrap"><div class="dimhead"><div><div class="ch"><i>02</i> FIVE DIMENSIONS</div><h2 class="h2">Your capability has shape.</h2></div><p>Five dimensions give the score evidence. Read the instruments first. Then read the meaning and lever.</p></div><div class="dgrid">${ds.map((d,i)=>`<article class="dim"><div class="ring" style="--score:${d.score};--g:${colors[i]}"><b>${Math.round(d.score)}</b></div><h3>${esc(d.name)}</h3><p>${esc(info(d))}</p><div class="lever"><span>LEVER</span><b>${esc(lev(d))}</b></div></article>`).join('')}</div></div></section><section class="sec pattern"><div class="wrap"><div class="ch"><i>03</i> YOUR PATTERN</div><div class="grid2"><h2 class="h2">See the pattern, not just the score.</h2><p class="sub">Together, your five dimensions describe how you direct, express, judge, improve and connect your AI work.</p></div><div class="pmap">${ds.map((d,i)=>`<div class="node"><b>${esc(d.name)}</b><strong>${Math.round(d.score)}</strong><small>${['Direct','Express','Judge','Improve','Connect'][i]}</small></div>`).join('')}</div></div></section><section class="sec story"><div class="wrap"><div class="ch"><i>04</i> YOUR STRONGEST SIGNAL</div><h2 class="h2">Start with what you already do well.</h2><div class="card"><div class="sk">PERSONALIZED STRONGEST SIGNAL</div><div class="st">${esc(top.name)}</div><p class="sc">At ${Math.round(top.score)}, ${esc(top.name)} is the clearest strength in your current profile. Use it as a force multiplier for the rest of your AI practice.</p><div class="sm"><strong>${Math.round(top.score)}</strong> / 100 · strongest current signal</div></div></div></section><section class="sec biglever" id="lever"><div class="wrap"><div class="lg"><div><div class="ch"><i>05</i> YOUR BIGGEST LEVER</div><div class="ls">${Math.round(biggest.score)}<small>${esc(biggest.name)} · opportunity</small></div></div><div><h2>Improve the thing that can improve the system.</h2><p>${esc(biggest.name)} is not a deficit label. It is the clearest high-leverage opportunity in the current profile, weighted for how much improvement could affect the wider system.</p><div class="ba"><div><b>FROM</b><span>More effort than necessary</span><small>Repeated work, inconsistent quality, or unclear handoffs.</small></div><div><b>TO</b><span>Reusable advantage</span><small>A deliberate process that makes better results easier to repeat.</small></div></div></div></div></div></section><section class="sec next"><div class="wrap"><div class="ch"><i>06</i> YOUR NEXT MOVE</div><h2 class="h2">One clear path forward.</h2><div class="steps"><div class="step"><b>01 · KNOW</b><h3>Know the outcome</h3><p>Decide what success means before AI begins.</p></div><div class="step"><b>02 · TELL</b><h3>Give the context</h3><p>Share information, constraints and standards that matter.</p></div><div class="step"><b>03 · CREATE</b><h3>Build the first version</h3><p>Make something real enough to judge and improve.</p></div><div class="step"><b>04 · SCORE</b><h3>Verify the outcome</h3><p>Score the work. Improve it. Repeat until it earns the result.</p></div></div></div></section><section class="sec masters"><div class="wrap"><div class="ch"><i>07</i> YOUR 18 NAYA MASTERS</div><div class="grid2"><h2 class="h2">18 specialist paths.<br>One personalized direction.</h2><p class="sub">These are capability paths, not a wall of tools. Strong matches are highlighted from your current profile and leverage.</p></div><div class="mg">${masters.map((m,i)=>`<article class="master ${matches.includes(m[0])||m[0].toLowerCase().includes(biggest.name.split(' ')[0].toLowerCase())?'rec':''}" style="--g:${colors[i%5]}"><b>${String(i+1).padStart(2,'0')}</b><strong>Naya ${esc(m[0])}</strong><span>${esc(m[1])}</span></article>`).join('')}</div></div></section><section class="sec system" id="system"><div class="wrap"><div class="ch"><i>08</i> THE SYSTEM</div><h2 class="h2">Your report is the beginning.</h2><div class="syscard"><p>Naya interprets. The report explains. Dimensions provide
