<!-- MAXESS RESULTS V4 — refined section-by-section execution -->
<style id="maxess-results-v4-refinement">
#maxess-results-10{--v4-bg:#030305;--v4-white:#fff;--v4-soft:rgba(255,255,255,.72);--v4-line:rgba(255,255,255,.12);--v4-purple:#9b63ff;--v4-cyan:#4fe4ff;--v4-green:#42dc99;--v4-yellow:#ffd65a;--v4-orange:#ff9c45;--v4-blue:#4d9dff;--v4-magenta:#ed5bd4}

#maxess-results-10 #your-fingerprint .mx-list-row strong{color:#6739ae!important}

#maxess-results-10 .mx-dim{--g:var(--v4-purple);position:relative!important;min-height:330px!important;border-radius:28px!important;background:linear-gradient(160deg,#0b0b10,#15111c)!important;border:1px solid rgba(255,255,255,.13)!important;box-shadow:inset 0 1px rgba(255,255,255,.12),0 26px 70px rgba(0,0,0,.38)!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;align-items:center!important;text-align:center!important;padding:24px 18px!important}
#maxess-results-10 .mx-dim:nth-child(1){--g:var(--v4-orange)}#maxess-results-10 .mx-dim:nth-child(2){--g:var(--v4-yellow)}#maxess-results-10 .mx-dim:nth-child(3){--g:var(--v4-green)}#maxess-results-10 .mx-dim:nth-child(4){--g:var(--v4-blue)}#maxess-results-10 .mx-dim:nth-child(5){--g:var(--v4-purple)}
#maxess-results-10 .mx-dim::before{content:"";position:absolute;top:20px;left:50%;width:154px;height:154px;transform:translateX(-50%);border-radius:50%;background:conic-gradient(var(--g) calc(var(--score,0)*1%),rgba(255,255,255,.08) 0);filter:drop-shadow(0 0 15px color-mix(in srgb,var(--g) 38%,transparent))}
#maxess-results-10 .mx-dim::after{content:"";position:absolute;top:32px;left:50%;width:130px;height:130px;transform:translateX(-50%);border-radius:50%;background:#0b0b10;box-shadow:inset 0 0 24px rgba(0,0,0,.75)}
#maxess-results-10 .mx-dim-head{position:relative!important;z-index:2!important;margin-top:52px!important;display:flex!important;flex-direction:column!important;align-items:center!important;gap:6px!important}
#maxess-results-10 .mx-dim-head strong{font-size:44px!important;line-height:1!important;color:var(--g)!important;text-shadow:0 0 22px color-mix(in srgb,var(--g) 30%,transparent)!important}
#maxess-results-10 .mx-dim-head h3{color:#fff!important;font-size:17px!important}
#maxess-results-10 .mx-dim .mx-track{position:relative!important;z-index:2!important;width:82%!important;height:7px!important;margin:17px 0 12px!important;background:rgba(255,255,255,.08)!important}
#maxess-results-10 .mx-dim .mx-track span{background:var(--g)!important;box-shadow:0 0 16px color-mix(in srgb,var(--g) 42%,transparent)!important}
#maxess-results-10 .mx-dim p,#maxess-results-10 .mx-lever{position:relative!important;z-index:2!important}
#maxess-results-10 .mx-lever{width:100%!important;margin-top:auto!important}
#maxess-results-10 .mx-lever span{color:var(--g)!important}
#maxess-results-10 .mx-lever b{color:#fff!important}
#maxess-results-10 #your-strengths,#maxess-results-10 #biggest-lever{background:#fff!important;color:#111!important}
#maxess-results-10 #your-strengths .mx-section-head h2,#maxess-results-10 #biggest-lever .mx-section-head h2{color:#111!important}
#maxess-results-10 #your-strengths .mx-section-head p,#maxess-results-10 #biggest-lever .mx-section-head p{color:#3b3b42!important}
#maxess-results-10 #your-strengths .mx-panel,#maxess-results-10 #biggest-lever .mx-panel{background:#fff!important;border-color:rgba(0,0,0,.1)!important;box-shadow:0 24px 70px rgba(20,10,35,.10)!important;color:#111!important}
#maxess-results-10 #your-strengths .mx-panel h3,#maxess-results-10 #biggest-lever .mx-panel h3{color:#111!important}
#maxess-results-10 #your-strengths .mx-panel p,#maxess-results-10 #biggest-lever .mx-panel p{color:#45454c!important}
#maxess-results-10 #your-next-move{background:linear-gradient(180deg,#07050a,#12081a)!important}
#maxess-results-10 #your-next-move .mx-step{background:rgba(255,255,255,.045)!important;border-color:rgba(255,255,255,.12)!important}
#maxess-results-10 #growth-scorecard .mx-growth-cta,#maxess-results-10 #growth-scorecard .mx-micro{display:none!important}
#maxess-results-10 #naya-masters{background:linear-gradient(180deg,#07050a,#14091d)!important}
#maxess-results-10 #naya-masters .naya-presence{margin-bottom:28px}
#maxess-results-10 #naya-playground{background:linear-gradient(135deg,#160a24,#050507 72%)!important}
#maxess-results-10 .naya-final-solution{margin-top:0}
#maxess-results-10 .naya-presence{border-radius:24px!important}
#maxess-results-10 .naya-avatar{width:64px!important;height:64px!important;border-radius:50%!important;object-fit:cover!important;border:2px solid rgba(255,255,255,.62)!important;box-shadow:0 0 0 5px rgba(155,99,255,.08),0 12px 30px rgba(0,0,0,.20)!important}
#maxess-results-10 .naya-speaking .naya-avatar{box-shadow:0 0 0 6px rgba(155,99,255,.13),0 0 34px rgba(155,99,255,.34),0 12px 30px rgba(0,0,0,.2)!important}
@keyframes v4orb{0%,100%{transform:scale(1);filter:saturate(1) brightness(1)}50%{transform:scale(1.022);filter:saturate(1.15) brightness(1.06)}}
@media print{
 @page{size:letter;margin:.55in}
 html,body{background:#fff!important;color:#111!important}
 #maxess-results-10{background:#fff!important;color:#111!important;width:100%!important;margin:0!important}
 #maxess-results-10 .mx-section,#maxess-results-10 #naya-report,#maxess-results-10 #your-fingerprint,#maxess-results-10 #your-strengths,#maxess-results-10 #biggest-lever,#maxess-results-10 #your-next-move,#maxess-results-10 #naya-masters{background:#fff!important;color:#111!important;padding:26px 0!important;break-inside:avoid!important}
 #maxess-results-10 h1,#maxess-results-10 h2,#maxess-results-10 h3,#maxess-results-10 strong,#maxess-results-10 b{color:#111!important;-webkit-text-fill-color:#111!important;text-shadow:none!important}
 #maxess-results-10 p,#maxess-results-10 .mx-copy,#maxess-results-10 .mx-section-head p,#maxess-results-10 .mx-dim p,#maxess-results-10 .mx-lever b{color:#333!important}
 #maxess-results-10 .mx-hero{min-height:auto!important;background:#fff!important;padding:20px 0 30px!important}
 #maxess-results-10 .mx-score-orb{width:230px!important;min-width:0!important;background:#f3f3f5!important;box-shadow:none!important;animation:none!important}
 #maxess-results-10 .mx-score strong{font-size:90px!important;background:none!important;color:#111!important;-webkit-text-fill-color:#111!important}
 #maxess-results-10 .mx-hero-actions,#maxess-results-10 .mx-growth-cta,#maxess-results-10 .mx-micro,#maxess-results-10 .mx-mini{display:none!important}
 #maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(5,1fr)!important;gap:8px!important}
 #maxess-results-10 .mx-dim{min-height:180px!important;background:#fff!important;border:1px solid #bbb!important;box-shadow:none!important}
 #maxess-results-10 .mx-dim::before,#maxess-results-10 .mx-dim::after{display:none!important}
 #maxess-results-10 .mx-dim-head{margin-top:0!important}
 #maxess-results-10 .mx-dim-head strong,#maxess-results-10 .mx-dim-head h3,#maxess-results-10 .mx-lever b{color:#111!important}
 .ny-page-inner{break-before:page!important}
}
@media(max-width:1150px){#maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:760px){#maxess-results-10 .mx-hero{min-height:auto!important;padding-top:50px!important}#maxess-results-10 .mx-score-orb{width:min(440px,84vw)!important}#maxess-results-10 .mx-dim-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}}
@media(max-width:520px){#maxess-results-10 .mx-dim-grid{grid-template-columns:1fr!important}#maxess-results-10 .mx-dim{min-height:300px!important}}
@media(prefers-reduced-motion:reduce){#maxess-results-10 .mx-score-orb{animation:none!important}#maxess-results-10 .mx-dim,#maxess-results-10 .mx-cta{transition:none!important}}
</style>
<script id="maxess-results-v4-refinement-js">
(function(){
 'use strict';
 const root=document.getElementById('maxess-results-10'); if(!root)return;
 const result=window.MAXESS_RESULT||{};
 const score=Number(result.overallScore??result.score);
 function color(s){if(s<50)return['#ff4b55','#ff9c45'];if(s<65)return['#ff9c45','#ffd65a'];if(s<75)return['#ffd65a','#42dc99'];if(s<85)return['#42dc99','#4fe4ff'];if(s<90)return['#4fe4ff','#4d9dff'];if(s<95)return['#4d9dff','#9b63ff'];return['#9b63ff','#ed5bd4']}
 function reorder(){const ids=['naya-report','your-dimensions','what-it-means','your-strengths','biggest-lever','your-next-move','naya-masters','naya-playground'];ids.map(id=>document.getElementById(id)).filter(Boolean).forEach(n=>root.appendChild(n));const media=root.querySelector('.naya-final-solution');if(media)root.appendChild(media)}
 if(Number.isFinite(score)){const [a,b]=color(Math.max(0,Math.min(100,score)));const orb=root.querySelector('.mx-score-orb');if(orb){orb.style.setProperty('--v4-a',a);orb.style.setProperty('--v4-b',b)}}
 root.querySelectorAll('.mx-dim').forEach(card=>{const n=Number(card.getAttribute('data-score')||card.querySelector('.mx-dim-head strong')?.textContent);if(Number.isFinite(n))card.style.setProperty('--score',Math.max(0,Math.min(100,n)))})
 reorder();
 if(!root.querySelector('.v4-print')){const host=root.querySelector('.mx-hero-actions');if(host){const b=document.createElement('button');b.className='mx-cta mx-cta-ghost v4-print';b.type='button';b.innerHTML='Print / Save PDF <span aria-hidden="true">↗</span>';b.addEventListener('click',()=>window.print());host.appendChild(b)}}
 root.setAttribute('data-results-refinement','v4');
})();
</script>
