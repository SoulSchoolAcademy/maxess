<script>
(function(){
'use strict';
const root=document.getElementById('maxess-results-10');

const txt=el=>el?el.textContent.replace(/\s+/g,' ').trim():'';

const score=()=>{const r=window.MAXESS_RESULT||{};const n=Number(r.overallScore);if(Number.isFinite(n))return n;const el=$('.mx-score strong');return el?Number(el.textContent.replace(/[^0-9.]/g,'')):82};
function colorFor(s){const stops=[[0,[255,52,52]],[49,[255,145,35]],[64,[255,215,55]],[74,[80,220,115]],[84,[35,205,185]],[89,[45,140,255]],[94,[120,80,245]],[100,[245,65,210]]];let a=stops[0],b=stops[stops.length-1];for(let i=0;i<stops.length-1;i++){if(s>=stops[i][0]&&s<=stops[i+1][0]){a=stops[i];b=stops[i+1];break}}const t=(s-a[0])/(b[0]-a[0]||1),c=a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*t));return `rgb(${c.join(',')})`}

const hero=$('.mx-hero');
if(hero){const grid=$('.mx-hero-grid',hero),left=grid&&grid.firstElementChild,orb=$('.mx-score-orb',hero);if(left&&orb){left.innerHTML=`<span class="mx-eyebrow">MAXESS AI MASTERY ASSESSMENT</span><h1 class="mx-title">YOUR AI SCORE</h1><p class="hero-score-whisper">A snapshot of how you currently work with AI.</p><div class="mx-hero-actions"><a class="mx-cta mx-cta-primary" href="#naya-report">See Your Results <span aria-hidden="true">↓</span></a></div>`;const strong=$('.mx-score strong',orb);if(strong)strong.textContent=String(Math.round(s));const label=$('.mx-score span',orb);if(label)label.textContent='YOUR AI SCORE';const band=$('.mx-band',orb);if(band)band.textContent=s>=90?'Exceptional':s>=75?'Advancing':s>=65?'Developing':'Building';orb.style.setProperty('--score-color',colorFor(s));orb.setAttribute('aria-label',`Your MAXESS AI score is ${Math.round(s)} out of 100`)}}

else{report.id='naya-report';report.classList.add('naya-report-section');if(!$('.naya-presence',report))(report.querySelector('.mx-wide')||report.querySelector('.mx-reading'))?.prepend(nayaCard("I've looked at your results. Let's make sense of what they reveal about you.",'dark'))}

else{lever.id='biggest-lever';lever.classList.add('naya-lever-section');const h2=$('h2',lever);if(h2)h2.innerHTML='YOUR BIGGEST<br>LEVER';if(!$('.naya-presence',lever))(lever.querySelector('.mx-wide')||lever.querySelector('.mx-reading'))?.prepend(nayaCard("If I were helping you improve one thing first, this is where I'd start.",'light'))}
let next=findSection(['YOUR NEXT CHAPTER','FROM CAPABILITY']);
if(next){next.id='your-next-move';const h2=$('h2',next);if(h2)h2.innerHTML='YOUR<br>NEXT MOVE';const p=$('.mx-section-head p',next);if(p)p.textContent='One focused move beats ten scattered improvements. Start where your leverage is highest.'}
let pathways=findSection(['YOUR 18 AI PATHWAYS','18 AI PATHWAYS']);
if(pathways){pathways.id='naya-masters';pathways.classList.add('naya-masters-section');const h2=$('h2',pathways);if(h2)h2.innerHTML='18 NAYA<br>MASTERS';const p=$('.mx-section-head p',pathways);if(p)p.textContent='Specialist AI Masters you can call on when you want to turn a capability into exceptional results.';if(!$('.naya-presence',pathways))(pathways.querySelector('.mx-wide')||pathways.querySelector('.mx-reading'))?.prepend(nayaCard('You do not need to master every part of AI yourself. These are the specialists you can call on when you need them.','dark'))}
$$('.mx-dim',fingerprint||root).forEach((card,i)=>{const raw=Number(card.getAttribute('data-score')||txt($('strong',card)).replace(/[^0-9.]/g,''));const ds=Number.isFinite(raw)?raw:0;card.style.setProperty('--dim-color',colorFor(ds));card.classList.add('naya-dimension-card');const track=$('.mx-track span',card);if(track)track.style.background=`linear-gradient(90deg,${colorFor(Math.max(0,ds-18))},${colorFor(ds)})`;const title=$('h3',card);if(title)title.setAttribute('data-dimension-index',String(i+1))});
const narrative=[hero,report,fingerprint,meaning,strengths,lever,next,pathways].filter(Boolean);let insertion=hero;narrative.forEach(sec=>{if(sec!==hero){root.insertBefore(sec,insertion.nextSibling);insertion=sec}});
