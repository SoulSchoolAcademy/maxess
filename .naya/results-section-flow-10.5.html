<script id="naya-law-section-flow-10-5-js">
(function(){
 'use strict';
 function boot(){
  var root=document.getElementById('maxess-results-10');if(!root)return;
  var sections=Array.prototype.slice.call(root.querySelectorAll(':scope > section'));
  function byText(re){return sections.find(function(s){return re.test((s.textContent||'').toLowerCase())});}
  var hero=root.querySelector('.mx-hero');
  var naya=document.getElementById('naya-report');
  var fp=document.getElementById('your-fingerprint');
  var dims=byText(/every score has|what it means/);
  var advantage=byText(/natural advantage|what you already/);
  var growth=document.getElementById('growth-scorecard');
  var path=byText(/your next chapter|capability to compounding/);
  var pathways=byText(/your 18 ai pathways|don.t learn ai/);
  var playground=document.getElementById('naya-playground');
  [hero,naya,fp,dims,advantage,growth,path,pathways,playground].forEach(function(s){if(s)root.appendChild(s)});
  root.setAttribute('data-section-flow','10.5');
  var score=root.querySelector('.mx-score strong');
  var value=Number((window.MAXESS_RESULT||{}).overallScore||score&&score.textContent||0);
  if(score&&value>=75&&value<85){score.style.background='linear-gradient(110deg,#39df91,#46e5ff,#4c9dff)';score.style.webkitBackgroundClip='text';score.style.backgroundClip='text';score.style.color='transparent';}
  root.querySelectorAll('.mx-dim').forEach(function(card){var n=Number(card.getAttribute('data-score'));if(Number.isFinite(n))card.style.setProperty('--score',n);});
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(boot,80)},{once:true});else setTimeout(boot,80);
})();
</script>
