<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAXESS — Your AI Mastery Results</title><style>:root{--bg:#050307;--ink:#fff;--muted:#9d96a7;--line:#ffffff1c;--p:#a66cff;--v:#d7b0ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.m{min-height:100vh;background:radial-gradient(ellipse 80% 30% at 50% 0,#a66cff35,transparent 70%),linear-gradient(#11071a,#050307 35%,#030204)}.w{width:min(1180px,calc(100% - 30px));margin:auto}.hero{text-align:center;padding:22px 0 70px}.n{display:flex;align-items:center;gap:14px;text-align:left;width:min(720px,100%);margin:0 auto 22px;padding:12px 15px;border:1px solid #c89cff3b;border-radius:22px;background:#ffffff09}.n img{width:58px;height:58px;object-fit:cover;border-radius:50%;border:1px solid #fff5}.n b{display:block}.n small{display:block;color:#aaa1b2;margin-top:3px;line-height:1.4}.listen{margin-left:auto;white-space:nowrap;border:1px solid #d8b6ff55;border-radius:999px;padding:10px 14px;background:#a66cff18;color:#fff;font-weight:800;font-size:11px;cursor:pointer}.ey{font-size:10px;font-weight:900;letter-spacing:.2em;color:#d8b6ff;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,84px);line-height:.92;letter-spacing:-.065em;margin:28px auto 14px}.hero h1 em{font-style:normal;color:#d2a9ff}.sub{max-width:690px;margin:auto;color:#b0a8b7;line-height:1.6}.orb{width:min(500px,80vw);aspect-ratio:1;margin:38px auto 25px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#ff4545,#ffe56b 25%,#58e18b 38%,#50ddff 50%,#6472ff 64%,#a75bff 78%,#ff4fb7 92%,#ff4545);box-shadow:0 0 90px #a66cff55;animation:spin 28s linear infinite}.orb:before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 30% 20%,#fff,transparent 5%,#fff2 12%,transparent 29%),radial-gradient(circle,#28153f,#0b0712 57%,#020207);box-shadow:inset 0 -70px 90px #000b}.orb:after{content:"";position:absolute;inset:9%;border:1px solid #fff5;border-radius:50%}.score{position:relative;z-index:2}.score strong{display:block;font-size:clamp(105px,16vw,190px);line-height:.78;letter-spacing:-.08em}.score span{display:block;margin-top:20px;color:#d0a8ff;font-size:12px;font-weight:900;letter-spacing:.25em}.band{margin-top:10px;font-weight:900}.mini{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 28px}.mo{width:104px;height:104px;border-radius:50%;position:relative;display:grid;place-items:center;border:1px solid #fff2;background:radial-gradient(circle,#20132e,#09050e 68%);box-shadow:inset 0 1px #fff2,0 15px 35px #0006;transition:.2s}.mo:before{content:"";position:absolute;inset:6px;border-radius:50%;background:conic-gradient(#a66cff var(--p),#fff1 0);opacity:.9}.mo:after{content:"";position:absolute;inset:11px;border-radius:50%;background:#09050e}.mo b,.mo small{position:relative;z-index:2}.mo b{font-size:22px}.mo small{position:absolute;bottom:14px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:7px;text-transform:uppercase;letter-spacing:.05em;color:#aaa}.mo:nth-child(2):before{background:conic-gradient(#50ddff var(--p),#fff1 0)}.mo:nth-child(3):before{background:conic-gradient(#51e2ad var(--p),#fff1 0)}.mo:nth-child(4):before{background:conic-gradient(#f7d58c var(--p),#fff1 0)}.mo:nth-child(5):before{background:conic-gradient(#ff6bbd var(--p),#fff1 0)}.mo:hover{transform:translateY(-5px) scale(1.03);border-color:#d8b6ff66}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.a{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 18px;border-radius:14px;border:1px solid var(--line);color:#fff;text-decoration:none;font-size:12px;font-weight:850}.primary{background:linear-gradient(135deg,#a55cff,#6d2bd1)}section{padding:72px 0;border-top:1px solid #fff1}.head{display:flex;justify-content:space-between;gap:25px;align-items:end;margin-bottom:28px}.head h2{font-size:clamp(34px,5vw,60px);line-height:.95;letter-spacing:-.055em;margin:8px 0}.head p{max-width:500px;color:#aaa1b2;line-height:1.6}.quote{text-align:center;width:min(850px,100%);margin:auto;font-size:clamp(28px,4vw,48px);line-height:1.05}.quote strong{color:#d8b1ff}.muted{color:#aaa1b2;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:23px;border:1px solid var(--line);border-radius:22px;background:#fff1}.card h3{margin:9px 0;font-size:21px}.card p{color:#aaa1b2;font-size:13px;line-height:1.55}.lever{margin-top:15px;padding:12px;border-radius:13px;background:#a66cff10;border:1px solid #a66cff25}.lever small{color:#c99dff;font-weight:900;letter-spacing:.12em}.lever b{display:block;margin-top:5px;font-size:12px}.fp{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.radar{position:relative}.radar svg{width:100%;display:block}.rc{position:absolute;inset:0;display:grid;place-items:center}.rc div{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;background:#050307e8;border:1px solid #fff2}.rc b{font-size:34px}.rc small{color:#999;font-size:8px;text-transform:uppercase}.rows{display:grid;gap:10px}.row{padding:15px;border:1px solid var(--line);border-radius:16px}.rt{display:flex;justify-content:space-between}.bar{height:6px;margin-top:10px;border-radius:9px;background:#fff1;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#7b3ce0,#d7b0ff,#50ddff)}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{padding:20px;border:1px solid var(--line);border-radius:18px;background:#fff1}.step b{font-size:9px;color:#cfa5ff}.step h3{margin:9px 0}.step p{margin:0;color:#aaa1b2;font-size:12px;line-height:1.5}.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.path{padding:19px;border:1px solid var(--line);border-radius:18px;background:#fff1}.path small{color:#a979ed;font-weight:900}.path h3{font-size:15px;margin:7px 0}.path p{color:#aaa1b2;font-size:12px;line-height:1.45;margin:0}.end{text-align:center;padding:90px 0}.endbox{padding:45px 25px;border:1px solid #c99dff33;border-radius:30px;background:#fff1}.end img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:1px solid #fff4}.end h2{font-size:clamp(34px,5vw,58px);letter-spacing:-.05em;margin:18px 0 10px}.status{color:#888;font-size:11px;margin-top:14px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:900px){.grid,.paths{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.fp{grid-template-columns:1fr}.head{display:block}.head p{margin-top:14px}}@media(max-width:600px){.w{width:calc(100% - 22px)}.n{flex-wrap:wrap}.listen{margin-left:0}.orb{width:92vw}.mo{width:82px;height:82px}.mo b{font-size:18px}.mo small{bottom:10px;font-size:6px}.grid,.paths,.steps{grid-template-columns:1fr}.hero h1{font-size:clamp(42px,14vw,70px)}}@media(prefers-reduced-motion:reduce){.orb{animation:none}}
</style></head><body><main id="maxess-v17" class="m"></main><script>
(()=>{const N='https://i.postimg.cc/dVXw7sRN/grok-image-f75a6f12-4e3a-4c99-a334-5684ba0f7401.jpg',P=[['Writing & Communication','Turn ideas into clear instructions, messages, stories, and decisions.'],['Research & Information','Find, compare, synthesize, and explain useful information.'],['Brainstorming & Ideas','Expand possibilities without losing the goal.'],['Content Creation','Create useful, human content faster and better.'],['Business & Strategy','Turn insight into positioning, offers, decisions, and plans.'],['Marketing & Sales','Make value understandable and action easier.'],['Learning & Education','Use AI as a tutor, curriculum designer, and thinking partner.'],['Coding & Software','Build, debug, explain, and improve software with AI.'],['Images & Visual Creation','Turn concepts into visual communication and creative assets.'],['Video & Media','Plan, script, edit, package, and distribute media.'],['Documents & Presentations','Transform raw thinking into polished deliverables.'],['Data & Analysis','Use evidence, structure, and models to make better decisions.'],['Productivity & Planning','Turn intention into organized execution.'],['Career & Professional Development','Build skills, positioning, confidence, and opportunity.'],['Personal Decision-Making','Think through choices with more clarity and less noise.'],['Creative Work','Explore, shape, and finish original creative work.'],['Automation & Systems','Connect repeatable work into reliable systems.'],['Advanced AI Work','Orchestrate models, agents, tools, context, and evaluation.']],D={overallScore:82,band:'Advancing',dimensions:[{id:'1',name:'Direction',score:86},{id:'2',name:'Communication',score:91},{id:'3',name:'Evaluation',score:79},{id:'4',name:'Iteration',score:74},{id:'5',name:'Systems Thinking',score:68}]};
function get(){let r=window.MAXESS_RESULT;if(!r){try{let q=new URLSearchParams(location.search).get('result');if(q){let s=q.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';r=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))) )}}catch(e){}}if(!r&&new URLSearchParams(location.search).get('fixture')==='demo')r=D;return r}
function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function c(n){return Math.max(0,Math.min(100,Number(n)||0))}function B(n){return n<=50?'Foundation':n<=75?'Developing':n<=90?'Advancing':'Mastering'}function render(){let r=get();if(!r){document.querySelector('#maxess-v17').innerHTML='<div class="hero"><div class="w"><div class="ey">MAXESS RESULTS</div><h1>Your result is being prepared.</h1><p class="sub">No score has been invented or substituted. The personalized MAXESS result is not available yet.</p></div></div>';return}let s=Math.round(c(r.overallScore)),d=(Array.isArray(r.dimensions)?r.dimensions:D.dimensions).slice(0,5).map((x,i)=>({id:x.id||i+1,name:x.name||`Dimension ${i+1}`,score:Math.round(c(x.score))}));while(d.length<5)d.push({id:d.length+1,name:`Dimension ${d.length+1}`,score:0});let b=B(s),z=[...d].sort((a,x)=>x.score-a.score),hi=z[0],lo=z[4],a=i=>-90+i*72,pt=(i,v,R=180)=>{let q=a(i)*Math.PI/180,r=R*v/100;return `${250+Math.cos(q)*r},${250+Math.sin(q)*r}`},rings=[20,40,60,80,100].map(v=>`<polygon points="${d.map((_,i)=>pt(i,v)).join(' ')}" fill="none" stroke="#fff1"/>`).join(''),axes=d.map((_,i)=>{let q=a(i)*Math.PI/180;return `<line x1="250" y1="250" x2="${250+Math.cos(q)*180}" y2="${250+Math.sin(q)*180}" stroke="#fff1"/>`}).join(''),pts=d.map((x,i)=>{let q=a(i)*Math.PI/180,r=180*x.score/100;return `<circle cx="${250+Math.cos(q)*r}" cy="${250+Math.sin(q)*r}" r="6" fill="#fff" stroke="#a66cff" stroke-width="3"/>`}).join('');let rows=d.map((x,i)=>`<div class="row"><div class="rt"><b>${String(i+1).padStart(2,'0')} · ${e(x.name)}</b><strong>${x.score}</strong></div><div class="bar"><i style="--w:${x.score}%"></i></div></div>`).join(''),mini=d.map(x=>`<div class="mo" style="--p:${x.score}%" tabindex="0"><b>${x.score}</b><small>${e(x.name)}</small></div>`).join(''),cards=d.map((x,i)=>`<article class="card"><div class="ey">${String(i+1).padStart(2,'0')} · ${x.score}/100</div><h3>${e(x.name)}</h3><p>${x.id===hi.id?'This is a current strength you can turn into leverage and reusable capability.':x.id===lo.id?'This is the clearest current opportunity for deliberate improvement.':'This capability is part of your current profile and improves through practice.'}</p><div class="lever"><small>${x.id===hi.id?'STRENGTH':x.id===lo.id?'HIGHEST-LEVERAGE OPPORTUNITY':'LEVER'}</small><b>${x.id===hi.id?'Turn this strength into reusable instructions, frameworks, and systems.':x.id===lo.id?'Practice this on one real workflow repeatedly until improvement is visible.':'Create, score, improve, repeat.'}</b></div></article>`).join(''),paths=P.map((x,i)=>`<article class="path"><small>${String(i+1).padStart(2,'0')}</small><h3>${e(x[0])}</h3><p>${e(x[1])}</p></article>`).join(''),steps=[['01 · DIRECT','Know the outcome','Define success before AI begins.'],['02 · CREATE','Build the first version','Give AI enough context and direction.'],['03 · SCORE','Judge the work','Use criteria instead of accepting the first answer.'],['04 · COMPOUND','Make it reusable','Turn successful work into a repeatable system.']].map(x=>`<article class="step"><b>${x[0]}</b><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('');document.querySelector('#maxess-v17').innerHTML=`<section class="hero"><div class="w"><div class="n"><img src="${N}" alt="Naya, your MAXESS guide"><div><b>Hi. I've looked at your results.</b><small>I'm Naya, your guide. This isn't your judgment. It's your map.</small></div><button id="listen" class="listen">▶ Listen to Naya</button></div><div class="ey">MAXESS · YOUR PERSONAL AI MASTERY REPORT</div><h1>Your AI Score is <em>${s}</em>.</h1><p class="sub">Your score is the beginning, not the verdict. Here is the pattern behind it, what you already have working, where the leverage is, and what to do next.</p><div class="orb"><div class="score"><strong>${s}</strong><span>AI SCORE</span><div class="band">${b}</div></div></div><div class="mini">${mini}</div><div class="actions"><a class="a primary" href="#map">See My Map ↓</a><a class="a" href="#paths">Explore My 18 Pathways →</a></div></div></section><section><div class="w"><div class="quote"><div class="ey">THE SHORT VERSION</div><p>You already have something real. <strong>Your next leap is leverage.</strong></p><p class="muted">The highest-value move is becoming better at directing the work, judging the result, and turning what works into a repeatable system.</p></div></div></section><section id="map"><div class="w"><div class="head"><div><div class="ey">01 · YOUR FINGERPRINT</div><h2>See the pattern,<br>not just the score.</h2></div><p>Five dimensions show where your current capability is strong, where it is developing, and where improvement can create disproportionate upside.</p></div><div class="fp"><div class="radar"><svg viewBox="0 0 500 500">${rings}${axes}<polygon points="${d.map((x,i)=>pt(i,x.score)).join(' ')}" fill="#a66cff33" stroke="#d2a9ff" stroke-width="3"/>${pts}</svg><div class="rc"><div><b>${s}</b><small>overall</small></div></div></div><div class="rows">${rows}</div></div></div></section><section><div class="w"><div class="head"><div><div class="ey">02 · WHAT IT MEANS</div><h2>Every score has<br>a job.</h2></div><p>A result becomes useful when you know what it means and what to do with it.</p></div><div class="grid">${cards}</div></div></section><section><div class="w"><div class="head"><div><div class="ey">03 · YOUR ADVANTAGE</div><h2>What you already<br>have working.</h2></div></div><div class="grid"><article class="card"><div class="ey">NATURAL ADVANTAGE</div><h3>${e(hi.name)}</h3><p>${hi.score}/100 is your strongest current signal. Build on it.</p></article><article class="card"><div class="ey">HIGHEST-LEVERAGE OPPORTUNITY</div><h3>${e(lo.name)}</h3><p>${lo.score}/100 is your clearest current opportunity for deliberate improvement.</p></article></div></div></section><section><div class="w"><div class="head"><div><div class="ey">04 · YOUR NEXT CHAPTER</div><h2>From capability<br>to compounding.</h2></div><p>Mastery is the ability to make strengths repeatable, measurable, and increasingly valuable.</p></div><div class="steps">${steps}</div></div></section><section id="paths"><div class="w"><div class="head"><div><div class="ey">05 · YOUR 18 AI PATHWAYS</div><h2>Don't learn AI.<br>Learn what AI can do for you.</h2></div><p>These are 18 capability doors. Explore the ones that matter most to your goals, then build depth.</p></div><div class="paths">${paths}</div></div></section><section><div class="w"><div class="head"><div><div class="ey">06 · TURN INSIGHT INTO GROWTH</div><h2>Know where you are.<br>Know what moves you.</h2></div><p>Protect the strength. Build the lever. Make progress repeatable.</p></div><div class="grid"><article class="card"><div class="ey">NEXT 01</div><h3>Protect your strength</h3><p>Use ${e(hi.name)} as your directing advantage.</p></article><article class="card"><div class="ey">NEXT 02</div><h3>Build your lever</h3><p>Practice ${e(lo.name)} on one repeated workflow.</p></article><article class="card"><div class="ey">NEXT 03</div><h3>Make quality visible</h3><p>Score every meaningful AI output before accepting it.</p></article></div></div></section><section class="end"><div class="w"><div class="endbox"><img src="${N}" alt="Naya"><div class="ey" style="margin-top:18px">PERSONALIZED REPORT</div><h2>You've seen the pattern.<br>Now hear what it means.</h2><p class="muted">Naya is your guide for turning the result into a practical conversation about where you are, where you can go, and what to do next.</p><div id="status" class="status">Choose Listen to Naya at the top to hear the report.</div></div></div></section>`;document.querySelector('#listen').onclick=()=>{if(!('speechSynthesis'in window)){status.textContent='Speech preview is not available in this browser.';return}speechSynthesis.cancel();let t=`Hello. I'm Naya. I've looked at your MAXESS results. Your score is ${s} out of 100, placing you in the ${b} range. This isn't your judgment. It's your map. Your strongest dimension is ${hi.name} at ${hi.score}. Your biggest opportunity is ${lo.name} at ${lo.score}. The next step is to protect your strength, build your lever, and make quality repeatable.`;let u=new SpeechSynthesisUtterance(t);u.rate=.94;u.onstart=()=>status.textContent='Naya is speaking your report.';u.onend=()=>status.textContent='Naya has finished your report.';speechSynthesis.speak(u)}}render()})();
</script></body></html>
