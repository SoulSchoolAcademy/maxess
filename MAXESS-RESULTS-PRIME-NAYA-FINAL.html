function draw(r){const c=document.querySelector('#radar'),b=c.getBoundingClientRect(),size=Math.max(300,Math.floor(Math.min(b.width||560,b.height||560))),dpr=Math.min(devicePixelRatio||1,2);c.width=size*dpr;c.height=size*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const cx=size/2,cy=size/2,R=size*.32,n=5;x.clearRect(0,0,size,size);for(let q=1;q<=4;q++){const rr=R*q/4;x.beginPath();for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n,px=cx+Math.cos(a)*rr,py=cy+Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.strokeStyle=q===4?'#d7baff44':'#ffffff12';x.stroke()}D.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);x.strokeStyle='#ffffff12';x.stroke()});x.beginPath();D.forEach((d,i)=>{const v=r.dimensions[d.id]/100,a=-Math.PI/2+i*2*Math.PI/n,px=cx+Math.cos(a)*R*v,py=cy+Math.sin(a)*R*v;i?x.lineTo(px,py):x.moveTo(px,py)});x.closePath();x.fillStyle='#a66cff22';x.fill();x.strokeStyle='#d7baff';x.lineWidth=2;x.stroke();D.forEach((d,i)=>{const v=r.dimensions[d.id]/100,a=-Math.PI/2+i*2*Math.PI/n,px=cx+Math.cos(a)*R*v,py=cy+Math.sin(a)*R*v;x.beginPath();x.arc(px,py,6,0,Math.PI*2);x.fillStyle=d.color;x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()})}
